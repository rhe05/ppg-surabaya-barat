  <style>
    :root {
      --brass: #D97706;
      --sage: #059669;
      --brand-green: #6B9975;
      --volt: #FBBF24;
      --red: #DC2626;
      --indigo: #4F46E5;
      --teal: #0D9488;
      --panel: #FFFFFF;
      --panel-2: #F9FAFB;
      --bg: #F8FAFC;
      --border: #E2E8F0;
      --text: #0F172A;
      --text-dim: #64748B;
      --text-faint: #94A3B8;
      --radius: 8px;
      --radius-lg: 14px;
      --radius-button: 999px;
      --shadow-card: 0 2px 12px rgba(15, 23, 42, 0.08);
      --shadow-subtle: 0 1px 3px rgba(15, 23, 42, 0.06);
      --topbar-height: 56px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ═════ LOGIN SCREEN ═════ */
    /* Disembunyikan secara default (bukan display:flex) supaya tidak sempat
       "berkedip" muncul sebelum window.onload selesai cek DEV_MODE_SKIP_LOGIN.
       Ditampilkan lagi lewat JS (lihat window.onload/verifySession) hanya kalau
       mode dev nonaktif dan memang perlu login sungguhan. */
    #screenLogin {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: var(--panel);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
    }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      margin-bottom: 36px;
    }

    .login-brand-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--brand-green);
    }

    .login-form-group {
      margin-bottom: 16px;
    }

    .login-form-group:first-of-type {
      margin-top: 24px;
    }

    .login-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .login-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
    }

    .login-input:focus {
      outline: none;
      border-color: var(--brass);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1);
    }

    .login-btn {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      background: var(--brass);
      color: white;
      border: none;
      border-radius: var(--radius-button);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-error {
      background: #FEF2F2;
      color: var(--red);
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 13px;
      margin-top: 20px;
      display: none;
    }

    .login-dev-banner {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      color: #92400E;
      border-radius: var(--radius);
      padding: 12px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 24px;
      display: none;
    }

    /* ═════ APP LAYOUT (after login) ═════ */
    .app-layout {
      display: flex;
      height: 100vh;
      background: var(--panel);
      gap: 0;
    }

    .app-sidebar {
      width: 240px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      max-height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
      transition: width 0.3s, margin-left 0.3s;
    }

    .app-sidebar.collapsed {
      width: 68px;
      /* Tooltip keterangan icon menjulur keluar sidebar — wajib visible.
         Aman: saat collapsed semua submenu tree disembunyikan, konten pendek,
         tidak butuh scroll. */
      overflow: visible;
    }

    .app-sidebar.collapsed .sidebar-logo-text,
    .app-sidebar.collapsed .sidebar-menu span:last-child,
    .app-sidebar.collapsed .sidebar-toggle-btn,
    .app-sidebar.collapsed .sidebar-logout span:last-child {
      display: none;
    }

    .app-sidebar.collapsed .sidebar-menu-link {
      justify-content: center;
      padding: 12px;
    }

    .app-sidebar.collapsed .sidebar-logo {
      justify-content: center;
      padding: 0;
    }

    /* Saat collapsed: logo merangkap tombol pelebaran (toggle-btn disembunyikan).
       Saat lebar: logo tidak bisa diklik (pointer-events none) agar tidak
       tak sengaja menciutkan — pakai tombol chevron. */
    .sidebar-logo-brand {
      pointer-events: none;
    }

    .app-sidebar.collapsed .sidebar-logo-brand {
      pointer-events: auto;
      cursor: pointer;
      position: relative;
    }

    .app-sidebar.collapsed .sidebar-logout {
      justify-content: center;
      padding: 12px;
    }

    /* Tooltip keterangan saat collapsed — muncul instan di kanan icon */
    .app-sidebar.collapsed [data-tip] {
      position: relative;
    }

    .app-sidebar.collapsed [data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%);
      background: var(--text);
      color: #fff;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1;
      padding: 7px 11px;
      border-radius: 6px;
      white-space: nowrap;
      z-index: 1200;
      box-shadow: var(--shadow-card);
      pointer-events: none;
    }

    .sidebar-logo {
      height: var(--topbar-height);
      padding: 0 14px 0 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--panel);
    }

    .sidebar-logo-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      overflow: hidden;
    }

    .brand-mark {
      flex-shrink: 0;
      object-fit: contain;
    }

    .sidebar-logo-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--brand-green);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-menu {
      flex: 1;
      padding: 20px 0;
      list-style: none;
      margin: 0;
    }

    .sidebar-menu-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.2s;
    }

    /* Icon SVG monochrome (standar line-icon): mewarisi warna link via
       currentColor — abu saat non-aktif, emas saat aktif/hover. */
    .sidebar-icon {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
      stroke: currentColor;
      opacity: 0.9;
    }

    .sidebar-menu-link.active .sidebar-icon {
      opacity: 1;
    }

    .sidebar-menu-link:hover {
      color: var(--text);
      background: var(--panel-2);
    }

    .sidebar-menu-link.active {
      color: var(--brass);
      background: rgba(217, 119, 6, 0.05);
      border-left-color: var(--brass);
      font-weight: 600;
    }

    /* ═════ SIDEBAR: DESA/KELOMPOK TREE ═════ */
    .sidebar-caret {
      margin-left: auto;
      font-size: 9px;
      color: var(--text-faint);
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }

    .sidebar-caret.rotated {
      transform: rotate(90deg);
    }

    .sidebar-tree {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease;
    }

    .sidebar-tree.open {
      max-height: 400px;
    }

    .sidebar-tree-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px 10px 48px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sidebar-tree-link:hover {
      color: var(--text);
      background: var(--panel-2);
    }

    .sidebar-tree-link.disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .sidebar-tree-link.disabled:hover {
      background: transparent;
      color: var(--text-dim);
    }

    .sidebar-tree-link-2 {
      display: block;
      padding: 9px 20px 9px 68px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sidebar-tree-link-2:hover {
      color: var(--text);
      background: var(--panel-2);
    }

    .sidebar-tree-link-2.active {
      color: var(--brass);
      background: rgba(217, 119, 6, 0.08);
      font-weight: 600;
    }

    .sidebar-tree-link-2.disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .sidebar-tree-link-2.disabled:hover {
      background: transparent;
      color: var(--text-dim);
    }

    /* Level-3 submenu sidebar (khusus Kelp Petemon, ERROR_LOG-free rollout
       pilot): Dashboard/Data Master/Operasional/Kurikulum/Monitoring/Laporan
       nempel di bawah baris kelompoknya, gaya sama dgn sidebar-tree/-tree-2
       (accordion max-height) tapi versi bawa ikon + state aktif lebih cerah. */
    .sidebar-tree-link-3 {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px 9px 68px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sidebar-tree-link-3:hover {
      color: var(--text);
      background: var(--panel-2);
    }

    .sidebar-tree-link-3.active {
      color: #fff;
      background: linear-gradient(135deg, #F59E0B 0%, var(--brass) 100%);
      font-weight: 700;
      box-shadow: 0 2px 8px -2px rgba(217, 119, 6, 0.5);
    }

    .sidebar-icon-3 {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .app-sidebar.collapsed .sidebar-menu-text,
    .app-sidebar.collapsed .sidebar-caret {
      display: none;
    }

    .app-sidebar.collapsed .sidebar-tree {
      display: none !important;
    }

    .sidebar-footer {
      padding: 8px 0;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      position: sticky;
      bottom: 0;
      z-index: 5;
      background: var(--panel);
    }

    .sidebar-logout {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      background: transparent;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-dim);
      font-family: inherit;
      text-align: left;
    }

    .sidebar-logout:hover {
      background: rgba(220, 38, 38, 0.05);
      color: var(--red);
    }

    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header TIDAK ikut scroll: yang menggulir hanya blok konten di bawahnya,
       supaya batang scroll mulai di bawah header (tidak menembus blok atas /
       card admin). Tiap screen = .dash-header + tepat satu elemen konten
       (+ .modal-overlay yang position:fixed, jadi tidak terpengaruh). */
    .screen-wrapper {
      display: none;
      overflow: hidden;
      flex: 1;
      min-height: 0;
    }

    .screen-wrapper.active {
      display: flex;
      flex-direction: column;
    }

    .screen-wrapper.active > .dash-header + * {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    /* .dash-container aslinya max-width:1200px + margin auto. Karena elemen ini
       kini yang menggulir, batang scroll-nya ikut tepi kotak 1200px yang
       ter-center — sehingga bergeser ke DALAM saat sidebar diciutkan (area
       melebar >1200px). Solusi: kotaknya dibuat selebar penuh (scroll tetap di
       pojok kanan) dan isinya yang di-center lewat padding. */
    .screen-wrapper.active > .dash-header + .dash-container {
      max-width: none;
      padding-left: max(20px, calc((100% - 1200px) / 2));
      padding-right: max(20px, calc((100% - 1200px) / 2));
    }

    /* ═════ DASHBOARD SCREEN ═════ */
    .dash-header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0 200px 0 20px;
      height: var(--topbar-height);
      box-shadow: var(--shadow-subtle);
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      flex-shrink: 0;
    }

    /* Card admin — global, fixed kanan atas viewport, tampil di SEMUA screen
       (bukan child dari .dash-header, jadi tidak ikut disembunyikan saat
       .screen-wrapper lain yang aktif) */
    /* Panel kanan atas global: tombol refresh + card admin, sejajar. */
    .gk-topright {
      position: fixed;
      top: 12px;
      right: 20px;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Toast konfirmasi singkat (muncul di bawah panel kanan atas) */
    .gk-toast {
      position: fixed;
      top: 56px;
      right: 20px;
      z-index: 1300;
      padding: 9px 16px;
      border-radius: 999px;
      background: var(--text);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: var(--shadow-card);
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .gk-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .gk-refresh-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 50%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-subtle);
      color: var(--text-dim);
      cursor: pointer;
      flex-shrink: 0;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .gk-refresh-btn:hover {
      color: var(--brass);
      border-color: var(--brass);
    }

    .gk-refresh-btn svg {
      transition: transform 0.5s ease;
    }

    .gk-refresh-btn:hover svg {
      transform: rotate(180deg);
    }

    .dash-header-admin-card {
      display: flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-subtle);
      flex-shrink: 0;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .dash-container {
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .dash-section-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 20px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 48px;
    }

    .kpi-card {
      background: var(--panel);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border);
      text-align: center;
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 36px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 8px;
    }

    .kpi-unit {
      font-size: 13px;
      color: var(--text-faint);
    }

    .kpi-card.accent-sage .kpi-value { color: var(--sage); }
    .kpi-card.accent-brass .kpi-value { color: var(--brass); }
    .kpi-card.accent-volt .kpi-value { color: var(--volt); }

    /* ═════ DASHBOARD GURU (per Kelompok — premium KPI cards) ═════ */
    .guru-dash-context-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #F59E0B 0%, var(--brass) 55%, #B45309 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .guru-dash-context-icon {
      width: 22px;
      height: 36px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .guru-dash-kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 20px;
    }

    .guru-dash-kpi-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 26px 24px 22px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03), 0 10px 24px -12px rgba(15, 23, 42, 0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .guru-dash-kpi-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.05), 0 16px 32px -14px rgba(15, 23, 42, 0.18);
    }

    .guru-dash-kpi-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text);
      margin-bottom: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .guru-dash-kpi-value-row {
      display: flex;
      align-items: baseline;
      gap: 7px;
    }

    .guru-dash-kpi-value {
      font-size: clamp(26px, 2.6vw, 38px);
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .guru-dash-kpi-unit {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
    }

    .guru-dash-kpi-card.accent-brass .guru-dash-kpi-value { color: var(--brass); }
    .guru-dash-kpi-card.accent-sage .guru-dash-kpi-value { color: var(--sage); }
    .guru-dash-kpi-card.accent-volt .guru-dash-kpi-value { color: var(--volt); }
    .guru-dash-kpi-card.accent-indigo .guru-dash-kpi-value { color: var(--indigo); }
    .guru-dash-kpi-card.accent-teal .guru-dash-kpi-value { color: var(--teal); }

    .guru-dash-kpi-bar {
      margin-top: 16px;
      height: 5px;
      border-radius: 999px;
      background: var(--panel-2);
      overflow: hidden;
    }

    .guru-dash-kpi-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.5s ease;
    }

    /* L/P mini-stat di SEBELAH angka besar (bukan di bawah). Tumpuk vertikal,
       rata kanan, sejajar tengah terhadap nilai. Standar micro-stat KPI. */
    .gk-kpi-lp {
      margin-left: auto;
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
      letter-spacing: 0.02em;
    }

    .gk-kpi-lp span {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
    }

    .gk-kpi-lp b {
      color: var(--text);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      min-width: 12px;
      text-align: right;
    }

    .pengumuman-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03), 0 10px 24px -12px rgba(15, 23, 42, 0.1);
    }

    .pengumuman-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .pengumuman-card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .pengumuman-card-date {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      flex-shrink: 0;
      padding-top: 2px;
    }

    .pengumuman-card-body {
      font-size: 13px;
      color: var(--text);
      line-height: 1.6;
      white-space: pre-wrap;
      margin-bottom: 12px;
    }

    .pengumuman-card-actions {
      display: flex;
      gap: 8px;
    }

    .pengumuman-card-actions .btn {
      padding: 6px 12px;
      font-size: 12px;
    }

    /* Kartu pengumuman saat ditampilkan bersarang di dalam kartu kategori (.jadwal-kat-body) */
    .pengumuman-kat-add-row {
      padding: 12px 16px 0;
    }

    .pengumuman-kat-add-row .btn {
      width: 100%;
    }

    .pengumuman-kat-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 16px 16px;
    }

    .pengumuman-kat-list .pengumuman-card {
      box-shadow: none;
    }

    .ppg-timepicker {
      display: none;
      position: fixed;
      z-index: 1100;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 6px rgba(15, 23, 42, 0.05), 0 20px 40px -12px rgba(15, 23, 42, 0.25);
      padding: 16px;
      width: 230px;
    }

    .ppg-timepicker.open {
      display: block;
    }

    .ppg-timepicker-preview {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      margin-bottom: 12px;
    }

    .ppg-timepicker-wheels {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 180px;
    }

    .ppg-timepicker-wheel-highlight {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 36px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: rgba(217, 119, 6, 0.07);
      border-radius: 8px;
      pointer-events: none;
    }

    .ppg-timepicker-wheel-col {
      width: 68px;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .ppg-timepicker-wheel-col::-webkit-scrollbar {
      display: none;
    }

    .ppg-timepicker-wheel-spacer {
      height: 72px;
    }

    .ppg-timepicker-wheel-item {
      height: 36px;
      line-height: 36px;
      text-align: center;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
      cursor: pointer;
      scroll-snap-align: center;
    }

    .ppg-timepicker-wheel-colon {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-faint);
    }

    .ppg-timepicker-footer {
      margin-top: 14px;
    }

    .ppg-timepicker-footer .btn {
      width: 100%;
    }

    /* Jadwal KBM — jadwal umum per kategori jenjang (tanpa tanggal),
       tampil sebagai kartu kolom berdampingan: Cabe Rawit, Pra Remaja SMP,
       Remaja SMA, Muda-Mudi. */
    .jadwal-kat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .jadwal-kat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03), 0 10px 24px -12px rgba(15, 23, 42, 0.1);
      overflow: hidden;
    }

    /* Kategori yang sedang dibuka (pill kelas / panel detail terlihat) keluar dari kolom
       grid sempit dan mengambil lebar penuh baris — supaya pill & panel detail punya
       ruang selebar desktop, bukan terjepit sejajar kartu kategori lain. */
    .jadwal-kat-card.jadwal-kat-full {
      grid-column: 1 / -1;
    }

    .jadwal-kat-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      border: none;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
    }

    .jadwal-kat-header:hover {
      background: var(--border);
    }

    .jadwal-kat-card.collapsed .jadwal-kat-header {
      border-bottom-color: transparent;
    }

    .jadwal-kat-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .jadwal-kat-header-right {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .jadwal-kat-count {
      flex-shrink: 0;
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(217, 119, 6, 0.1);
      color: var(--brass);
      font-size: 11px;
      font-weight: 700;
    }

    .jadwal-kat-caret-icon {
      width: 15px;
      height: 15px;
      color: var(--text-faint);
      transition: transform 0.2s;
    }

    .jadwal-kat-card.collapsed .jadwal-kat-caret-icon {
      transform: rotate(-90deg);
    }

    .jadwal-kat-card.collapsed .jadwal-kat-body {
      display: none;
    }

    .jadwal-hari-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border: none;
      border-bottom: 1px solid var(--border);
      background: none;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
    }

    .jadwal-hari-row:hover {
      color: var(--brass);
      background: rgba(217, 119, 6, 0.06);
    }

    .jadwal-kat-card.collapsed .jadwal-hari-row {
      border-bottom-color: transparent;
    }

    .jadwal-hari-row svg {
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      color: var(--brass);
    }

    .jha-hari-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .jha-hari-chip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 6px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--panel);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
    }

    .jha-hari-chip:has(input:checked) {
      border-color: var(--brass);
      background: rgba(217, 119, 6, 0.1);
      color: var(--brass);
    }

    .jha-hari-chip input {
      accent-color: var(--brass);
    }

    /* Modal generator Pengumuman KBM: form kiri, pratinjau WA kanan */
    .pkbm-modal-content {
      max-width: 820px;
    }

    .pkbm-sesi-list {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow-y: auto;
      max-height: 240px;
    }

    .pkbm-sesi-kosong {
      padding: 18px 14px;
      text-align: center;
      font-size: 12.5px;
      color: var(--text-faint);
    }

    .pkbm-sesi-row {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 9px 12px;
      border-left: 3px solid transparent;
      transition: all 0.15s;
    }

    .pkbm-sesi-row + .pkbm-sesi-row {
      border-top: 1px solid var(--border);
    }

    /* Guru diganti → aksen brass supaya penyimpangan dari jadwal umum terlihat sekilas. */
    .pkbm-sesi-row.diganti {
      border-left-color: var(--brass);
      background: rgba(217, 119, 6, 0.05);
    }

    /* Sesi libur → diredupkan. */
    .pkbm-sesi-row.libur .pkbm-sesi-info {
      opacity: 0.45;
    }

    .pkbm-sesi-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 122px;
      align-items: center;
      gap: 10px;
    }

    .pkbm-sesi-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .pkbm-sesi-kelas {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pkbm-sesi-jam {
      font-size: 11px;
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pkbm-sesi-status {
      padding: 6px 8px;
      font-size: 12px;
    }

    .pkbm-sesi-ganti {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--brass);
    }

    .pkbm-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
      gap: 20px;
    }

    .pkbm-preview {
      margin-top: 8px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--panel-2);
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 340px;
      overflow-y: auto;
    }

    @media (max-width: 767px) {
      .pkbm-layout {
        grid-template-columns: 1fr;
      }

      .pkbm-preview {
        max-height: 220px;
      }
    }

    .jadwal-kat-empty {
      padding: 22px 16px;
      text-align: center;
      font-size: 12.5px;
      color: var(--text);
    }

    .jadwal-sesi {
      padding: 10px 16px 12px;
      transition: background 0.15s;
    }

    .jadwal-sesi + .jadwal-sesi {
      border-top: 1px solid var(--border);
    }

    .jadwal-sesi:hover {
      background: var(--panel-2);
    }

    .jadwal-sesi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .jadwal-sesi-time {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--brass);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .jadwal-sesi-kelas {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .jadwal-sesi-meta {
      font-size: 12px;
      color: var(--text);
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .jadwal-sesi-note {
      font-size: 11.5px;
      color: var(--text);
      font-style: italic;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .jadwal-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .jadwal-toolbar #jadwalKbmSearchInput {
      flex: 1;
      min-width: 160px;
    }

    .jadwal-toolbar select {
      max-width: 180px;
    }

    .jadwal-status-badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .jadwal-status-badge.aktif {
      background: rgba(21, 128, 61, 0.14);
      color: #15803d;
    }

    .jadwal-status-badge.nonaktif {
      background: var(--panel-2);
      color: var(--text-faint);
    }

    .jadwal-sesi-santri {
      font-size: 11.5px;
      color: var(--text-faint);
    }

    .jadwal-row-actions {
      display: flex;
      gap: 4px;
    }

    .jadwal-row-icon-btn {
      width: 27px;
      height: 27px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      border: 1px solid transparent;
      background: none;
      color: var(--text-faint);
      cursor: pointer;
      transition: all 0.15s;
    }

    .jadwal-row-icon-btn svg {
      width: 14px;
      height: 14px;
    }

    .jadwal-row-icon-btn:hover {
      background: var(--panel);
      border-color: var(--border);
      color: var(--text);
    }

    .jadwal-row-icon-btn.danger:hover {
      color: var(--red);
      border-color: rgba(220, 38, 38, 0.3);
    }

    /* ═════ KELAS PENGAJIAN: pill kelas + panel detail (klik kartu kategori → baris tombol
       kelas presisi sama panjang/tinggi; klik satu kelas → detail memanjang ke bawah) ═════ */
    .jadwal-kelas-pill-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      flex-wrap: wrap;
    }

    .jadwal-kelas-pill {
      flex: 1 1 0;
      min-width: 72px;
      height: 40px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s ease;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .jadwal-kelas-pill:hover {
      border-color: var(--brass);
      color: var(--brass);
      transform: translateY(-1px);
      box-shadow: 0 4px 10px -4px rgba(217, 119, 6, 0.35);
    }

    .jadwal-kelas-pill.active {
      background: linear-gradient(135deg, #F59E0B 0%, var(--brass) 55%, #B45309 100%);
      border-color: var(--brass);
      color: #fff;
      box-shadow: 0 4px 12px -4px rgba(217, 119, 6, 0.5);
    }

    .jadwal-detail-panel {
      margin: 0 16px 16px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel-2);
    }

    .jadwal-detail-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .jadwal-detail-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-toggle-daftar-santri {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-toggle-daftar-santri:hover {
      border-color: var(--brass);
      color: var(--brass);
    }

    .btn-toggle-daftar-santri.active-state {
      background: var(--brass);
      border-color: var(--brass);
      color: #fff;
    }

    .jadwal-santri-roster-wrap {
      margin-top: 4px;
    }

    .btn-edit-kelas {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-edit-kelas svg {
      width: 14px;
      height: 14px;
    }

    .btn-edit-kelas:hover {
      background: var(--panel-2);
      border-color: var(--brass);
      color: var(--brass);
    }

    .jadwal-info-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .jadwal-info-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .jadwal-info-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text);
      margin-bottom: 8px;
    }

    .jadwal-info-label svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      color: var(--brass);
    }

    .jadwal-info-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .jadwal-info-value-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .jadwal-info-value-row .gk-kpi-lp {
      margin-left: auto;
    }

    .jadwal-info-subvalue {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .jadwal-santri-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .jadwal-santri-search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .jadwal-santri-search-wrap svg {
      position: absolute;
      left: 10px;
      width: 14px;
      height: 14px;
      color: var(--text-faint);
      pointer-events: none;
    }

    .jadwal-santri-search-wrap input {
      width: 200px;
      padding: 8px 10px 8px 30px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12.5px;
      font-family: inherit;
      background: var(--panel);
      color: var(--text);
    }

    /* Dashboard Kelompok: judul seksi pertama dinaikkan supaya jaraknya dengan
       header "Dashboard Kelompok" di atasnya tidak terlalu jauh. */
    #screenGuruDashboard .dash-container {
      padding-top: 18px;
    }

    #dataGuruTitle,
    #dataGenerusTitle {
      margin-bottom: 14px;
    }

    #dataGuruKpiRow,
    #dataGenerusKpiRow,
    #generusJenjangRow,
    #jadwalKbmTitle {
      margin-bottom: 14px;
    }

    .guru-dash-toggle-precise {
      min-width: 132px;
      justify-content: center;
    }

    /* Tombol "Daftar Guru"/"Daftar Generus": LEBARNYA dipendekkan (padding
       horizontal kecil + tanpa min-width), tinggi tetap sama dgn tombol lain. */
    .guru-dash-toggle-table.guru-dash-header-btn.guru-dash-toggle-precise {
      padding: 10px 12px;
    }

    .guru-dash-add-precise {
      min-width: 112px;
      text-align: center;
      justify-content: center;
    }

    #generusJenjangRow {
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    #generusJenjangRow .guru-dash-kpi-card {
      padding: 18px 16px 16px;
    }

    .guru-dash-toggle-table {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 0 0 16px;
      font-family: inherit;
    }

    .guru-dash-toggle-table:hover {
      color: var(--brass);
    }

    .guru-dash-toggle-table .guru-dash-toggle-caret {
      font-size: 10px;
      transition: transform 0.2s ease;
      display: inline-block;
    }

    .guru-dash-toggle-table.open .guru-dash-toggle-caret {
      transform: rotate(90deg);
    }

    .guru-dash-toggle-table.guru-dash-header-btn {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      color: var(--text);
    }

    .guru-dash-toggle-table.guru-dash-header-btn:hover {
      background: var(--border);
      color: var(--text);
    }

    /* Kurikulum — Tab switching & Card styles */
    .kurikulum-tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 16px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s;
    }

    .kurikulum-tab-btn:hover {
      color: var(--brass);
      border-bottom-color: var(--brass);
    }

    .kurikulum-tab-btn.active {
      color: var(--brass);
      border-bottom-color: var(--brass);
    }

    .kurikulum-tab-content {
      display: none;
    }

    .kurikulum-tab-content.active {
      display: block;
    }

    /* Submenu section Dashboard Kelompok (Kelp Petemon dkk): Dashboard/Data
       Master/Operasional/Kurikulum/Monitoring/Laporan — dipakai window.switchKelpSectionTab_ */
    .kelp-section-tabs-strip {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      gap: 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .kelp-section-tab {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .kelp-section-tab:hover {
      background: var(--border);
      color: var(--text);
    }

    .kelp-section-tab.active {
      background: rgba(217, 119, 6, 0.12);
      border-color: var(--brass);
      color: var(--brass);
    }

    .kelp-section-panel {
      display: none;
    }

    .kelp-section-panel.active {
      display: block;
    }

    /* Tab Data Master (Kelp Petemon): ukuran card TETAP sama seperti semula
       (jangan diperkecil lagi — sudah sempat kebablasan & jadi tidak
       presisi), cuma jarak antar-baris dipangkas dikit supaya scrollbar
       hilang. Scroll dimatikan HANYA saat panel ini aktif — panel lain
       (Dashboard/Operasional/Kurikulum/dst) tidak terpengaruh sama sekali. */
    #screenGuruDashboard:has(#kelpPanelDataMaster.active) .dash-container {
      overflow-y: hidden;
    }

    /* Tapi begitu Daftar Guru/Daftar Generus diklik (fokus salah satu tabel,
       lihat window.setDataMasterFocus_ — kelas "focused" ditambahkan ke
       #kelpPanelDataMaster), tabelnya bisa sampai 10 baris jadi butuh scroll
       lagi — aturan ini override overflow:hidden di atas KHUSUS saat fokus. */
    #screenGuruDashboard:has(#kelpPanelDataMaster.active.focused) .dash-container {
      overflow-y: auto;
    }

    /* ═════ CUSTOM DATE PICKER (modern, tanpa dependency eksternal) ═════ */
    .ppg-datepicker {
      display: none;
      position: fixed;
      z-index: 1100;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 6px rgba(15, 23, 42, 0.05), 0 20px 40px -12px rgba(15, 23, 42, 0.25);
      padding: 16px;
      width: 296px;
    }

    .ppg-datepicker.open {
      display: block;
    }

    .ppg-datepicker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 12px;
    }

    .ppg-datepicker-nav-btn {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--panel-2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--text-dim);
      transition: all 0.15s;
    }

    .ppg-datepicker-nav-btn:hover {
      background: var(--brass);
      color: white;
      border-color: var(--brass);
    }

    .ppg-datepicker-selects {
      display: flex;
      gap: 6px;
      flex: 1;
    }

    .ppg-datepicker-selects select {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 4px;
      font-size: 12px;
      font-family: inherit;
      color: var(--text);
      background: var(--panel);
      min-width: 0;
    }

    .ppg-datepicker-selects select:first-child {
      flex: 1.3;
    }

    .ppg-datepicker-selects select:last-child {
      flex: 1;
    }

    .ppg-datepicker-weekdays,
    .ppg-datepicker-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .ppg-datepicker-weekday {
      text-align: center;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-faint);
      text-transform: uppercase;
      padding: 4px 0 8px;
    }

    .ppg-datepicker-day {
      text-align: center;
      padding: 7px 0;
      font-size: 12.5px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text);
      transition: all 0.15s;
    }

    .ppg-datepicker-day:hover {
      background: var(--panel-2);
    }

    .ppg-datepicker-day.muted {
      color: var(--text-faint);
      opacity: 0.4;
      cursor: default;
    }

    .ppg-datepicker-day.muted:hover {
      background: transparent;
    }

    .ppg-datepicker-day.today {
      font-weight: 700;
      color: var(--brass);
    }

    .ppg-datepicker-day.selected {
      background: var(--brass);
      color: white;
      font-weight: 700;
    }

    /* ═════ TABEL DAFTAR GURU — DASHBOARD KELOMPOK (premium) ═════ */
    .guru-kelp-table-wrapper {
      border-radius: var(--radius-lg);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03), 0 10px 24px -12px rgba(15, 23, 42, 0.12);
    }

    #guruTableToggleBtn.active-state,
    #santriTableToggleBtn.active-state {
      background: rgba(217, 119, 6, 0.1);
      border-color: var(--brass);
      color: var(--brass);
    }

    .guru-kelp-table-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 18px 16px;
      border-bottom: 1px solid var(--border);

    .guru-kelp-filter-select {
      flex-shrink: 0;
      width: auto;
      padding: 9px 32px 9px 14px;

    }

    .guru-kelp-filter-select:focus {

      border-color: var(--brass);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.12);

    .guru-kelp-table-wrapper .data-table th {
      letter-spacing: 0.04em;
      padding: 9px 11px;
      font-size: 10.5px;
    }

    .guru-kelp-table-wrapper .data-table tbody tr {
      transition: background 0.15s ease;
    }

    .guru-kelp-table-wrapper .data-table tbody tr:hover {
      background: var(--panel-2);
    }

    .guru-kelp-name-text {
      font-weight: 600;
      color: var(--text);
    }

    .guru-kelp-premium-table td {
      font-size: 12px;
      padding: 8px 11px;
      vertical-align: middle;
    }

    .guru-kelp-premium-table th,
    .guru-kelp-premium-table td {
      white-space: nowrap;
    }

    /* ═════ SCROLL HORIZONTAL + FREEZE KOLOM (No/Nama kiri, Aksi kanan) ═════
       Kolom beku pakai position:sticky relatif ke .gk-table-scroll. */
    /* Maksimal ~10 baris terlihat; sisanya scroll vertikal. Header tabel tetap
       menempel di atas (sticky) saat digulir ke bawah. */
    .gk-table-scroll {
      overflow: auto;
      max-height: 620px;
      -webkit-overflow-scrolling: touch;
    }

    .guru-kelp-premium-table thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--panel-2);
    }

    .guru-kelp-premium-table th.gk-sticky,
    .guru-kelp-premium-table td.gk-sticky {
      position: sticky;
      z-index: 1;
      background: var(--panel);
    }

    .guru-kelp-premium-table thead th.gk-sticky {
      z-index: 3;
      background: var(--panel-2);
    }

    .guru-kelp-premium-table tbody tr:hover td.gk-sticky {
      background: var(--panel-2);
    }

    /* No: padding dikecilkan agar lebar kolom deterministik = 48px, sehingga
       offset kolom Nama (left:48px) presisi tidak meleset/tumpang tindih. */
    .gk-sticky-l1 {
      left: 0;
      width: 38px;
      min-width: 38px;
      padding-left: 10px;
      padding-right: 6px;
      font-variant-numeric: tabular-nums;
    }
    .gk-sticky-l2 { left: 38px; min-width: 138px; box-shadow: 6px 0 8px -7px rgba(15, 23, 42, 0.25); }
    .gk-sticky-r { right: 0; min-width: 100px; box-shadow: -6px 0 8px -7px rgba(15, 23, 42, 0.25); }

    /* ═════ COLUMN PICKER ═════ */
    .guru-kelp-table-toolbar .search-input {

    .gk-colpicker-wrap {

      flex-shrink: 0;
    }

    .gk-colpicker-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--text);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .gk-colpicker-btn:hover {
      border-color: var(--brass);
      color: var(--brass);
    }

    .gk-colpicker-panel {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      min-width: 210px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;

    }

    .gk-colpicker-panel.open {
      display: block;
    }

    .gk-colpicker-title {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-faint);

    .gk-colpicker-panel label {

      align-items: center;
      gap: 9px;

    }

    .gk-colpicker-panel input[type="checkbox"] {

      height: 15px;
      accent-color: var(--brass);
      cursor: pointer;
    }

    .guru-kelp-badge {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: var(--panel-2);
      color: var(--text-dim);
    }

    .guru-kelp-badge.badge-tugasan {
      background: rgba(5, 150, 105, 0.1);
      color: var(--sage);
    }

    .guru-kelp-badge.badge-setempat {
      background: rgba(251, 191, 36, 0.18);
      color: #92650a;
    }

    .guru-kelp-badge.badge-bantu {
      background: rgba(79, 70, 229, 0.1);
      color: var(--indigo);
    }

    .guru-kelp-aksi-group {
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }

    .guru-kelp-aksi-btn {
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      color: var(--text-faint);
      display: inline-flex;
      align-items: center;

    .guru-kelp-aksi-btn:hover {

    }

    .guru-kelp-aksi-btn.danger:hover {
      color: var(--red);
    }

    /* ═════ MODAL KONFIRMASI HAPUS GURU — DASHBOARD KELOMPOK (premium) ═════ */
    .guru-kelp-delete-modal {
      max-width: 380px;
      text-align: center;
      padding: 40px 32px 32px;
      position: relative;
      animation: guruKelpDeletePop 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes guruKelpDeletePop {
      from { opacity: 0; transform: scale(0.96) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .guru-kelp-delete-close {
      position: absolute;
      top: 16px;
      right: 16px;
    }

    .guru-kelp-delete-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(220, 38, 38, 0.08);
      color: var(--red);
      margin: 0 auto 20px;
    }

    .guru-kelp-delete-icon svg {
      width: 26px;
      height: 26px;
    }

    .guru-kelp-delete-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .guru-kelp-delete-message {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .guru-kelp-delete-message strong {
      color: var(--text);
    }

    .guru-kelp-delete-footer {
      justify-content: center;
      margin-top: 28px;
    }

    .guru-kelp-btn-danger {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 100px;
      padding: 10px 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      background: var(--red);
      color: white;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    .guru-kelp-btn-danger:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .guru-kelp-btn-danger:disabled {
      cursor: not-allowed;
    }

    .guru-kelp-btn-label {
      transition: opacity 0.15s ease;
    }

    .guru-kelp-spinner {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      width: 15px;
      height: 15px;
      margin: -8px 0 0 -8px;
      border: 2px solid rgba(255, 255, 255, 0.32);
      border-top-color: #fff;
      border-radius: 50%;
      animation: guruKelpSpin 0.65s linear infinite;
    }

    .guru-kelp-btn-danger.is-loading .guru-kelp-btn-label {
      opacity: 0;
    }

    .guru-kelp-btn-danger.is-loading .guru-kelp-spinner {
      display: block;
    }

    @keyframes guruKelpSpin {
      to { transform: rotate(360deg); }
