  <style>
    :root {
      --brass: #D97706;
      --sage: #059669;
      --brand-green: #6B9975;
      --volt: #FBBF24;
      --red: #DC2626;
      --indigo: #4F46E5;
      --teal: #0D9488;
      --panel: #FFFFFF;
      --panel-2: #F9FAFB;
      --bg: #F8FAFC;
      --border: #E2E8F0;
      --text: #0F172A;
      --text-dim: #64748B;
      --text-faint: #94A3B8;
      --radius: 8px;
      --radius-lg: 14px;
      --radius-button: 999px;
      --shadow-card: 0 2px 12px rgba(15, 23, 42, 0.08);
      --shadow-subtle: 0 1px 3px rgba(15, 23, 42, 0.06);
      --topbar-height: 56px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ═════ LOGIN SCREEN ═════ */
    /* Disembunyikan secara default (bukan display:flex) supaya tidak sempat
       "berkedip" muncul sebelum window.onload selesai cek DEV_MODE_SKIP_LOGIN.
       Ditampilkan lagi lewat JS (lihat window.onload/verifySession) hanya kalau
       mode dev nonaktif dan memang perlu login sungguhan. */
    #screenLogin {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: var(--panel);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
    }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      margin-bottom: 36px;
    }

    .login-brand-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--brand-green);
    }

    .login-form-group {
      margin-bottom: 16px;
    }

    .login-form-group:first-of-type {
      margin-top: 24px;
    }

    .login-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .login-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
    }

    .login-input:focus {
      outline: none;
      border-color: var(--brass);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1);
    }

    .login-btn {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      background: var(--brass);
      color: white;
      border: none;
      border-radius: var(--radius-button);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-error {
      background: #FEF2F2;
      color: var(--red);
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 13px;
      margin-top: 20px;
      display: none;
    }

    .login-dev-banner {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      color: #92400E;
      border-radius: var(--radius);
      padding: 12px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 24px;
      display: none;
    }

    /* Tab Masuk / Daftar (Guru) */
    .login-tabs {
      display: flex;
      gap: 4px;
      background: var(--panel-2);
      border-radius: var(--radius-button);
      padding: 4px;
      margin-bottom: 8px;
    }

    .login-tab {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px;
      border-radius: var(--radius-button);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-faint);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .login-tab.active {
      background: var(--panel);
      color: var(--brass);
      box-shadow: var(--shadow-subtle);
    }

    /* Tab & tombol Daftar pakai warna hijau khas aplikasi (beda dari Masuk/brass) */
    .login-tab.tab-daftar.active {
      color: var(--brand-green);
    }

    .login-success {
      background: #ECFDF5;
      color: #047857;
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 13px;
      margin-top: 20px;
      display: none;
    }

    .login-btn.green {
      background: var(--brand-green);
    }

    .login-password-wrap {
      position: relative;
    }

    .login-password-wrap .login-input {
      padding-right: 42px;
    }

    .login-eye-btn {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: var(--text-faint);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: var(--radius);
    }

    .login-eye-btn:hover {
      color: var(--text-dim);
    }

    .login-forgot-link {
      text-align: right;
      font-size: 12.5px;
      color: var(--text-dim);
      cursor: pointer;
      margin-top: 8px;
    }

    .login-forgot-link:hover {
      color: var(--brass);
      text-decoration: underline;
    }

    /* ═════ SCREEN ONBOARDING (wizard pasca-login pertama) ═════ */
    #screenOnboarding {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .onboard-card {
      background: var(--panel);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 36px 32px;
      width: 100%;
      max-width: 400px;
    }

    .onboard-steps {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
    }

    .onboard-step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .onboard-step-dot.active {
      background: var(--brand-green);
      transform: scale(1.3);
    }

    .onboard-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      margin-bottom: 22px;
    }

    .onboard-role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .onboard-role-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 22px 12px;
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--panel-2);
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.1s ease;
    }

    .onboard-role-btn:active { transform: scale(0.97); }
    .onboard-role-btn:hover { border-color: var(--brand-green); }

    .onboard-role-icon { font-size: 28px; }

    .onboard-admin-msg {
      margin-top: 18px;
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      color: #92400E;
      border-radius: var(--radius);
      padding: 14px;
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
    }

    .onboard-kelompok-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .onboard-kelompok-item {
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .onboard-kelompok-item:hover,
    .onboard-kelompok-item.active {
      border-color: var(--brand-green);
      background: #F0FDF4;
    }

    .onboard-nav {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .onboard-nav .btn { flex: 1; }

    .onboard-error {
      background: #FEF2F2;
      color: var(--red);
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 13px;
      margin-top: 16px;
    }

    /* ═════ APP LAYOUT (after login) ═════ */
    .app-layout {
      display: flex;
      height: 100vh;
      background: var(--panel);
      gap: 0;
    }

    .app-sidebar {
      width: 240px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      max-height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
      transition: width 0.3s, margin-left 0.3s;
    }

    .app-sidebar.collapsed {
      width: 68px;
      /* Tooltip keterangan icon menjulur keluar sidebar — wajib visible.
         Aman: saat collapsed semua submenu tree disembunyikan, konten pendek,
         tidak butuh scroll. */
      overflow: visible;
    }

    .app-sidebar.collapsed .sidebar-logo-text,
    .app-sidebar.collapsed .sidebar-menu span:last-child,
    .app-sidebar.collapsed .sidebar-toggle-btn,
    .app-sidebar.collapsed .sidebar-logout span:last-child {
      display: none;
    }

    .app-sidebar.collapsed .sidebar-menu-link {
      justify-content: center;
      padding: 12px;
    }

    .app-sidebar.collapsed .sidebar-logo {
      justify-content: center;
      padding: 0;
    }

    /* Saat collapsed: logo merangkap tombol pelebaran (toggle-btn disembunyikan).
       Saat lebar: logo tidak bisa diklik (pointer-events none) agar tidak
       tak sengaja menciutkan — pakai tombol chevron. */
    .sidebar-logo-brand {
      pointer-events: none;
    }

    .app-sidebar.collapsed .sidebar-logo-brand {
      pointer-events: auto;
      cursor: pointer;
      position: relative;
    }

    .app-sidebar.collapsed .sidebar-logout {
      justify-content: center;
      padding: 12px;
    }

    /* Tooltip keterangan saat collapsed — muncul instan di kanan icon */
    .app-sidebar.collapsed [data-tip] {
      position: relative;
    }

    .app-sidebar.collapsed [data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%);
      background: var(--text);
      color: #fff;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1;
      padding: 7px 11px;
      border-radius: 6px;
      white-space: nowrap;
      z-index: 1200;
      box-shadow: var(--shadow-card);
      pointer-events: none;
    }

    .sidebar-logo {
      height: var(--topbar-height);
      padding: 0 14px 0 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--panel);
    }

    .sidebar-logo-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      overflow: hidden;
    }

    .brand-mark {
      flex-shrink: 0;
      object-fit: contain;
    }

    .sidebar-logo-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--brand-green);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-menu {
      flex: 1;
      padding: 20px 0;
      list-style: none;
      margin: 0;
    }

    .sidebar-menu-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.2s;
    }

    /* Icon SVG monochrome (standar line-icon): mewarisi warna link via
       currentColor — abu saat non-aktif, emas saat aktif/hover. */
    .sidebar-icon {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
      stroke: currentColor;
      opacity: 0.9;
    }

    .sidebar-menu-link.active .sidebar-icon {
      opacity: 1;
    }

    .sidebar-menu-link:hover {
      color: var(--text);
      background: var(--panel-2);
    }

    .sidebar-menu-link.active {
      color: var(--brass);
      background: rgba(217, 119, 6, 0.05);
      border-left-color: var(--brass);
      font-weight: 600;
    }

    /* ═════ SIDEBAR: DESA/KELOMPOK TREE ═════ */
    .sidebar-caret {
      margin-left: auto;
      font-size: 9px;
      color: var(--text-faint);
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }

    .sidebar-caret.rotated {
      transform: rotate(90deg);
    }

    .sidebar-tree {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease;
    }

    .sidebar-tree.open {
      max-height: 400px;
    }

    .sidebar-tree-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px 10px 48px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sidebar-tree-link:hover {
      color: var(--text);
      background: var(--panel-2);
    }

    .sidebar-tree-link.disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .sidebar-tree-link.disabled:hover {
      background: transparent;
      color: var(--text-dim);
    }

    .sidebar-tree-link-2 {
      display: block;
      padding: 9px 20px 9px 68px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sidebar-tree-link-2:hover {
      color: var(--text);
      background: var(--panel-2);
    }

    .sidebar-tree-link-2.active {
      color: var(--brass);
      background: rgba(217, 119, 6, 0.08);
      font-weight: 600;
    }

    .sidebar-tree-link-2.disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .sidebar-tree-link-2.disabled:hover {
      background: transparent;
      color: var(--text-dim);
    }

    /* Level-3 submenu sidebar (khusus Kelp Petemon, ERROR_LOG-free rollout
       pilot): Dashboard/Data Master/Operasional/Kurikulum/Monitoring/Laporan
       nempel di bawah baris kelompoknya, gaya sama dgn sidebar-tree/-tree-2
       (accordion max-height) tapi versi bawa ikon + state aktif lebih cerah. */
    .sidebar-tree-link-3 {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px 9px 68px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sidebar-tree-link-3:hover {
      color: var(--text);
      background: var(--panel-2);
    }

    .sidebar-tree-link-3.active {
      color: #fff;
      background: linear-gradient(135deg, #F59E0B 0%, var(--brass) 100%);
      font-weight: 700;
      box-shadow: 0 2px 8px -2px rgba(217, 119, 6, 0.5);
    }

    .sidebar-icon-3 {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .app-sidebar.collapsed .sidebar-menu-text,
    .app-sidebar.collapsed .sidebar-caret {
      display: none;
    }

    .app-sidebar.collapsed .sidebar-tree {
      display: none !important;
    }

    .sidebar-footer {
      padding: 8px 0;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      position: sticky;
      bottom: 0;
      z-index: 5;
      background: var(--panel);
    }

    .sidebar-logout {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      background: transparent;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-dim);
      font-family: inherit;
      text-align: left;
    }

    .sidebar-logout:hover {
      background: rgba(220, 38, 38, 0.05);
      color: var(--red);
    }

    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header TIDAK ikut scroll: yang menggulir hanya blok konten di bawahnya,
       supaya batang scroll mulai di bawah header (tidak menembus blok atas /
       card admin). Tiap screen = .dash-header + tepat satu elemen konten
       (+ .modal-overlay yang position:fixed, jadi tidak terpengaruh). */
    .screen-wrapper {
      display: none;
      overflow: hidden;
      flex: 1;
      min-height: 0;
    }

    .screen-wrapper.active {
      display: flex;
      flex-direction: column;
    }

    .screen-wrapper.active > .dash-header + * {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    /* .dash-container aslinya max-width:1200px + margin auto. Karena elemen ini
       kini yang menggulir, batang scroll-nya ikut tepi kotak 1200px yang
       ter-center — sehingga bergeser ke DALAM saat sidebar diciutkan (area
       melebar >1200px). Solusi: kotaknya dibuat selebar penuh (scroll tetap di
       pojok kanan) dan isinya yang di-center lewat padding. */
    .screen-wrapper.active > .dash-header + .dash-container {
      max-width: none;
      padding-left: max(20px, calc((100% - 1200px) / 2));
      padding-right: max(20px, calc((100% - 1200px) / 2));
    }

    /* ═════ DASHBOARD SCREEN ═════ */
    .dash-header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0 200px 0 20px;
      height: var(--topbar-height);
      box-shadow: var(--shadow-subtle);
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      flex-shrink: 0;
    }

    /* Card admin — global, fixed kanan atas viewport, tampil di SEMUA screen
       (bukan child dari .dash-header, jadi tidak ikut disembunyikan saat
       .screen-wrapper lain yang aktif) */
    /* Panel kanan atas global: tombol refresh + card admin, sejajar. */
    .gk-topright {
      position: fixed;
      top: 12px;
      right: 20px;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Toast konfirmasi singkat (muncul di bawah panel kanan atas) */
    .gk-toast {
      position: fixed;
      top: 56px;
      right: 20px;
      z-index: 1300;
      padding: 9px 16px;
      border-radius: 999px;
      background: var(--text);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: var(--shadow-card);
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .gk-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .gk-refresh-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 50%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-subtle);
      color: var(--text-dim);
      cursor: pointer;
      flex-shrink: 0;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .gk-refresh-btn:hover {
      color: var(--brass);
      border-color: var(--brass);
    }

    .gk-refresh-btn svg {
      transition: transform 0.5s ease;
    }

    .gk-refresh-btn:hover svg {
      transform: rotate(180deg);
    }

    .dash-header-admin-card {
      display: flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-subtle);
      flex-shrink: 0;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .dash-container {
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .dash-section-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 20px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 48px;
    }

    .kpi-card {
      background: var(--panel);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border);
      text-align: center;
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 36px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 8px;
    }

    .kpi-unit {
      font-size: 13px;
      color: var(--text-faint);
    }

    .kpi-card.accent-sage .kpi-value { color: var(--sage); }
    .kpi-card.accent-brass .kpi-value { color: var(--brass); }
    .kpi-card.accent-volt .kpi-value { color: var(--volt); }

    /* ═════ DASHBOARD GURU (per Kelompok — premium KPI cards) ═════ */
    .guru-dash-context-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #F59E0B 0%, var(--brass) 55%, #B45309 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .guru-dash-context-icon {
      width: 22px;
      height: 36px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .guru-dash-kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 20px;
    }

    .guru-dash-kpi-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 26px 24px 22px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03), 0 10px 24px -12px rgba(15, 23, 42, 0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .guru-dash-kpi-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.05), 0 16px 32px -14px rgba(15, 23, 42, 0.18);
    }

    .guru-dash-kpi-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text);
      margin-bottom: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .guru-dash-kpi-value-row {
      display: flex;
      align-items: baseline;
      gap: 7px;
    }

    .guru-dash-kpi-value {
      font-size: clamp(26px, 2.6vw, 38px);
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .guru-dash-kpi-unit {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
    }

    .guru-dash-kpi-card.accent-brass .guru-dash-kpi-value { color: var(--brass); }
    .guru-dash-kpi-card.accent-sage .guru-dash-kpi-value { color: var(--sage); }
    .guru-dash-kpi-card.accent-volt .guru-dash-kpi-value { color: var(--volt); }
    .guru-dash-kpi-card.accent-indigo .guru-dash-kpi-value { color: var(--indigo); }
    .guru-dash-kpi-card.accent-teal .guru-dash-kpi-value { color: var(--teal); }

    .guru-dash-kpi-bar {
      margin-top: 16px;
      height: 5px;
      border-radius: 999px;
      background: var(--panel-2);
      overflow: hidden;
    }

    .guru-dash-kpi-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.5s ease;
    }

    /* L/P mini-stat di SEBELAH angka besar (bukan di bawah). Tumpuk vertikal,
       rata kanan, sejajar tengah terhadap nilai. Standar micro-stat KPI. */
    .gk-kpi-lp {
      margin-left: auto;
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
      letter-spacing: 0.02em;
    }

    .gk-kpi-lp span {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
    }

    .gk-kpi-lp b {
      color: var(--text);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      min-width: 12px;
      text-align: right;
    }

    .pengumuman-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03), 0 10px 24px -12px rgba(15, 23, 42, 0.1);
    }

    .pengumuman-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .pengumuman-card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .pengumuman-card-date {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      flex-shrink: 0;
      padding-top: 2px;
    }

    .pengumuman-card-body {
      font-size: 13px;
      color: var(--text);
      line-height: 1.6;
      white-space: pre-wrap;
      margin-bottom: 12px;
    }

    .pengumuman-card-actions {
      display: flex;
      gap: 8px;
    }

    .pengumuman-card-actions .btn {
      padding: 6px 12px;
      font-size: 12px;
    }

    /* Kartu pengumuman saat ditampilkan bersarang di dalam kartu kategori (.jadwal-kat-body) */
    .pengumuman-kat-add-row {
      padding: 12px 16px 0;
    }

    .pengumuman-kat-add-row .btn {
      width: 100%;
    }

    .pengumuman-kat-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 16px 16px;
    }

    .pengumuman-kat-list .pengumuman-card {
      box-shadow: none;
    }

    .ppg-timepicker {
      display: none;
      position: fixed;
      z-index: 1100;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 6px rgba(15, 23, 42, 0.05), 0 20px 40px -12px rgba(15, 23, 42, 0.25);
      padding: 16px;
      width: 230px;
    }

    .ppg-timepicker.open {
      display: block;
    }

    .ppg-timepicker-preview {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      margin-bottom: 12px;
    }

    .ppg-timepicker-wheels {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 180px;
    }

    .ppg-timepicker-wheel-highlight {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 36px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: rgba(217, 119, 6, 0.07);
      border-radius: 8px;
      pointer-events: none;
    }

    .ppg-timepicker-wheel-col {
      width: 68px;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .ppg-timepicker-wheel-col::-webkit-scrollbar {
      display: none;
    }

    .ppg-timepicker-wheel-spacer {
      height: 72px;
    }

    .ppg-timepicker-wheel-item {
      height: 36px;
      line-height: 36px;
      text-align: center;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      color: var(--text-dim);
      cursor: pointer;
      scroll-snap-align: center;
    }

    .ppg-timepicker-wheel-colon {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-faint);
    }

    .ppg-timepicker-footer {
      margin-top: 14px;
    }

    .ppg-timepicker-footer .btn {
      width: 100%;
    }

    /* Jadwal KBM — jadwal umum per kategori jenjang (tanpa tanggal),
       tampil sebagai kartu kolom berdampingan: Cabe Rawit, Pra Remaja SMP,
       Remaja SMA, Muda-Mudi. */
    .jadwal-kat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .jadwal-kat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03), 0 10px 24px -12px rgba(15, 23, 42, 0.1);
      overflow: hidden;
    }

    /* Kategori yang sedang dibuka (pill kelas / panel detail terlihat) keluar dari kolom
       grid sempit dan mengambil lebar penuh baris — supaya pill & panel detail punya
       ruang selebar desktop, bukan terjepit sejajar kartu kategori lain. */
    .jadwal-kat-card.jadwal-kat-full {
      grid-column: 1 / -1;
    }

    .jadwal-kat-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      border: none;
      border-bottom: 1px solid var(--border);
      background: var(--panel-2);
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
    }

    .jadwal-kat-header:hover {
      background: var(--border);
    }

    .jadwal-kat-card.collapsed .jadwal-kat-header {
      border-bottom-color: transparent;
    }

    .jadwal-kat-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .jadwal-kat-header-right {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* KEHADIRAN GENERUS (kartu per kelas KBM, tab Operasional) */
    .kg-warna-hijau-tua { color: #15803d; }
    .kg-warna-hijau-muda { color: #16a34a; }
    .kg-warna-kuning { color: #a16207; }
    .kg-warna-merah { color: #dc2626; }
    .kg-warna-abu { color: var(--text-faint); }

    /* Selector gabungan (specificity lebih tinggi) supaya menang lawan
       .jadwal-info-value { color: var(--text); } yang urutannya lebih akhir
       di file ini. */
    .jadwal-info-value.kg-warna-hijau-tua { color: #15803d; }
    .jadwal-info-value.kg-warna-hijau-muda { color: #16a34a; }
    .jadwal-info-value.kg-warna-kuning { color: #a16207; }
    .jadwal-info-value.kg-warna-merah { color: #dc2626; }
    .jadwal-info-value.kg-warna-abu { color: var(--text-faint); }

    .jadwal-kat-count {
      flex-shrink: 0;
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(217, 119, 6, 0.1);
      color: var(--brass);
      font-size: 11px;
      font-weight: 700;
    }

    .jadwal-kat-caret-icon {
      width: 15px;
      height: 15px;
      color: var(--text-faint);
      transition: transform 0.2s;
    }

    .jadwal-kat-card.collapsed .jadwal-kat-caret-icon {
      transform: rotate(-90deg);
    }

    .jadwal-kat-card.collapsed .jadwal-kat-body {
      display: none;
    }

    .jadwal-hari-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border: none;
      border-bottom: 1px solid var(--border);
      background: none;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
    }

    .jadwal-hari-row:hover {
      color: var(--brass);
      background: rgba(217, 119, 6, 0.06);
    }

    .jadwal-kat-card.collapsed .jadwal-hari-row {
      border-bottom-color: transparent;
    }

    .jadwal-hari-row svg {
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      color: var(--brass);
    }

    .jha-hari-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .jha-hari-chip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 6px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--panel);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
    }

    .jha-hari-chip:has(input:checked) {
      border-color: var(--brass);
      background: rgba(217, 119, 6, 0.1);
      color: var(--brass);
    }

    .jha-hari-chip input {
      accent-color: var(--brass);
    }

    /* Modal generator Pengumuman KBM: form kiri, pratinjau WA kanan */
    .pkbm-modal-content {
      max-width: 820px;
    }

    .pkbm-sesi-list {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow-y: auto;
      max-height: 240px;
    }

    .pkbm-sesi-kosong {
      padding: 18px 14px;
      text-align: center;
      font-size: 12.5px;
      color: var(--text-faint);
    }

    .pkbm-sesi-row {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 9px 12px;
      border-left: 3px solid transparent;
      transition: all 0.15s;
    }

    .pkbm-sesi-row + .pkbm-sesi-row {
      border-top: 1px solid var(--border);
    }

    /* Guru diganti → aksen brass supaya penyimpangan dari jadwal umum terlihat sekilas. */
    .pkbm-sesi-row.diganti {
      border-left-color: var(--brass);
      background: rgba(217, 119, 6, 0.05);
    }

    /* Sesi libur → diredupkan. */
    .pkbm-sesi-row.libur .pkbm-sesi-info {
      opacity: 0.45;
    }

    .pkbm-sesi-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 122px;
      align-items: center;
      gap: 10px;
    }

    .pkbm-sesi-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .pkbm-sesi-kelas {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pkbm-sesi-jam {
      font-size: 11px;
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pkbm-sesi-status {
      padding: 6px 8px;
      font-size: 12px;
    }

    .pkbm-sesi-ganti {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--brass);
    }

    .pkbm-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
      gap: 20px;
    }

    .pkbm-preview {
      margin-top: 8px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--panel-2);
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 340px;
      overflow-y: auto;
    }

    @media (max-width: 767px) {
      .pkbm-layout {
        grid-template-columns: 1fr;
      }

      .pkbm-preview {
        max-height: 220px;
      }
    }

    .jadwal-kat-empty {
      padding: 22px 16px;
      text-align: center;
      font-size: 12.5px;
      color: var(--text);
    }

    .jadwal-sesi {
      padding: 10px 16px 12px;
      transition: background 0.15s;
    }

    .jadwal-sesi + .jadwal-sesi {
      border-top: 1px solid var(--border);
    }

    .jadwal-sesi:hover {
      background: var(--panel-2);
    }

    .jadwal-sesi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .jadwal-sesi-time {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--brass);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .jadwal-sesi-kelas {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .jadwal-sesi-meta {
      font-size: 12px;
      color: var(--text);
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .jadwal-sesi-note {
      font-size: 11.5px;
      color: var(--text);
      font-style: italic;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .jadwal-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .jadwal-toolbar #jadwalKbmSearchInput {
      flex: 1;
      min-width: 160px;
    }

    .jadwal-toolbar select {
      max-width: 180px;
    }

    .jadwal-status-badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .jadwal-status-badge.aktif {
      background: rgba(21, 128, 61, 0.14);
      color: #15803d;
    }

    .jadwal-status-badge.nonaktif {
      background: var(--panel-2);
      color: var(--text-faint);
    }

    .jadwal-sesi-santri {
      font-size: 11.5px;
      color: var(--text-faint);
    }

    .jadwal-row-actions {
      display: flex;
      gap: 4px;
    }

    .jadwal-row-icon-btn {
      width: 27px;
      height: 27px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      border: 1px solid transparent;
      background: none;
      color: var(--text-faint);
      cursor: pointer;
      transition: all 0.15s;
    }

    .jadwal-row-icon-btn svg {
      width: 14px;
      height: 14px;
    }

    .jadwal-row-icon-btn:hover {
      background: var(--panel);
      border-color: var(--border);
      color: var(--text);
    }

    .jadwal-row-icon-btn.danger:hover {
      color: var(--red);
      border-color: rgba(220, 38, 38, 0.3);
    }

    /* ═════ KELAS PENGAJIAN: pill kelas + panel detail (klik kartu kategori → baris tombol
       kelas presisi sama panjang/tinggi; klik satu kelas → detail memanjang ke bawah) ═════ */
    .jadwal-kelas-pill-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      flex-wrap: wrap;
    }

    .jadwal-kelas-pill {
      flex: 1 1 0;
      min-width: 72px;
      height: 40px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s ease;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }

    .jadwal-kelas-pill:hover {
      border-color: var(--brass);
      color: var(--brass);
      transform: translateY(-1px);
      box-shadow: 0 4px 10px -4px rgba(217, 119, 6, 0.35);
    }

    .jadwal-kelas-pill.active {
      background: linear-gradient(135deg, #F59E0B 0%, var(--brass) 55%, #B45309 100%);
      border-color: var(--brass);
      color: #fff;
      box-shadow: 0 4px 12px -4px rgba(217, 119, 6, 0.5);
    }

    .jadwal-detail-panel {
      margin: 0 16px 16px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel-2);
    }

    .jadwal-detail-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .jadwal-detail-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Tombol Kelas / Daftar Santri / + Santri: presisi sama tinggi & lebar. */
    .jadwal-header-btn {
      width: 132px;
      height: 36px;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-toggle-daftar-santri {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-toggle-daftar-santri:hover {
      border-color: var(--brass);
      color: var(--brass);
    }

    .btn-toggle-daftar-santri.active-state {
      background: var(--brass);
      border-color: var(--brass);
      color: #fff;
    }

    .jadwal-santri-roster-wrap {
      margin-top: 4px;
    }

    .btn-edit-kelas {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-edit-kelas svg {
      width: 14px;
      height: 14px;
    }

    .btn-edit-kelas:hover {
      background: var(--panel-2);
      border-color: var(--brass);
      color: var(--brass);
    }

    .jadwal-info-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .jadwal-info-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .jadwal-info-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text);
      margin-bottom: 8px;
    }

    .jadwal-info-label svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      color: var(--brass);
    }

    .jadwal-info-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .jadwal-info-value-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .jadwal-info-value-row .gk-kpi-lp {
      margin-left: auto;
    }

    .jadwal-info-subvalue {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .jadwal-santri-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .jadwal-santri-search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .jadwal-santri-search-wrap svg {
      position: absolute;
      left: 10px;
      width: 14px;
      height: 14px;
      color: var(--text-faint);
      pointer-events: none;
    }

    .jadwal-santri-search-wrap input {
      width: 200px;
      padding: 8px 10px 8px 30px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12.5px;
      font-family: inherit;
      background: var(--panel);
      color: var(--text);
    }

    /* Modal Pilih Santri (assign generus yang sudah ada ke kelas Jadwal KBM). */
    .pilih-santri-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 360px;
      overflow-y: auto;
      margin-bottom: 8px;
    }

    .pilih-santri-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .pilih-santri-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .pilih-santri-nama {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pilih-santri-meta {
      font-size: 11.5px;
      color: var(--text-faint);
      margin-top: 2px;
    }

    .pilih-santri-sudah {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-faint);
      white-space: nowrap;
    }

    .pilih-santri-add-btn {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--brass);
      background: var(--panel);
      color: var(--brass);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .pilih-santri-add-btn:hover {
      background: var(--brass);
      color: #fff;
    }

    /* Dashboard Kelompok: judul seksi pertama dinaikkan supaya jaraknya dengan
       header "Dashboard Kelompok" di atasnya tidak terlalu jauh. */
    #screenGuruDashboard .dash-container {
      padding-top: 18px;
    }

    #dataGuruTitle,
    #dataGenerusTitle {
      margin-bottom: 14px;
    }

    #dataGuruKpiRow,
    #dataGenerusKpiRow,
    #generusJenjangRow,
    #jadwalKbmTitle {
      margin-bottom: 14px;
    }

    /* Tombol header Data Master (+Tambah / Daftar / Ekspor): lebar & tinggi
       WAJIB presisi sama di keempat section (Guru/Generus/Pendidikan Formal/
       Siklus) — fixed width+height (bukan min-width) + box-sizing border-box
       supaya border 1px di tombol Daftar/Ekspor tidak bikin tingginya beda
       dgn tombol +Tambah (.btn.btn-primary, tanpa border). */
    .guru-dash-toggle-table.guru-dash-header-btn.guru-dash-add-precise,
    .btn.guru-dash-add-precise,
    .guru-dash-toggle-table.guru-dash-header-btn.guru-dash-toggle-precise {
      width: 138px;
      height: 40px;
      box-sizing: border-box;
      padding: 0 12px;
      text-align: center;
      justify-content: center;
      white-space: nowrap;
    }

    /* Tombol "Daftar Guru/Generus/Pendidikan/Siklus": teks diganti icon list
       (4 garis horizontal monokrom) — lebarnya tetap sama seperti tombol lain. */
    .guru-dash-toggle-precise .guru-dash-toggle-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    #generusJenjangRow {
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    #generusJenjangRow .guru-dash-kpi-card {
      padding: 18px 16px 16px;
    }

    /* Siklus Generus: 6 kartu WAJIB satu baris (bukan auto-fit yang bisa
       membungkus ke baris ke-2) — kolomnya menyempit mengikuti lebar layar
       desktop masing-masing, bukan jumlah kolomnya yang berkurang. */
    #dataSiklusGenerusKpiRow {
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    #dataSiklusGenerusKpiRow .guru-dash-kpi-card {
      padding: 16px 12px 14px;
      min-width: 0;
    }

    #dataSiklusGenerusKpiRow .guru-dash-kpi-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Pendidikan Formal: 6 kartu (PAUD/TK/SD/SMP/SMA/Kuliah) WAJIB satu baris
       di desktop — sama seperti #dataSiklusGenerusKpiRow, cuma di sini tiap
       kartu masih bawa mini-stat L/P (.gk-kpi-lp) jadi nilai besarnya perlu
       ikut mengecil supaya tidak tabrakan/overflow di kartu yang menyempit. */
    #dataPendidikanFormalKpiRow {
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    #dataPendidikanFormalKpiRow .guru-dash-kpi-card {
      padding: 16px 12px 14px;
      min-width: 0;
    }

    #dataPendidikanFormalKpiRow .guru-dash-kpi-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #dataPendidikanFormalKpiRow .guru-dash-kpi-value {
      font-size: clamp(18px, 1.8vw, 26px);
    }

    /* Data Pengurus: kartu menampilkan NAMA orang (teks), bukan angka besar —
       jadi nilai gede/tabular-nums bawaan .guru-dash-kpi-value dikecilkan &
       dibolehkan wrap 2 baris, supaya nama panjang tidak meluber keluar kartu. */
    .pengurus-nama-value {
      font-size: 16px !important;
      font-weight: 700;
      white-space: normal;
      line-height: 1.3;
      font-variant-numeric: normal;
    }

    /* Layar "Struktur Pengurus Generus Kelp" — bagan vertikal (Pembina Generus
       → Wk Pembina Generus [1-4 kotak] → PJP Kelp → Kepsek/Pembina Pra Remaja/
       Pembina Remaja [→ Ketua Muda-Mudi]/Sekretaris/Bendahara). Semua garis
       murni CSS, dihitung presisi (bukan border bawaan flex yg melebar ke tepi
       kotak pertama/terakhir — lihat catatan di .struktur-branch-row::before).
       Kotak SENGAJA dibuat lebar TETAP (bukan min-width) supaya perhitungan
       titik-tengah kotak pertama/terakhir di bawah selalu akurat. */
    /* Modal dibuat hampir sepenuh layar (bukan lebar tetap) supaya bagan bisa
       muat tanpa scroll kanan-kiri/atas-bawah di layar desktop mana pun —
       .struktur-pengurus-body TIDAK discroll (overflow hidden), isinya
       (.struktur-chart) diskalakan pas (JS: fitStrukturPengurusChart_) supaya
       selalu utuh terlihat. */
    .modal-content.struktur-pengurus-modal {
      width: 96vw;
      max-width: 96vw;
      height: 92vh;
      max-height: 92vh;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
    }

    .struktur-pengurus-modal .modal-header,
    .struktur-pengurus-modal .modal-footer {
      flex: 0 0 auto;
    }

    .struktur-pengurus-body {
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
      padding: 8px;
      min-height: 0;
    }

    .struktur-chart {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transform-origin: center center;
    }

    .struktur-node {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      text-align: center;
      width: 172px;
      box-sizing: border-box;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    .struktur-node-title {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .struktur-node-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      word-break: break-word;
    }

    /* Garis vertikal lurus antar level tunggal (mis. Pembina Generus → Wk
       Pembina Generus, atau di dalam 1 kolom antara Pembina Remaja → Ketua
       Muda-Mudi). */
    .struktur-connector {
      width: 2px;
      height: 26px;
      background: var(--border);
    }

    /* Baris kotak sejajar (Wk Pembina 1-4 kotak, atau 5 dapukan di bawah PJP
       Kelp). Garis horizontal TIDAK LAGI pakai ::before/::after dgn inset
       tebak-tebakan (pernah meleset — garis berhenti di tengah jalan, tidak
       nyampe kotak terakhir). Sekarang diukur & digambar oleh JS
       (drawStrukturBranchLines_) sbg elemen sungguhan `.struktur-branch-line`,
       posisi PERSIS dari titik-tengah kotak pertama & terakhir yg terukur —
       akurat berapa pun jumlah/lebar kotaknya, tidak bergantung asumsi lebar
       tetap. */
    .struktur-branch-row {
      position: relative;
      display: inline-flex;
      gap: 24px;
      padding-top: 26px;
    }

    .struktur-branch-line {
      position: absolute;
      top: 0;
      height: 2px;
      background: var(--border);
    }

    /* "converge-below": KHUSUS baris Wk Pembina Generus — butuh ruang kosong
       di bawah kotak (26px) supaya .struktur-elbow-line (JS: drawWkPembinaElbow_)
       punya tempat menggambar siku turun-belok-turun dari kotak Wk Pembina
       PERTAMA menuju connector polos yg sudah ada ke PJP Kelp. */
    .struktur-branch-row.converge-below {
      padding-bottom: 26px;
    }

    .struktur-elbow-line {
      position: absolute;
      background: var(--border);
    }

    .struktur-elbow-vline {
      width: 2px;
    }

    .struktur-elbow-hline {
      height: 2px;
    }

    /* Satu kolom di dalam baris sejajar — "kaki" vertikal dari garis horizontal
       ke kotaknya, dan (kalau ada) menampung anak turunan di bawahnya (mis.
       kolom Pembina Remaja membawa Ketua Muda-Mudi). */
    .struktur-col {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .struktur-col::before {
      content: '';
      position: absolute;
      top: -26px;
      left: 50%;
      width: 2px;
      height: 26px;
      background: var(--border);
      transform: translateX(-50%);
    }

    #dataPendidikanFormalKpiRow .gk-kpi-lp {
      font-size: 10px;
    }

    .guru-dash-toggle-table {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 0 0 16px;
      font-family: inherit;
    }

    .guru-dash-toggle-table:hover {
      color: var(--brass);
    }

    .guru-dash-toggle-table .guru-dash-toggle-caret {
      font-size: 10px;
      transition: transform 0.2s ease;
      display: inline-block;
    }

    .guru-dash-toggle-table.open .guru-dash-toggle-caret {
      transform: rotate(90deg);
    }

    .guru-dash-toggle-table.guru-dash-header-btn {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      color: var(--text);
    }

    .guru-dash-toggle-table.guru-dash-header-btn:hover {
      background: var(--border);
      color: var(--text);
    }

    /* Kurikulum — Tab switching & Card styles */
    .kurikulum-tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 16px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s;
    }

    .kurikulum-tab-btn:hover {
      color: var(--brass);
      border-bottom-color: var(--brass);
    }

    .kurikulum-tab-btn.active {
      color: var(--brass);
      border-bottom-color: var(--brass);
    }

    .kurikulum-tab-content {
      display: none;
    }

    .kurikulum-tab-content.active {
      display: block;
    }

    /* Submenu section Dashboard Kelompok (Kelp Petemon dkk): Dashboard/Data
       Master/Operasional/Kurikulum/Monitoring/Laporan — dipakai window.switchKelpSectionTab_ */
    .kelp-section-tabs-strip {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      gap: 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .kelp-section-tab {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .kelp-section-tab:hover {
      background: var(--border);
      color: var(--text);
    }

    .kelp-section-tab.active {
      background: rgba(217, 119, 6, 0.12);
      border-color: var(--brass);
      color: var(--brass);
    }

    .kelp-section-panel {
      display: none;
    }

    .kelp-section-panel.active {
      display: block;
    }

    /* Tab Data Master (Kelp Petemon): dulu overflow dimatikan di sini karena
       Data Guru + Data Generus pas persis 1 layar tanpa scroll. Sejak section
       Siklus Generus ditambahkan, isi panel ini lebih tinggi dari viewport,
       jadi overflow HARUS auto supaya bisa discroll (dulu terkunci, tidak
       bisa scroll ke section paling bawah). */
    #screenGuruDashboard:has(#kelpPanelDataMaster.active) .dash-container {
      overflow-y: auto;
    }

    #kelpPanelDataMaster .dash-section-title {
      margin-bottom: 12px;
    }

    #kelpPanelDataMaster .guru-dash-kpi-row {
      margin-bottom: 14px;
    }

    /* Monitoring kehadiran generus (tab Monitoring, Dashboard Kelompok):
       4 bar per jenjang + ranking kelas_ngaji per jenjang di bawahnya. */
    .monitoring-jenjang-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03), 0 10px 24px -12px rgba(15, 23, 42, 0.1);
    }

    .monitoring-jenjang-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .monitoring-jenjang-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .monitoring-jenjang-meta {
      font-size: 11.5px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .monitoring-badge {
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .monitoring-badge-hijau-tua { background: rgba(21, 128, 61, 0.14); color: #15803d; }
    .monitoring-badge-hijau-muda { background: rgba(74, 222, 128, 0.2); color: #16a34a; }
    .monitoring-badge-kuning { background: rgba(234, 179, 8, 0.18); color: #a16207; }
    .monitoring-badge-merah { background: rgba(220, 38, 38, 0.12); color: #dc2626; }
    .monitoring-badge-abu { background: var(--panel-2); color: var(--text-faint); }

    .monitoring-bar-track {
      height: 20px;
      border-radius: 999px;
      background: var(--panel-2);
      overflow: hidden;
    }

    .monitoring-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.5s ease;
    }

    .monitoring-fill-hijau-tua { background: #15803d; }
    .monitoring-fill-hijau-muda { background: #4ade80; }
    .monitoring-fill-kuning { background: #eab308; }
    .monitoring-fill-merah { background: #dc2626; }
    .monitoring-fill-abu { background: var(--border); }

    .monitoring-kelas-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 14px;
    }

    .monitoring-kelas-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: var(--radius);
      background: var(--panel-2);
    }

    .monitoring-kelas-rank {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--panel);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
    }

    .monitoring-kelas-nama {
      flex: 1;
      min-width: 0;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .monitoring-kelas-jumlah {
      flex-shrink: 0;
      font-size: 11.5px;
      color: var(--text-dim);
    }

    /* Kartu Prota dikelompokkan per Kelas — 1 kartu = 1 Kelas, isinya daftar
       materi (kategori) bernomor supaya tetap ringkas walau kategori terus
       bertambah (bandingkan dgn 1 kartu per kategori sebelumnya). */
    .kurikulum-kelas-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03), 0 10px 24px -12px rgba(15, 23, 42, 0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .kurikulum-kelas-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.05), 0 16px 32px -14px rgba(15, 23, 42, 0.18);
    }

    .kurikulum-kelas-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .kurikulum-kelas-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .kurikulum-kelas-add-btn {
      background: none;
      border: none;
      color: var(--brass);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .kurikulum-kelas-add-btn:hover {
      background: rgba(217, 119, 6, 0.1);
    }

    .kurikulum-materi-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kurikulum-materi-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px 9px 22px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s, opacity 0.15s;
    }

    .kurikulum-materi-item:hover {
      background: var(--panel-2);
    }

    /* Drag & drop reorder (window.initProtaDragDrop_) -- handle muncul cuma
       saat baris disorot (mengikuti gaya "auto-hide" yang sama dgn
       .kurikulum-materi-actions), grab saat dipegang, "diangkat" (bayangan +
       transparan) selama proses geser. */
    .kurikulum-materi-drag-handle {
      position: absolute;
      left: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      text-align: center;
      font-size: 14px;
      line-height: 1;
      color: var(--text-faint);
      cursor: grab;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .kurikulum-materi-item:hover .kurikulum-materi-drag-handle {
      opacity: 1;
    }

    .kurikulum-materi-drag-handle:active {
      cursor: grabbing;
    }

    .kurikulum-materi-item.dragging {
      opacity: 0.45;
      background: var(--panel-2);
      box-shadow: 0 6px 16px -6px rgba(15, 23, 42, 0.28);
    }

    .kurikulum-materi-label {
      flex: 1;
      min-width: 0;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: -0.005em;
      color: var(--text);
    }

    .kurikulum-materi-num {
      color: var(--text-faint);
      font-weight: 700;
    }

    .kurikulum-materi-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .kurikulum-materi-item:hover .kurikulum-materi-actions {
      opacity: 1;
    }

    .kurikulum-materi-icon-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: none;
      background: var(--panel);
      color: var(--text-dim);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .kurikulum-materi-icon-btn:hover {
      background: var(--border);
      color: var(--text);
    }

    .kurikulum-materi-icon-btn.kurikulum-materi-icon-danger:hover {
      background: rgba(220, 38, 38, 0.12);
      color: #dc2626;
    }

    /* Chevron kecil di depan nama materi — berputar 90° saat detail
       semester-nya dibuka inline (lihat window.toggleMateriDetail_). */
    .kurikulum-materi-chevron {
      display: inline-block;
      margin-right: 6px;
      color: var(--text-faint);
      transition: transform 0.15s ease;
    }

    .kurikulum-materi-item.expanded .kurikulum-materi-chevron {
      transform: rotate(90deg);
      color: var(--brass);
    }

    .kurikulum-materi-item.expanded {
      background: var(--panel-2);
    }

    /* Rincian Semester dibuka INLINE tepat di bawah nama materi yang diklik
       (bukan pindah tab) -- garis aksen kiri menegaskan ini "anak" dari
       materi di atasnya. */
    .kurikulum-materi-detail {
      margin: 2px 0 8px 10px;
      padding-left: 12px;
      border-left: 2px solid var(--brass);
    }

    .kurikulum-protes-row {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .kurikulum-promes-block {
      margin-bottom: 8px;
    }

    .kurikulum-promes-block .kurikulum-protes-row {
      display: block;
    }

    .kurikulum-promes-sem-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--brass);
      margin-bottom: 4px;
    }

    .kurikulum-promes-empty {
      color: var(--text-faint);
      font-style: italic;
    }

    /* Blok "Target Semester I/II" di modal Edit Materi -- muncul cuma saat
       Edit (klik ✎ di materi), tempat isi/ubah target kedua semester
       sekaligus dalam 1 form yang sama. */
    .kurikulum-sem-edit-block {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 12px;
      background: var(--panel-2);
    }

    .kurikulum-sem-edit-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--brass);
      margin-bottom: 8px;
    }

    /* Daftar baris "Catatan" dinamis per Semester di modal Edit Materi --
       Enter menambah baris baru bernomor (window.protaCatatanKeydown_). */
    .prota-catatan-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .prota-catatan-line-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prota-catatan-line-num {
      flex-shrink: 0;
      width: 18px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-faint);
      text-align: right;
    }

    .prota-catatan-line-row .prota-catatan-input {
      flex: 1;
    }

    /* "Rincian Target" -- Catatan Semester ditampilkan sbg baris bernomor
       rapi ala tabel (border antar baris + zebra stripe) begitu di-expand
       di kartu materi, tapi tetap premium: rounded, warna brand di nomor. */
    .kurikulum-promes-catatan {
      margin-top: 8px;
    }

    .kurikulum-promes-catatan-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 5px;
    }

    .kurikulum-promes-catatan-list {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--panel);
    }

    .kurikulum-promes-catatan-item {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 7px 10px;
      font-size: 12px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
    }

    .kurikulum-promes-catatan-item:last-child {
      border-bottom: none;
    }

    .kurikulum-promes-catatan-item:nth-child(even) {
      background: var(--panel-2);
    }

    .kurikulum-promes-catatan-num {
      flex-shrink: 0;
      width: 16px;
      text-align: right;
      font-weight: 700;
      font-size: 11px;
      color: var(--brass);
    }

    .kurikulum-promes-catatan-text {
      flex: 1;
    }

    /* Tab Semester — laporan lengkap per Kelas: kartu per Kelas, tabel
       GABUNGAN per Semester (baris = materi, kolom = Bulan 1-6 bersama)
       supaya tetap rapi & muat 1 layar walau materi terus bertambah. */
    .kurikulum-semester-kelas-block {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03), 0 10px 24px -12px rgba(15, 23, 42, 0.1);
    }

    .kurikulum-semester-kelas-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--brass);
    }

    .kurikulum-semester-kelas-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .kurikulum-semester-edit-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--brass);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 999px;
      transition: background 0.15s;
    }

    .kurikulum-semester-edit-btn:hover {
      background: rgba(217, 119, 6, 0.1);
    }

    .kurikulum-semester-sem-block {
      margin-bottom: 16px;
    }

    .kurikulum-semester-sem-block:last-child {
      margin-bottom: 0;
    }

    .kurikulum-semester-sem-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--brass);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .kurikulum-semester-table-wrap {
      overflow-x: auto;
    }

    .kurikulum-semester-merged-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
    }

    .kurikulum-semester-merged-table th,
    .kurikulum-semester-merged-table td {
      padding: 7px 10px;
      border: 1px solid var(--border);
      text-align: center;
      white-space: nowrap;
    }

    .kurikulum-semester-merged-table thead th {
      background: var(--panel-2);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-faint);
      font-weight: 700;
    }

    .kurikulum-semester-merged-table th:first-child,
    .kurikulum-semester-merged-table td:first-child {
      text-align: left;
      font-weight: 600;
      color: var(--text);
      white-space: normal;
      min-width: 150px;
      background: var(--panel-2);
    }

    .kurikulum-semester-merged-table tbody tr:nth-child(even) td:not(:first-child) {
      background: var(--panel-2);
    }

    .kurikulum-semester-eval-cell {
      font-style: italic;
      color: var(--text-faint);
    }

    .kurikulum-semester-fallback-cell {
      text-align: left;
      white-space: normal;
      color: var(--text-dim);
    }

    .kurikulum-semester-no-bulan {
      font-size: 12.5px;
      color: var(--text-dim);
    }

    .kurikulum-pencapaian-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .kurikulum-pencapaian-table thead {
      background: var(--panel-2);
      border: 1px solid var(--border);
    }

    .kurikulum-pencapaian-table th,
    .kurikulum-pencapaian-table td {
      padding: 10px 12px;
      text-align: left;
      border: 1px solid var(--border);
    }

    .kurikulum-pencapaian-table tbody tr:hover {
      background: var(--panel-2);
    }

    .kurikulum-status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .kurikulum-status-badge.pending {
      background: rgba(229, 193, 4, 0.1);
      color: #e5c104;
    }

    .kurikulum-status-badge.in_progress {
      background: rgba(33, 150, 243, 0.1);
      color: #2196f3;
    }

    .kurikulum-status-badge.completed {
      background: rgba(76, 175, 80, 0.1);
      color: #4caf50;
    }

    /* ═════ CUSTOM DATE PICKER (modern, tanpa dependency eksternal) ═════ */
    .ppg-datepicker {
      display: none;
      position: fixed;
      z-index: 1100;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 6px rgba(15, 23, 42, 0.05), 0 20px 40px -12px rgba(15, 23, 42, 0.25);
      padding: 16px;
      width: 296px;
    }

    .ppg-datepicker.open {
      display: block;
    }

    .ppg-datepicker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 12px;
    }

    .ppg-datepicker-nav-btn {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--panel-2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--text-dim);
      transition: all 0.15s;
    }

    .ppg-datepicker-nav-btn:hover {
      background: var(--brass);
      color: white;
      border-color: var(--brass);
    }

    .ppg-datepicker-selects {
      display: flex;
      gap: 6px;
      flex: 1;
    }

    .ppg-datepicker-selects select {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 4px;
      font-size: 12px;
      font-family: inherit;
      color: var(--text);
      background: var(--panel);
      min-width: 0;
    }

    .ppg-datepicker-selects select:first-child {
      flex: 1.3;
    }

    .ppg-datepicker-selects select:last-child {
      flex: 1;
    }

    .ppg-datepicker-weekdays,
    .ppg-datepicker-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .ppg-datepicker-weekday {
      text-align: center;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-faint);
      text-transform: uppercase;
      padding: 4px 0 8px;
    }

    .ppg-datepicker-day {
      text-align: center;
      padding: 7px 0;
      font-size: 12.5px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text);
      transition: all 0.15s;
    }

    .ppg-datepicker-day:hover {
      background: var(--panel-2);
    }

    .ppg-datepicker-day.muted {
      color: var(--text-faint);
      opacity: 0.4;
      cursor: default;
    }

    .ppg-datepicker-day.muted:hover {
      background: transparent;
    }

    .ppg-datepicker-day.today {
      font-weight: 700;
      color: var(--brass);
    }

    .ppg-datepicker-day.selected {
      background: var(--brass);
      color: white;
      font-weight: 700;
    }

    /* ═════ MODAL TAMBAH GURU / GENERUS — DASHBOARD KELOMPOK (premium layout) ═════ */
    #modalGuruKelp .modal-content,
    #modalGenerusKelp .modal-content {
      max-width: 640px;
    }

    #modalGuruKelp .modal-header,
    #modalGenerusKelp .modal-header {
      align-items: flex-start;
      margin-bottom: 22px;
    }

    #modalGuruKelp .guru-kelp-modal-subtitle,
    #modalGenerusKelp .guru-kelp-modal-subtitle,
    #modalPengurus .guru-kelp-modal-subtitle {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-faint);
      text-transform: none;
      letter-spacing: 0;
    }

    #modalGuruKelp .guru-kelp-section,
    #modalGenerusKelp .guru-kelp-section {
      margin-bottom: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    #modalGuruKelp .guru-kelp-section:first-of-type,
    #modalGenerusKelp .guru-kelp-section:first-of-type {
      padding-top: 0;
      border-top: none;
    }

    #modalGuruKelp .guru-kelp-section-title,
    #modalGenerusKelp .guru-kelp-section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--brass);
      margin-bottom: 16px;
    }

    #modalGuruKelp .guru-kelp-row-2,
    #modalGenerusKelp .guru-kelp-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .guru-kelp-rtrw-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .guru-kelp-rtrw-row .form-input {
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .guru-kelp-rtrw-sep {
      color: var(--text-faint);
      font-weight: 700;
      flex-shrink: 0;
    }

    #modalGuruKelp .form-input,
    #modalGuruKelp .form-select,
    #modalGenerusKelp .form-input,
    #modalGenerusKelp .form-select {
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #modalGuruKelp .form-input:focus,
    #modalGuruKelp .form-select:focus,
    #modalGenerusKelp .form-input:focus,
    #modalGenerusKelp .form-select:focus {
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.12), 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    @media (max-width: 479px) {
      #modalGuruKelp .guru-kelp-row-2,
      #modalGenerusKelp .guru-kelp-row-2 {
        grid-template-columns: 1fr;
      }
    }

    /* ═════ TABEL DAFTAR GURU — DASHBOARD KELOMPOK (premium) ═════ */
    .guru-kelp-table-wrapper {
      border-radius: var(--radius-lg);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03), 0 10px 24px -12px rgba(15, 23, 42, 0.12);
    }

    #guruTableToggleBtn.active-state,
    #santriTableToggleBtn.active-state,
    #kgDetailToggleBtn.active-state {
      background: rgba(217, 119, 6, 0.1);
      border-color: var(--brass);
      color: var(--brass);
    }

    /* ═════ KEHADIRAN GENERUS — kartu simple per kelas + tabel detail + form input ═════ */
    .kg-simple-card {
      text-align: center;
      padding: 20px 16px 18px;
    }

    .kg-simple-card .guru-dash-kpi-label {
      white-space: normal;
      margin-bottom: 10px;
    }

    .kg-simple-card .guru-dash-kpi-value-row {
      justify-content: center;
    }

    /* ═════ Laporan Perkembangan Santri (tab Laporan) — kartu metrik flat + tabel detail ═════ */
    .lps-toolbar {
      flex-wrap: wrap;
    }

    .lps-report {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
    }

    .lps-header-center {
      text-align: center;
      margin-bottom: 22px;
    }

    .lps-header-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--text);
    }

    .lps-header-periode {
      font-size: 13px;
      color: #000;
      margin-top: 4px;
    }

    .lps-info-block {
      display: grid;
      grid-template-columns: 1fr 1fr;
      row-gap: 6px;
      column-gap: 24px;
      margin-bottom: 24px;
      text-align: left;
    }

    .lps-info-row {
      font-size: 12.5px;
      color: var(--text);
    }

    .lps-info-row-right {
      justify-self: end;
    }

    .lps-info-key {
      display: inline-block;
      min-width: 92px;
      font-weight: 700;
      color: #000;
    }

    .lps-metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    /* ═════ Modal Kop Surat (letterhead PDF Laporan Perkembangan Santri) ═════ */
    .ks-logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ks-logo-preview {
      width: 56px;
      height: 56px;
      object-fit: contain;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-2);
      padding: 4px;
    }

    .ks-color-input {
      padding: 4px;
      height: 38px;
      width: 48px;
      flex-shrink: 0;
      cursor: pointer;
    }

    #modalKopSurat .modal-content {
      max-width: 640px;
    }

    .ks-baris-block {
      margin-bottom: 18px;
    }

    .ks-baris-block .form-input {
      margin-bottom: 10px;
    }

    .ks-baris-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ks-baris-controls .form-select {
      flex: 1 1 110px;
      min-width: 100px;
    }

    .ks-size-input {
      width: 64px;
      flex-shrink: 0;
    }

    .ks-bold-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: normal;
      font-size: 13px;
      white-space: nowrap;
    }

    .lps-metric-card {
      background: var(--panel);
      border: 0.5px solid var(--border);
      border-top: 3px solid var(--text-faint);
      border-radius: 12px;
      padding: 18px 16px;
    }

    .lps-metric-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-faint);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .lps-metric-value {
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
    }

    .lps-metric-subtext {
      font-size: 13px;
      color: var(--text-faint);
      margin-top: 6px;
    }

    .lps-detail-table-wrap {
      overflow-x: auto;
    }

    .lps-detail-table {
      width: 100%;
      max-width: 2000px;
      border-collapse: collapse;
    }

    .lps-detail-table th,
    .lps-detail-table td {
      border: 1px solid var(--border);
      padding: 9px 12px;
      font-size: 12px;
