      text-align: left;
      word-wrap: break-word;
    }

    .lps-detail-table th {
      background: var(--panel-2);
      font-weight: 700;
      color: var(--text-faint);
      text-transform: uppercase;
      font-size: 10.5px;
      letter-spacing: 0.04em;
    }

    .lps-status-badge {
      display: inline-block;
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
    }

    /* ═════ Matrix Detail Kehadiran (santri × hari efektif) — sticky header + kolom nama/kelas ═════ */
    .kg-matrix-scroll {
      max-height: 560px;
      overflow: auto;
    }

    .kg-matrix-table {
      border-collapse: separate;
      border-spacing: 0;
    }

    .kg-matrix-table th,
    .kg-matrix-table td {
      white-space: nowrap;
      text-align: center;
      padding: 8px 10px;
    }

    .kg-matrix-table thead th {
      position: sticky;
      top: 0;
      z-index: 3;
      background: var(--panel-2);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-faint);
      border-bottom: 1px solid var(--border);
    }

    .kg-matrix-date-head {
      min-width: 44px;
    }

    .kg-matrix-dow {
      display: block;
      font-size: 9px;
      font-weight: 600;
      color: var(--text-faint);
      margin-top: 2px;
    }

    .kg-matrix-sticky {
      position: sticky;
      left: 0;
      background: var(--panel);
      text-align: left;
      z-index: 1;
    }

    .kg-matrix-table thead th.kg-matrix-sticky {
      z-index: 4;
      background: var(--panel-2);
    }

    .kg-matrix-nama {
      left: 0;
      min-width: 160px;
      font-weight: 600;
    }

    .kg-matrix-kelas {
      left: 160px;
      min-width: 110px;
      border-right: 1px solid var(--border);
    }

    .kg-matrix-table tbody tr:nth-child(even) .kg-matrix-sticky {
      background: var(--panel-2);
    }

    .kg-matrix-table tbody tr:hover td {
      background: rgba(217, 119, 6, 0.06);
    }

    .kg-matrix-table tbody tr:hover .kg-matrix-sticky {
      background: rgba(217, 119, 6, 0.1);
    }

    .kg-matrix-cell-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 22px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
    }

    .kg-matrix-badge-hijau-tua { background: #15803d; }
    .kg-matrix-badge-kuning { background: #a16207; }
    .kg-matrix-badge-merah { background: #dc2626; }
    .kg-matrix-badge-abu { background: var(--text-faint); }

    /* Sel matrix Detail Kehadiran bisa diklik utk edit/hapus langsung (CRUD). */
    .kg-matrix-cell-editable {
      cursor: pointer;
    }

    .kg-matrix-cell-editable:hover {
      background: rgba(217, 119, 6, 0.14) !important;
    }

    .ikg-santri-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .ikg-santri-row:last-child {
      border-bottom: none;
    }

    .ikg-santri-nama {
      font-weight: 600;
      color: var(--text);
    }

    .ikg-status-select {
      max-width: 140px;
    }

    .guru-kelp-table-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 18px 16px;
      border-bottom: 1px solid var(--border);
    }

    .guru-kelp-filter-select {
      flex-shrink: 0;
      width: auto;
      padding: 9px 32px 9px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--text);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .guru-kelp-filter-select:focus {
      outline: none;
      border-color: var(--brass);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.12);
    }

    .guru-kelp-search-input {
      margin-bottom: 0 !important;
      border-radius: 999px !important;
    }

    .guru-kelp-search-input:focus {
      outline: none;
      border-color: var(--brass);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1);
    }

    .guru-kelp-table-wrapper .data-table {
      margin-top: 0;
    }

    .guru-kelp-table-wrapper .data-table thead {
      border-bottom: 2px solid var(--border);
    }

    /* Tabel daftar dibuat lebih padat supaya lebih banyak data muat di layar. */
    .guru-kelp-table-wrapper .data-table th {
      letter-spacing: 0.04em;
      padding: 9px 11px;
      font-size: 10.5px;
    }

    .guru-kelp-table-wrapper .data-table tbody tr {
      transition: background 0.15s ease;
    }

    .guru-kelp-table-wrapper .data-table tbody tr:hover {
      background: var(--panel-2);
    }

    .guru-kelp-name-text {
      font-weight: 600;
      color: var(--text);
    }

    .guru-kelp-premium-table td {
      font-size: 12px;
      padding: 8px 11px;
      vertical-align: middle;
    }

    .guru-kelp-premium-table th,
    .guru-kelp-premium-table td {
      white-space: nowrap;
    }

    /* ═════ SCROLL HORIZONTAL + FREEZE KOLOM (No/Nama kiri, Aksi kanan) ═════
       Kolom beku pakai position:sticky relatif ke .gk-table-scroll. */
    /* Maksimal ~10 baris terlihat; sisanya scroll vertikal. Header tabel tetap
       menempel di atas (sticky) saat digulir ke bawah. */
    .gk-table-scroll {
      overflow: auto;
      max-height: 620px;
      -webkit-overflow-scrolling: touch;
    }

    .guru-kelp-premium-table thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--panel-2);
    }

    .guru-kelp-premium-table th.gk-sticky,
    .guru-kelp-premium-table td.gk-sticky {
      position: sticky;
      z-index: 1;
      background: var(--panel);
    }

    .guru-kelp-premium-table thead th.gk-sticky {
      z-index: 3;
      background: var(--panel-2);
    }

    .guru-kelp-premium-table tbody tr:hover td.gk-sticky {
      background: var(--panel-2);
    }

    /* No: padding dikecilkan agar lebar kolom deterministik = 48px, sehingga
       offset kolom Nama (left:48px) presisi tidak meleset/tumpang tindih. */
    .gk-sticky-l1 {
      left: 0;
      width: 38px;
      min-width: 38px;
      padding-left: 10px;
      padding-right: 6px;
      font-variant-numeric: tabular-nums;
    }
    .gk-sticky-l2 { left: 38px; min-width: 138px; box-shadow: 6px 0 8px -7px rgba(15, 23, 42, 0.25); }
    .gk-sticky-r { right: 0; min-width: 100px; box-shadow: -6px 0 8px -7px rgba(15, 23, 42, 0.25); }

    /* ═════ COLUMN PICKER ═════ */
    .guru-kelp-table-toolbar .search-input {
      flex: 1 1 120px;
      min-width: 120px;
    }

    .gk-colpicker-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .gk-colpicker-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--text);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .gk-colpicker-btn:hover {
      border-color: var(--brass);
      color: var(--brass);
    }

    .gk-colpicker-panel {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      min-width: 210px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-card);
      padding: 8px;
      z-index: 60;
    }

    .gk-colpicker-panel.open {
      display: block;
    }

    .gk-colpicker-title {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-faint);
      padding: 4px 8px 8px;
    }

    .gk-colpicker-panel label {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
    }

    .gk-colpicker-panel label:hover {
      background: var(--panel-2);
    }

    .gk-colpicker-panel input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--brass);
      cursor: pointer;
    }

    .guru-kelp-badge {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: var(--panel-2);
      color: var(--text-dim);
    }

    .guru-kelp-badge.badge-tugasan {
      background: rgba(5, 150, 105, 0.1);
      color: var(--sage);
    }

    .guru-kelp-badge.badge-setempat {
      background: rgba(251, 191, 36, 0.18);
      color: #92650a;
    }

    .guru-kelp-badge.badge-bantu {
      background: rgba(79, 70, 229, 0.1);
      color: var(--indigo);
    }

    .guru-kelp-aksi-group {
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }

    .guru-kelp-aksi-btn {
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      color: var(--text-faint);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .guru-kelp-aksi-btn svg {
      width: 16px;
      height: 16px;
    }

    .guru-kelp-aksi-btn:hover {
      color: var(--brass);
      transform: translateY(-1px);
    }

    .guru-kelp-aksi-btn.danger:hover {
      color: var(--red);
    }

    /* ═════ MODAL KONFIRMASI HAPUS GURU — DASHBOARD KELOMPOK (premium) ═════ */
    .guru-kelp-delete-modal {
      max-width: 380px;
      text-align: center;
      padding: 40px 32px 32px;
      position: relative;
      animation: guruKelpDeletePop 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes guruKelpDeletePop {
      from { opacity: 0; transform: scale(0.96) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .guru-kelp-delete-close {
      position: absolute;
      top: 16px;
      right: 16px;
    }

    .guru-kelp-delete-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(220, 38, 38, 0.08);
      color: var(--red);
      margin: 0 auto 20px;
    }

    .guru-kelp-delete-icon svg {
      width: 26px;
      height: 26px;
    }

    .guru-kelp-delete-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .guru-kelp-delete-message {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .guru-kelp-delete-message strong {
      color: var(--text);
    }

    .guru-kelp-delete-footer {
      justify-content: center;
      margin-top: 28px;
    }

    .guru-kelp-btn-danger {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 100px;
      padding: 10px 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      background: var(--red);
      color: white;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    .guru-kelp-btn-danger:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .guru-kelp-btn-danger:disabled {
      cursor: not-allowed;
    }

    .guru-kelp-btn-label {
      transition: opacity 0.15s ease;
    }

    .guru-kelp-spinner {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      width: 15px;
      height: 15px;
      margin: -8px 0 0 -8px;
      border: 2px solid rgba(255, 255, 255, 0.32);
      border-top-color: #fff;
      border-radius: 50%;
      animation: guruKelpSpin 0.65s linear infinite;
    }

    .guru-kelp-btn-danger.is-loading .guru-kelp-btn-label {
      opacity: 0;
    }

    .guru-kelp-btn-danger.is-loading .guru-kelp-spinner {
      display: block;
    }

    @keyframes guruKelpSpin {
      to { transform: rotate(360deg); }
    }

    /* ═════ GLOBAL LOADING OVERLAY (spinner tengah layar, tema brass) ═════ */
    #globalLoadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: rgba(248, 250, 252, 0.72);
      backdrop-filter: blur(2px);
    }

    #globalLoadingOverlay.active {
      display: flex;
    }

    .global-loading-ring {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(217, 119, 6, 0.16);
      border-top-color: var(--brass);
      animation: guruKelpSpin 0.7s linear infinite;
    }

    .global-loading-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.02em;
    }

    /* ═════ MODAL DETAIL GURU/GENERUS — DASHBOARD KELOMPOK (premium, read-only) ═════ */
    .guru-kelp-detail-modal {
      max-width: 560px;
    }

    .guru-kelp-detail-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 20px;
    }

    .guru-kelp-detail-item.full {
      grid-column: 1 / -1;
    }

    .guru-kelp-detail-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 4px;
    }

    .guru-kelp-detail-value {
      font-size: 13.5px;
      color: var(--text);
      font-weight: 500;
    }

    .guru-kelp-detail-value.empty {
      color: var(--text-faint);
      font-weight: 400;
      font-style: italic;
    }

    @media (max-width: 479px) {
      .guru-kelp-detail-body {
        grid-template-columns: 1fr;
      }
    }

    .guru-kelp-umur-badge {
      display: inline-flex;
      margin-top: 8px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(5, 150, 105, 0.1);
      color: var(--sage);
      font-size: 12px;
      font-weight: 600;
    }

    /* ═════ TABLE & FORM ═════ */
    .data-table-wrapper {
      background: var(--panel);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      overflow-x: auto;
      margin-bottom: 48px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .data-table thead {
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
    }

    .data-table th {
      padding: 14px 16px;
      text-align: left;
      font-weight: 600;
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .data-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    .data-table tbody tr:hover {
      background: var(--panel-2);
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      font-family: inherit;
      margin-bottom: 24px;
    }

    /* ═════ MODAL ═════ */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--panel);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 25px rgba(0, 0, 0, 0.15);
      padding: 32px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }

    /* Mobile modal: full-screen or nearly full-screen */
    @media (max-width: 479px) {
      .modal-content {
        width: 95%;
        max-width: 100%;
        max-height: 95vh;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        padding: 20px;
      }
    }

    @media (min-width: 480px) and (max-width: 767px) {
      .modal-content {
        width: 90%;
        max-width: 95%;
        padding: 24px;
      }
    }

    .modal-header {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-dim);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* Label field di modal Tambah/Edit Guru & Generus: abu-abu tidak terlihat
       saat rekam layar — HANYA 2 modal ini, .form-label di modal lain tidak disentuh. */
    #modalGuruKelp .form-label,
    #modalGenerusKelp .form-label {
      color: var(--text);
    }

    .form-input, .form-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
    }

    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--brass);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1);
    }

    .modal-footer {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      justify-content: flex-end;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--brass);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .btn-icon {
      background: transparent;
      color: var(--text-dim);
      padding: 6px 10px;
      font-size: 16px;
    }

    .btn-icon:hover {
      color: var(--text);
      background: var(--panel-2);
    }

    .btn-icon.danger:hover {
      color: var(--red);
    }

    .sidebar-toggle-btn {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .sidebar-toggle-btn:hover {
      border-color: var(--brass);
      color: var(--brass);
    }

    .sidebar-toggle-btn svg {
      transition: transform 0.2s ease;
      color: currentColor;
      stroke: currentColor;
    }

    .app-sidebar.collapsed .sidebar-toggle-btn svg {
      transform: rotate(180deg);
    }

    .alert {
      padding: 12px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert-success {
      background: rgba(5, 150, 105, 0.1);
      color: var(--sage);
      border: 1px solid rgba(5, 150, 105, 0.2);
    }

    .alert-error {
      background: rgba(220, 38, 38, 0.1);
      color: var(--red);
      border: 1px solid rgba(220, 38, 38, 0.2);
    }

    @media (max-width: 768px) {
      .app-sidebar {
        position: fixed;
        left: -240px;
        height: 100vh;
        top: 0;
        z-index: 999;
        transition: left 0.3s;
      }

      .app-sidebar.mobile-open {
        left: 0;
      }

      /* Toggle sidebar sekarang tinggal di dalam .sidebar-logo (di dalam
         .app-sidebar), tapi .app-sidebar sendiri off-canvas (left:-240px) di
         breakpoint ini — position:fixed di sini melepas tombol dari posisi
         parent-nya supaya tetap bisa dipencet utk membuka sidebar. */
      .sidebar-toggle-btn {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 1000;
      }

      /* Di mobile, tombol toggle WAJIB selalu tampil (satu-satunya jalan buka
         sidebar) — kalahkan rule desktop .collapsed yang menyembunyikannya,
         krn class collapsed bisa tertinggal saat resize dari desktop. */
      .app-sidebar.collapsed .sidebar-toggle-btn {
        display: flex;
      }

      .kpi-grid {
        grid-template-columns: 1fr;
      }

      .dash-container {
        padding: 20px 15px;
      }
    }

    /* ═════ TAB BUTTONS ═════ */
    .tab-button {
      border-bottom: 2px solid transparent !important;
    }

    .tab-button:hover {
      color: var(--brass) !important;
      background: rgba(217, 119, 6, 0.02);
    }

    .tab-button.active {
      color: var(--brass) !important;
      border-bottom-color: var(--brass) !important;
    }

    /* ═════ MOBILE OPTIMIZATION ═════ */
    /* Extra Small (xs): 320px - 479px (phones) */
    @media (max-width: 479px) {
      html, body {
        font-size: 13px;
      }

      .app-layout {
        flex-direction: column;
      }

      .app-sidebar {
        width: 100%;
        position: fixed;
        left: -100%;
        height: 100vh;
        top: 0;
        z-index: 999;
        transition: left 0.3s;
        max-height: 100vh;
      }

      .app-sidebar.mobile-open {
        left: 0;
      }

      .app-sidebar.collapsed {
        width: 100%;
        left: -100%;
      }

      .app-content {
        width: 100%;
        margin-left: 0;
      }

      .sidebar-toggle-btn {
        display: flex;
        position: fixed;
        top: 16px;
        left: 16px;
        width: 44px;
        height: 44px;
        z-index: 100;
      }

      .dash-header {
        height: auto;
        padding: 16px 56px 16px 16px;
        padding-top: 70px;
      }

      .dash-header h2 {
        font-size: 18px;
      }

      .dash-container {
        padding: 16px;
      }

      .kpi-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .kpi-card {
        padding: 16px;
      }

      .kpi-value {
        font-size: 28px;
      }

      .data-table-wrapper {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .data-table {
        font-size: 12px;
      }

      .data-table th,
      .data-table td {
        padding: 10px 8px;
      }

      .btn {
        padding: 12px 16px;
        min-height: 44px;
        font-size: 13px;
      }

      .btn-icon {
        min-width: 44px;
        min-height: 44px;
        padding: 10px;
      }

      .modal-content {
        width: 95%;
        max-width: 100%;
        max-height: 90vh;
        padding: 20px;
      }

      .modal-header {
        font-size: 16px;
      }

      .form-input, .form-select {
        font-size: 16px;
        padding: 12px;
      }

      .search-input {
        font-size: 16px;
        padding: 12px 14px;
      }

      .dash-section-title {
        font-size: 16px;
        margin-bottom: 16px;
      }

      .modal-footer {
        flex-direction: column;
        gap: 8px;
      }

      .modal-footer button {
        width: 100%;
      }

      .tab-button {
        padding: 10px 12px !important;
        font-size: 12px !important;
      }

      .sidebar-logout {
        padding: 8px 10px;
        font-size: 11px;
      }
    }

    /* Small (sm): 480px - 767px (larger phones) */
    @media (max-width: 767px) {
      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .data-table {
        font-size: 12px;
      }

      .dash-header {
        height: auto;
        padding: 16px;
      }

      .dash-container {
        padding: 16px 12px;
      }

      .modal-content {
        width: 90%;
        max-width: 100%;
      }

      .btn {
        font-size: 13px;
      }
    }

    /* Medium (md): 768px - 1023px (tablets) */
    @media (min-width: 768px) and (max-width: 1023px) {
      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .dash-container {
        padding: 24px 20px;
        max-width: 100%;
      }
    }

    /* Large (lg): 1024px - 1279px (small desktops) */
    @media (min-width: 1024px) and (max-width: 1279px) {
      .kpi-grid {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }

      .dash-container {
        max-width: 1000px;
      }
    }

    /* Extra Large (xl): 1280px+ (desktops) */
    @media (min-width: 1280px) {
      .kpi-grid {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }

      .dash-container {
        max-width: 1200px;
      }
    }

    /* Touch interaction improvements */
    @media (hover: none) and (pointer: coarse) {
      /* Mobile devices */
      .btn,
      .btn-primary,
      .btn-secondary,
      .btn-icon,
      .sidebar-menu-link,
      .sidebar-logout,
      .tab-button {
        min-height: 44px;
        min-width: 44px;
        padding: 10px 12px;
      }

      .btn-icon {
        padding: 8px;
      }

      .sidebar-menu-link {
        padding: 14px 16px;
      }

      /* Remove hover effects on touch devices */
      .btn:active {
        opacity: 0.8;
      }

      .sidebar-menu-link:active {
        background: var(--panel-2);
      }
    }

    /* Form optimization for mobile */
    @media (max-width: 767px) {
      input[type="text"],
      input[type="email"],
      input[type="date"],
      input[type="number"],
      select,
      textarea {
        font-size: 16px;
      }

      .form-group {
        margin-bottom: 14px;
      }
    }

    /* Chart responsiveness */
    @media (max-width: 767px) {
      #chartAttendanceTrend,
      #chartAttendanceByKelompok,
      #chartGenderDistribution,
      #chartJenjangDistribution,
      #chartGrowthMetrics {
        height: 300px !important;
      }
    }

    /* Table horizontal scroll on mobile */
    @media (max-width: 767px) {
      .data-table-wrapper {
        border-radius: var(--radius);
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .data-table th:nth-child(n+6),
      .data-table td:nth-child(n+6) {
        min-width: 80px;
      }
    }

    }

      align-items: center;
      gap: 6px;

      background: linear-gradient(135deg, #FFFFFF 0%, #ECFDF5 100%);
      color: var(--sage);
      font-size: 12.5px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: var(--radius-button);
      box-shadow: 0 2px 10px rgba(5, 150, 105, 0.12);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .ia-filter-btn:active { transform: scale(0.96); }

    .ia-filter-btn.active {
      background: linear-gradient(135deg, var(--sage) 0%, var(--brand-green) 100%);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.32);

      background: var(--panel);

      font-weight: 600;

      color: var(--text);

      background: var(--border);

    .ia-progress-fill {

    .ia-santri-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--panel);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-subtle);
      animation: iaCardIn 0.25s ease both;
    }

    @keyframes iaCardIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }

    .ia-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--indigo), var(--teal));

      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .ia-santri-nama {
      flex: 1;
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ia-status-toggle {
      display: flex;
      gap: 3px;
      background: var(--bg);
      border-radius: var(--radius-button);
      padding: 3px;
      flex-shrink: 0;

    .ia-status-btn {
      border: none;
      background: transparent;
      padding: 7px 8px;
      border-radius: var(--radius-button);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-faint);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
    }

    .ia-status-btn:active { transform: scale(0.92); }

    .ia-status-btn.active[data-status="hadir"] { background: var(--sage); color: #fff; }
    .ia-status-btn.active[data-status="izin"] { background: var(--volt); color: #78350F; }
    .ia-status-btn.active[data-status="sakit"] { background: var(--indigo); color: #fff; }
    .ia-status-btn.active[data-status="alpa"] { background: var(--red); color: #fff; }

    .ia-bottom-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(248,250,252,0) 0%, var(--bg) 30%);
    }

    .ia-save-btn {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, var(--sage), var(--brand-green));
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 15px;
      border-radius: var(--radius-lg);
      box-shadow: 0 6px 16px rgba(5, 150, 105, 0.3);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .ia-save-btn:active { transform: scale(0.98); }
    .ia-save-btn:disabled { opacity: 0.6; }

    .ia-save-btn.ia-save-btn-locked {
      background: linear-gradient(135deg, #94A3B8, #64748B);
      box-shadow: 0 4px 12px rgba(100, 116, 139, 0.25);
    }

    /* ═════ POPUP STATUS SIMPAN ABSEN (hyper premium) ═════ */
