<script>
  window.currentToken = null;
  window.currentUser = null;
  window.currentKelompokId = null;

  function showAlert(elementId, message, type) {
    const alert = document.getElementById(elementId);
    alert.textContent = message;
    alert.className = `alert show alert-${type}`;
    setTimeout(() => {
      alert.classList.remove('show');
    }, 3000);
  }

  /* Spinner global tengah layar (tema brass). Pakai untuk SEMUA momen tunggu:
     boot aplikasi, simpan/hapus, ekspor. Jangan buat spinner lokal baru. */
  window.showGlobalLoading_ = function (text) {
    document.getElementById('globalLoadingText').textContent = text || 'Memuat...';
    document.getElementById('globalLoadingOverlay').classList.add('active');
  };

  window.hideGlobalLoading_ = function () {
    document.getElementById('globalLoadingOverlay').classList.remove('active');
  };

  window.onload = function () {
    document.getElementById('absensiTanggal').valueAsDate = new Date();

    google.script.run
      .withSuccessHandler(function (result) {
        if (result.devMode) {
          document.getElementById('devBanner').style.display = 'block';
          window.currentToken = result.token;
          window.currentUser = result.user;
          window.currentKelompokId = result.user.scopeId;
          renderApp(result.user);
          return;
        }
        const token = sessionStorage.getItem('ppg_token');
        if (token) {
          verifySession(token);
        } else {
          window.hideGlobalLoading_();
          document.getElementById('screenLogin').style.display = 'flex';
        }
      })
      .withFailureHandler(function () {
        window.hideGlobalLoading_();
        document.getElementById('screenLogin').style.display = 'flex';
      })
      .serverCheckDevMode();
  };

  window.toggleLoginPasswordVisibility_ = function (inputId, btnEl) {
    const input = document.getElementById(inputId);
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btnEl.title = showing ? 'Tampilkan password' : 'Sembunyikan password';
    btnEl.innerHTML = showing
      ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>'
      : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 1 12s4 8 11 8a9.74 9.74 0 0 0 5.39-1.61"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  };

  window.switchLoginTab_ = function (tab) {
    const isMasuk = tab === 'masuk';
    document.getElementById('loginTabMasuk').classList.toggle('active', isMasuk);
    document.getElementById('loginTabDaftar').classList.toggle('active', !isMasuk);
    document.getElementById('loginPanelMasuk').style.display = isMasuk ? 'block' : 'none';
    document.getElementById('loginPanelDaftar').style.display = isMasuk ? 'none' : 'block';
  };

  window.handleRegisterGuru = function () {
    const email = document.getElementById('daftarEmail').value.trim();
    const password = document.getElementById('daftarPassword').value;
    const errorEl = document.getElementById('daftarError');
    const successEl = document.getElementById('daftarSuccess');
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    if (!email || !password) {
      errorEl.textContent = 'Email dan password wajib diisi.';
      errorEl.style.display = 'block';
      return;
    }

    const btn = document.getElementById('btnDaftar');
    btn.disabled = true;
    btn.textContent = 'Memproses...';

    google.script.run
      .withSuccessHandler(function (result) {
        if (!result.success) {
          btn.disabled = false;
          btn.textContent = 'Daftar';
          errorEl.textContent = result.error;
          errorEl.style.display = 'block';
          return;
        }

        successEl.textContent = '✓ ' + result.message;
        successEl.style.display = 'block';

        sessionStorage.setItem('ppg_token', result.token);
        window.currentToken = result.token;
        window.currentUser = result.user;
        window.currentKelompokId = result.user.scopeId;

        setTimeout(function () { renderApp(result.user); }, 500);
      })
      .withFailureHandler(function () {
        btn.disabled = false;
        btn.textContent = 'Daftar';
        errorEl.textContent = 'Gagal mendaftar. Coba lagi.';
        errorEl.style.display = 'block';
      })
      .serverRegisterGuru(email, password);
  };

  window.handleLogin = function () {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      const error = document.getElementById('loginError');
      error.textContent = 'Username dan password wajib diisi.';
      error.style.display = 'block';
      return;
    }

    const btn = document.getElementById('btnLogin');
    btn.disabled = true;
    btn.textContent = 'Memproses...';

    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.textContent = 'Masuk';

        if (!result.success) {
          const error = document.getElementById('loginError');
          error.textContent = result.error;
          error.style.display = 'block';
          return;
        }

        sessionStorage.setItem('ppg_token', result.token);
        window.currentToken = result.token;
        window.currentUser = result.user;
        window.currentKelompokId = result.user.scopeId;
        renderApp(result.user);
      })
      .serverLogin(username, password);
  };

  function verifySession(token) {
    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          window.currentToken = token;
          window.currentUser = result.user;
          window.currentKelompokId = result.user.scopeId;
          renderApp(result.user);
        } else {
          sessionStorage.removeItem('ppg_token');
          window.hideGlobalLoading_();
          document.getElementById('screenLogin').style.display = 'flex';
        }
      })
      .withFailureHandler(function () {
        window.hideGlobalLoading_();
        document.getElementById('screenLogin').style.display = 'flex';
      })
      .serverGetSession(token);
  }

  function renderApp(user) {
    window.hideGlobalLoading_();
    document.getElementById('screenLogin').style.display = 'none';
    document.getElementById('screenOnboarding').style.display = 'none';

    // Akun baru daftar (role masih kosong) belum lengkap — wajib lewat
    // wizard onboarding dulu sebelum bisa akses apa pun (Code.js →
    // serverCompleteOnboardingGuru).
    if (!user.role) {
      document.getElementById('appLayout').style.display = 'none';
      document.getElementById('screenInputAbsen').style.display = 'none';
      document.getElementById('screenOnboarding').style.display = 'flex';
      window.initOnboarding_();
      return;
    }

    // Role 'guru' TIDAK PERNAH melihat shell admin (appLayout/sidebar/menu) —
    // dikunci total ke screen Input Absen sendiri (Modul_InputAbsen.gs).
    if (user.role === 'guru') {
      document.getElementById('appLayout').style.display = 'none';
      document.getElementById('screenInputAbsen').style.display = 'flex';
      window.initInputAbsen_();
      return;
    }

    document.getElementById('appLayout').style.display = 'flex';

    // Menu Desa (browse Kelompok lintas Desa) hanya untuk Admin PPG
    const isAdminPpg = (user.role === 'admin_ppg');
    document.getElementById('menuDesaToggle').style.display = isAdminPpg ? 'flex' : 'none';
    document.getElementById('menuInputAbsenAdmin').style.display = isAdminPpg ? 'flex' : 'none';
    if (isAdminPpg) window.renderSidebarTree_();

    window.loadDashboard();
  }

  window.handleLogout = function () {
    const token = sessionStorage.getItem('ppg_token') || window.currentToken;
    google.script.run.serverLogout(token);
    sessionStorage.removeItem('ppg_token');
    window.currentToken = null;
    window.currentUser = null;
    document.getElementById('screenLogin').style.display = 'flex';
    document.getElementById('appLayout').style.display = 'none';
    document.getElementById('screenInputAbsen').style.display = 'none';
    document.getElementById('screenOnboarding').style.display = 'none';
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    window.switchLoginTab_('masuk');
  };

  /* ═════ ONBOARDING WIZARD (akun baru daftar, role masih kosong) ═════ */

  window.onboardState_ = { step: 1, role: null, kelompokId: null, kelompokNama: null };

  window.initOnboarding_ = function () {
    window.onboardState_ = { step: 1, role: null, kelompokId: null, kelompokNama: null };
    document.getElementById('onboardAdminMsg').style.display = 'none';
    document.querySelector('#onboardStep1 .onboard-role-grid').style.display = 'grid';
    document.getElementById('onboardNama').value = '';
    document.getElementById('onboardKelas').value = '';
    document.getElementById('onboardError').style.display = 'none';
    window.onboardGoStep_(1);
  };

  window.onboardGoStep_ = function (step) {
    window.onboardState_.step = step;
    [1, 2, 3, 4].forEach(function (n) {
      document.getElementById('onboardStep' + n).style.display = n === step ? 'block' : 'none';
      document.querySelector('.onboard-step-dot[data-step="' + n + '"]').classList.toggle('active', n === step);
    });
    if (step === 2) window.onboardLoadKelompok_();
  };

  window.onboardChooseRole_ = function (role) {
    window.onboardState_.role = role;
    if (role === 'admin') {
      document.querySelector('#onboardStep1 .onboard-role-grid').style.display = 'none';
      document.getElementById('onboardAdminMsg').style.display = 'block';
      return;
    }
    window.onboardGoStep_(2);
  };

  window.onboardBackToRole_ = function () {
    document.getElementById('onboardAdminMsg').style.display = 'none';
    document.querySelector('#onboardStep1 .onboard-role-grid').style.display = 'grid';
  };

  window.onboardLoadKelompok_ = function () {
    const list = document.getElementById('onboardKelompokList');
    list.innerHTML = '<div style="text-align:center; color:var(--text-faint); font-size:13px; padding:12px;">Memuat...</div>';

    google.script.run
      .withSuccessHandler(function (result) {
        list.innerHTML = '';
        if (!result.success || result.data.length === 0) {
          list.innerHTML = '<div style="text-align:center; color:var(--text-faint); font-size:13px; padding:12px;">Belum ada Kelompok tersedia.</div>';
          return;
        }
        result.data.forEach(function (k) {
          const item = document.createElement('div');
          item.className = 'onboard-kelompok-item';
          item.textContent = k.nama;
          item.onclick = function () {
            document.querySelectorAll('.onboard-kelompok-item').forEach(function (el) { el.classList.remove('active'); });
            item.classList.add('active');
            window.onboardState_.kelompokId = k.id;
            window.onboardState_.kelompokNama = k.nama;
            setTimeout(function () { window.onboardGoStep_(3); }, 150);
          };
          list.appendChild(item);
        });
      })
      .serverGetOnboardingKelompokOptions();
  };

  window.onboardNamaNext_ = function () {
    const nama = document.getElementById('onboardNama').value.trim();
    if (!nama) return;
    window.onboardGoStep_(4);
  };

  window.onboardSubmit_ = function () {
    const nama = document.getElementById('onboardNama').value.trim();
    const kelas = document.getElementById('onboardKelas').value.trim();
    const errorEl = document.getElementById('onboardError');
    errorEl.style.display = 'none';

    if (!kelas) return;

    const btn = document.getElementById('btnOnboardSubmit');
    btn.disabled = true;
    btn.textContent = 'Memeriksa...';

    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.textContent = 'Selesai';

        if (!result.success) {
          errorEl.textContent = result.error;
          errorEl.style.display = 'block';
          return;
        }

        window.currentUser = result.user;
        window.currentKelompokId = result.user.scopeId;
        renderApp(result.user);
      })
      .withFailureHandler(function () {
        btn.disabled = false;
        btn.textContent = 'Selesai';
        errorEl.textContent = 'Gagal memeriksa data. Coba lagi.';
        errorEl.style.display = 'block';
      })
      .serverCompleteOnboardingGuru(window.currentToken, window.onboardState_.kelompokId, nama, kelas);
  };

  /* ─── Lupa Password mandiri ─── */

  window.openModalLupaPassword_ = function () {
    document.getElementById('lupaEmail').value = '';
    document.getElementById('lupaNama').value = '';
    document.getElementById('lupaKelas').value = '';
    document.getElementById('lupaPasswordBaru').value = '';
    document.getElementById('lupaMsg').style.display = 'none';

    const select = document.getElementById('lupaKelompok');
    select.innerHTML = '<option value="">Memuat...</option>';
    google.script.run
      .withSuccessHandler(function (result) {
        select.innerHTML = '<option value="">-- Pilih Kelompok --</option>';
        if (result.success) {
          result.data.forEach(function (k) {
            const opt = document.createElement('option');
            opt.value = k.id;
            opt.textContent = k.nama;
            select.appendChild(opt);
          });
        }
      })
      .serverGetOnboardingKelompokOptions();

    document.getElementById('modalLupaPassword').classList.add('active');
  };

  window.closeModalLupaPassword_ = function () {
    document.getElementById('modalLupaPassword').classList.remove('active');
  };

  window.submitLupaPassword_ = function () {
    const email = document.getElementById('lupaEmail').value.trim();
    const kelompokId = document.getElementById('lupaKelompok').value;
    const nama = document.getElementById('lupaNama').value.trim();
    const kelas = document.getElementById('lupaKelas').value.trim();
    const passwordBaru = document.getElementById('lupaPasswordBaru').value;
    const msg = document.getElementById('lupaMsg');

    if (!email || !kelompokId || !nama || !kelas || !passwordBaru) {
      msg.style.display = 'block';
      msg.style.color = 'var(--red)';
      msg.textContent = 'Semua field wajib diisi.';
      return;
    }

    const btn = document.getElementById('btnLupaSubmit');
    btn.disabled = true;
    btn.textContent = 'Memproses...';

    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.textContent = 'Ubah Password';
        msg.style.display = 'block';
        msg.style.color = result.success ? 'var(--sage)' : 'var(--red)';
        msg.textContent = result.success ? result.message : result.error;
        if (result.success) {
          setTimeout(window.closeModalLupaPassword_, 1500);
        }
      })
      .serverResetPasswordSelfGuru(email, kelompokId, nama, kelas, passwordBaru);
  };

  /* ═════ INPUT ABSEN (khusus role='guru') — Modul_InputAbsen.gs ═════ */

  window.iaState_ = { mode: 'guru', kelompokId: null, kelas: null, list: [], santriCount: 0 };

  function iaToday_() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  /* Set tanggal aktif (hidden value + teks tampilan) tanpa buka picker —
     dipakai saat init screen. */
  function iaSetTanggal_(dateStr) {
    const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    document.getElementById('iaTanggal').value = dateStr;
    const d = new Date(dateStr + 'T00:00:00');
    document.getElementById('iaTanggalDisplay').value = `${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()}`;
    if (window.ppgDatePickerState) delete window.ppgDatePickerState['iaTanggal'];
    window.iaUpdateDateLabel_();
  }

  /* Label tanggal aktif (nama hari + tanggal lengkap) di bawah nama guru,
     dipakai sebagai pengganti card tanggal + tombol "Hari Ini" lama. */
  window.iaUpdateDateLabel_ = function () {
    const dateStr = document.getElementById('iaTanggal').value;
    const label = document.getElementById('iaHeaderDateLabel');
    if (!label || !dateStr) return;
    const dayNames = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const d = new Date(dateStr + 'T00:00:00');
    const isToday = dateStr === iaToday_();
    label.textContent = (isToday ? 'Hari ini · ' : '') + `${dayNames[d.getDay()]}, ${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()}`;
  };

  /* Durasi (menit) dari "HH:MM"–"HH:MM", dipakai info kelas Dashboard. */
  window.iaDurasiMenit_ = function (jamMulai, jamSelesai) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(jamMulai);
    const s = /^(\d{1,2}):(\d{2})$/.exec(jamSelesai);
    if (!m || !s) return null;
    const mulaiMenit = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
    let selesaiMenit = parseInt(s[1], 10) * 60 + parseInt(s[2], 10);
    if (selesaiMenit < mulaiMenit) selesaiMenit += 24 * 60;
    return selesaiMenit - mulaiMenit;
  };

  function iaShowToast_(message, type) {
    const toast = document.getElementById('iaToast');
    toast.textContent = message;
    toast.className = 'ia-toast show' + (type ? ' ' + type : '');
    setTimeout(function () { toast.classList.remove('show'); }, 2500);
  }

  function iaInitials_(nama) {
    const parts = String(nama || '').trim().split(/\s+/);
    return ((parts[0] || '')[0] || '?').toUpperCase() + ((parts[1] || '')[0] || '').toUpperCase();
  }

  /* Guru: dikunci ke kelas miliknya sendiri (dipanggil dari renderApp). */
  window.initInputAbsen_ = function () {
    window.iaState_ = { mode: 'guru', kelompokId: window.currentUser.scopeId, kelas: null, list: [], activeView: 'dashboard' };
    document.getElementById('iaNamaGuru').textContent = window.currentUser.nama || 'Guru';
    document.getElementById('iaKelompokSelect').style.display = 'none';
    document.getElementById('iaBellBtn').style.display = 'flex';
    document.getElementById('iaMenuDashboardBtn').style.display = 'flex';
    document.getElementById('iaMenuGuruIzinBtn').style.display = 'flex';
    document.getElementById('iaMenuMintaAksesBtn').style.display = 'flex';
    document.getElementById('iaMenuExitLabel').textContent = 'Keluar';
    iaSetTanggal_(iaToday_());
    window.iaLoadBell_();
    window.iaShowDashboardView_();
  };

  /* Admin PPG: bebas pilih Kelompok > Kelas mana pun (dipanggil dari sidebar). */
  window.openInputAbsenAsAdmin_ = function () {
    window.iaState_ = { mode: 'admin', kelompokId: null, kelas: null, list: [], activeView: 'kelas' };
    document.getElementById('appLayout').style.display = 'none';
    document.getElementById('screenInputAbsen').style.display = 'flex';

    document.getElementById('iaNamaGuru').textContent = 'Admin PPG';
    document.getElementById('iaBellBtn').style.display = 'none';
    document.getElementById('iaMenuDashboardBtn').style.display = 'none';
    document.getElementById('iaMenuGuruIzinBtn').style.display = 'none';
    document.getElementById('iaMenuMintaAksesBtn').style.display = 'none';
    document.getElementById('iaMenuExitLabel').textContent = 'Kembali ke Dashboard';

    iaSetTanggal_(iaToday_());
    document.getElementById('iaEmptyState').style.display = 'flex';
    document.getElementById('iaEmptyState').lastElementChild.textContent = 'Pilih Kelompok & kelas di atas untuk mulai input absen.';
    document.getElementById('iaProgressWrap').style.display = 'none';
    document.getElementById('iaSantriList').innerHTML = '';
    document.getElementById('iaBottomBar').style.display = 'none';
    document.getElementById('iaKelasRow').innerHTML = '';
    window.iaShowKelasView_(true);

    const select = document.getElementById('iaKelompokSelect');
    select.style.display = 'block';
    select.innerHTML = '<option value="">Memuat...</option>';
    google.script.run
      .withSuccessHandler(function (result) {
        select.innerHTML = '<option value="">-- Pilih Kelompok --</option>';
        if (result.success) {
          result.data.forEach(function (k) {
            const opt = document.createElement('option');
            opt.value = k.id;
            opt.textContent = k.nama;
            select.appendChild(opt);
          });
        }
      })
      .serverGetInputAbsenKelompokOptionsAdmin(window.currentToken);
  };

  window.closeInputAbsenAdmin_ = function () {
    document.getElementById('screenInputAbsen').style.display = 'none';
    document.getElementById('appLayout').style.display = 'flex';
  };

  window.iaOnKelompokChange_ = function () {
    window.iaState_.kelompokId = document.getElementById('iaKelompokSelect').value || null;
    window.iaLoadKelasList_();
  };

  /* ─── Menu Utama (hamburger dropdown) ─── */

  window.iaToggleMenu_ = function () {
    const dropdown = document.getElementById('iaMenuDropdown');
    const isOpen = dropdown.style.display === 'flex';
    if (isOpen) { window.iaCloseMenu_(); return; }
    dropdown.style.display = 'flex';
    document.getElementById('iaMenuOverlay').style.display = 'block';
  };

  window.iaCloseMenu_ = function () {
    document.getElementById('iaMenuDropdown').style.display = 'none';
    document.getElementById('iaMenuOverlay').style.display = 'none';
  };

  window.iaMenuGoDashboard_ = function () {
    window.iaCloseMenu_();
    window.iaShowDashboardView_();
  };

  window.iaMenuGoPilihKelas_ = function () {
    window.iaCloseMenu_();
    window.iaShowKelasView_();
  };

  window.iaMenuOpenGuruIzin_ = function () {
    window.iaCloseMenu_();
    window.iaOpenGuruIzin_();
  };

  window.iaMenuOpenMintaAkses_ = function () {
    window.iaCloseMenu_();
    window.openModalMintaAkses_();
  };

  window.iaMenuExit_ = function () {
    window.iaCloseMenu_();
    if (window.iaState_.mode === 'admin') {
      window.closeInputAbsenAdmin_();
    } else {
      window.handleLogout();
    }
  };

  /* ─── Switch view: Dashboard (ringkasan kehadiran) vs Pilih Kelas (input absen) ───
     Pindah antar view TIDAK selalu perlu round-trip server baru: DOM kartu/chip
     dari load sebelumnya TIDAK dibersihkan saat view disembunyikan (cuma
     display:none), jadi kalau datanya masih relevan (tanggal/filter sama,
     belum ada perubahan yang butuh refresh), tinggal tampilkan lagi yang
     sudah ada — instan, tanpa `google.script.run`. Kunci cache diperbarui
     oleh iaLoadDashboardSummary_/iaLoadKelasList_ tiap kali berhasil memuat,
     dan diputus (null) tiap kali datanya bisa jadi basi (simpan absen, ganti
     filter). Lihat ERROR_LOG.md #21. */

  function iaDashboardCacheKey_() {
    const filter = window.iaState_.dashboardFilter;
    return filter ? ('range:' + filter.mulai + ':' + filter.selesai) : ('day:' + document.getElementById('iaTanggal').value);
  }

  function iaKelasCacheKey_() {
    const tanggal = document.getElementById('iaTanggal').value;
    const kelompokId = window.iaState_.mode === 'admin' ? window.iaState_.kelompokId : '';
    return tanggal + '|' + kelompokId;
  }

  window.iaShowDashboardView_ = function () {
    window.iaState_.activeView = 'dashboard';
    document.getElementById('iaDashboardView').style.display = 'block';
    document.getElementById('iaKelasView').style.display = 'none';
    document.getElementById('iaGreetingKelasInfo').style.display = 'none';
    if (window.iaState_.dashboardLoadedKey === iaDashboardCacheKey_()) return;
    window.iaLoadDashboardSummary_();
  };

  window.iaShowKelasView_ = function (skipLoad) {
    window.iaState_.activeView = 'kelas';
    document.getElementById('iaDashboardView').style.display = 'none';
    document.getElementById('iaKelasView').style.display = 'flex';
    if (skipLoad) return;
    if (window.iaState_.kelasLoadedKey === iaKelasCacheKey_()) return;
    window.iaLoadKelasList_();
  };

  /* ─── Dashboard: ringkasan kehadiran semua kelas milik guru ─── */

  window.iaLoadDashboardSummary_ = function () {
    const wrap = document.getElementById('iaDashboardCards');
    const key = iaDashboardCacheKey_();
    window.showGlobalLoading_('Memuat ringkasan...');

    const onResult = function (result) {
      window.hideGlobalLoading_();
      if (!result.success) {
        wrap.innerHTML = '<div class="ia-dash-empty">' + result.error + '</div>';
        return;
      }
      window.iaState_.dashboardLoadedKey = key;
      window.iaRenderDashboardCards_(result.data);

    const onFail = function (err) {
      window.hideGlobalLoading_();
      wrap.innerHTML = '<div class="ia-dash-empty">Gagal memuat ringkasan: ' + (err && err.message ? err.message : err) + '</div>';
    };

    const filter = window.iaState_.dashboardFilter;
    if (filter) {
      google.script.run.withSuccessHandler(onResult).withFailureHandler(onFail)
        .serverGetGuruDashboardSummaryRange(window.currentToken, filter.mulai, filter.selesai);
    } else {
      const tanggal = document.getElementById('iaTanggal').value;
      google.script.run.withSuccessHandler(onResult).withFailureHandler(onFail)
        .serverGetGuruDashboardSummary(window.currentToken, tanggal);

  /* ─── Filter rentang tanggal Dashboard ─── */

  window.iaToggleFilterPanel_ = function () {
    const panel = document.getElementById('iaFilterPanel');
    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
  };

  window.iaResetFilter_ = function () {
    window.iaState_.dashboardFilter = null;
    document.getElementById('iaFilterMulai').value = '';
    document.getElementById('iaFilterMulaiDisplay').value = '';
    document.getElementById('iaFilterSelesai').value = '';
    document.getElementById('iaFilterSelesaiDisplay').value = '';
    document.getElementById('iaFilterPanel').style.display = 'none';
    document.getElementById('iaFilterBtn').classList.remove('active');
    document.getElementById('iaFilterBtnLabel').textContent = 'Filter';
    window.iaLoadDashboardSummary_();
  };

  window.iaApplyFilter_ = function () {
    const mulai = document.getElementById('iaFilterMulai').value;
    const selesai = document.getElementById('iaFilterSelesai').value;
    if (!mulai || !selesai) {
      iaShowToast_('Pilih tanggal mulai dan selesai.', 'error');
      return;
    }
    if (selesai < mulai) {
      iaShowToast_('Tanggal selesai tidak boleh sebelum tanggal mulai.', 'error');
      return;
    }
    window.iaState_.dashboardFilter = { mulai: mulai, selesai: selesai };
    document.getElementById('iaFilterPanel').style.display = 'none';
    document.getElementById('iaFilterBtn').classList.add('active');
    document.getElementById('iaFilterBtnLabel').textContent = iaFormatFilterRangeShort_(mulai, selesai);
    window.iaLoadDashboardSummary_();
  };

  function iaFormatFilterRangeShort_(mulai, selesai) {
    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const d1 = new Date(mulai + 'T00:00:00');
    const d2 = new Date(selesai + 'T00:00:00');
    return d1.getDate() + ' ' + monthNames[d1.getMonth()] + '–' + d2.getDate() + ' ' + monthNames[d2.getMonth()];
  }

  window.iaRenderDashboardCards_ = function (list) {
    const wrap = document.getElementById('iaDashboardCards');
    if (!list || list.length === 0) {
      wrap.innerHTML = '<div class="ia-dash-empty">Anda belum mengampu kelas apa pun.</div>';
      return;
    }
    wrap.innerHTML = list.map(function (item) {
      const infoParts = [];
      if (item.ruangan) infoParts.push(item.ruangan);
      infoParts.push(item.total + ' Santri');
      if (item.jamMulai && item.jamSelesai) {
        const durasi = window.iaDurasiMenit_(item.jamMulai, item.jamSelesai);
        infoParts.push(item.jamMulai + '–' + item.jamSelesai + (durasi != null ? ' · Durasi ' + durasi + ' Menit' : ''));
      }
      const jenjangLabel = item.kategori === 'Cabe Rawit' ? ' <span class="ia-dash-card-jenjang">· Cabe Rawit</span>' : '';
      return `
        <div class="ia-dash-card">
          <div class="ia-dash-card-head">
            <span class="ia-dash-card-kelas">Kelas ${item.kelas}${jenjangLabel}</span>
          </div>
          <div class="ia-dash-card-info">${infoParts.join(' · ')}</div>
          <div class="ia-dash-stat-row">
            <div class="ia-dash-stat hadir">
              <span class="ia-dash-stat-num">${item.hadir}</span>
              <span class="ia-dash-stat-label">Hadir</span>
            </div>
            <div class="ia-dash-stat izin">
              <span class="ia-dash-stat-num">${item.izin}</span>
              <span class="ia-dash-stat-label">Izin</span>
            </div>
            <div class="ia-dash-stat sakit">
              <span class="ia-dash-stat-num">${item.sakit}</span>
              <span class="ia-dash-stat-label">Sakit</span>
            </div>
            <div class="ia-dash-stat alpa">
              <span class="ia-dash-stat-num">${item.alpa}</span>
              <span class="ia-dash-stat-label">Alpa</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  };

  window.iaLoadBell_ = function () {

        const badge = document.getElementById('iaBellBadge');

  window.iaOnTanggalChange_ = function () {
    if (window.iaState_.activeView === 'dashboard') {
      window.iaLoadDashboardSummary_();
      return;
    }
    window.iaLoadKelasList_();

  window.iaLoadKelasList_ = function () {
    window.iaState_.kelas = null;
    document.getElementById('iaEmptyState').style.display = 'flex';
    document.getElementById('iaGreetingKelasInfo').style.display = 'none';
    document.getElementById('iaProgressWrap').style.display = 'none';
    document.getElementById('iaSantriList').innerHTML = '';
    document.getElementById('iaBottomBar').style.display = 'none';

    const isAdmin = window.iaState_.mode === 'admin';
    if (isAdmin && !window.iaState_.kelompokId) {
      document.getElementById('iaKelasRow').innerHTML = '';
      return;
    }

    const tanggal = document.getElementById('iaTanggal').value;
    const row = document.getElementById('iaKelasRow');
    const keepKelas = window.iaState_.kelas;
    const key = iaKelasCacheKey_();
    row.innerHTML = '';
    window.showGlobalLoading_('Memuat kelas...');

    const onKelasResult = function (result) {
      window.hideGlobalLoading_();
      row.innerHTML = '';
      if (!result.success) {
        row.innerHTML = '<div style="padding:8px; color:var(--red); font-size:13px;">' + result.error + '</div>';
        return;
      }
      window.iaState_.kelasLoadedKey = key;
      window.iaState_.kelasMeta = {};
      const chipEls = [];
      result.data.forEach(function (item) {
        window.iaState_.kelasMeta[item.kelas.toLowerCase()] = item;

        const chip = document.createElement('div');
        chip.className = 'ia-kelas-chip' + (item.isOwn === false ? ' pinjam' : '');
        const jenjangHtml = item.kategori === 'Cabe Rawit' ? '<span class="ia-kelas-chip-jenjang">· Cabe Rawit</span>' : '';
        chip.innerHTML = `
          <span class="ia-kelas-chip-nama">${item.kelas}</span>
          ${jenjangHtml}
          <span class="ia-kelas-chip-count">${item.santriCount}</span>
        `;
        chip.onclick = function () { window.iaSelectKelas_(item.kelas, chip); };
        row.appendChild(chip);
        chipEls.push(chip);
      });

      // ⚠️ Chip "+ Minta Akses" sengaja disembunyikan sementara (noted by user
      // 2026-07-26) — fungsi backend/modal-nya TETAP ADA, tinggal tampilkan
      // lagi block ini kalau diminta diaktifkan kembali.

      // Auto-masuk ke kelas: guru langsung diarahkan ke kelasnya sendiri
      // (kelas terakhir dipilih tetap dipertahankan lintas ganti tanggal;
      // kalau sudah tidak tersedia lagi, jatuh ke kelas pertama). Server
      // SUDAH menyiapkan form santri kelas ini sekalian (formKelas/formData)
      // supaya tidak perlu round-trip google.script.run KEDUA — dulu ini
      // yang bikin "Pilih Kelas" berasa lambat (lihat ERROR_LOG.md #19).
      if (result.data.length > 0) {
        let idx = keepKelas ? result.data.findIndex(function (it) { return it.kelas.toLowerCase() === keepKelas.toLowerCase(); }) : -1;
        if (idx < 0) idx = 0;
        const chosenKelas = result.data[idx].kelas;
        const chosenChip = chipEls[idx];

        if (result.formKelas && result.formData && result.formKelas.toLowerCase() === chosenKelas.toLowerCase()) {
          chosenChip.classList.add('active');
          window.iaState_.kelas = chosenKelas;
          window.iaRenderKelasInfoCard_(chosenKelas);
          document.getElementById('iaEmptyState').style.display = 'none';
          window.iaState_.list = result.formData;
          window.iaRenderSantriList_();
        } else {
          window.iaSelectKelas_(chosenKelas, chosenChip);
        }
      }
    };

    const onKelasFail = function (err) {
      window.hideGlobalLoading_();
      row.innerHTML = '<div style="padding:8px; color:var(--red); font-size:13px;">Gagal memuat kelas: ' + (err && err.message ? err.message : err) + '</div>';
    };

    if (isAdmin) {
      google.script.run.withSuccessHandler(onKelasResult).withFailureHandler(onKelasFail).serverGetKelasAbsenListAdmin(window.currentToken, window.iaState_.kelompokId, tanggal, keepKelas);
    } else {
      google.script.run.withSuccessHandler(onKelasResult).withFailureHandler(onKelasFail).serverGetKelasAbsenList(window.currentToken, tanggal, keepKelas);
    }
  };

  window.iaRenderKelasInfoCard_ = function (kelas) {
    const meta = (window.iaState_.kelasMeta || {})[kelas.toLowerCase()];
    const el = document.getElementById('iaGreetingKelasInfo');
    if (!meta) { el.style.display = 'none'; return; }

    const parts = ['Kelas ' + meta.kelas];
    if (meta.ruangan) parts.push(meta.ruangan);
    parts.push((meta.santriCount || 0) + ' Santri');
    if (meta.jamMulai && meta.jamSelesai) parts.push(meta.jamMulai + '–' + meta.jamSelesai);
    if (window.iaState_.mode === 'admin' && meta.namaGuru) parts.push('Kak ' + meta.namaGuru);

    el.textContent = parts.join(' · ');
    el.style.display = 'block';
  };

  window.iaSelectKelas_ = function (kelas, chipEl) {
    document.querySelectorAll('.ia-kelas-chip').forEach(function (c) { c.classList.remove('active'); });
    if (chipEl) chipEl.classList.add('active');
    window.iaState_.kelas = kelas;
    window.iaRenderKelasInfoCard_(kelas);

    const tanggal = document.getElementById('iaTanggal').value;
    document.getElementById('iaEmptyState').style.display = 'none';
    document.getElementById('iaSantriList').innerHTML = '';
    window.showGlobalLoading_('Memuat santri...');

    const onFormResult = function (result) {
      window.hideGlobalLoading_();
      if (!result.success) {
        iaShowToast_(result.error, 'error');
        document.getElementById('iaSantriList').innerHTML = '';
        document.getElementById('iaEmptyState').style.display = 'flex';
        return;
      }
      window.iaState_.list = result.data;
      window.iaRenderSantriList_();
    };

    const onFormFail = function (err) {
      window.hideGlobalLoading_();
      iaShowToast_('Gagal memuat santri: ' + (err && err.message ? err.message : err), 'error');
      document.getElementById('iaSantriList').innerHTML = '';
      document.getElementById('iaEmptyState').style.display = 'flex';
    };

    if (window.iaState_.mode === 'admin') {
      google.script.run.withSuccessHandler(onFormResult).withFailureHandler(onFormFail).serverGetAbsensiKelasFormAdmin(window.currentToken, window.iaState_.kelompokId, kelas, tanggal);
    } else {
      google.script.run.withSuccessHandler(onFormResult).withFailureHandler(onFormFail).serverGetAbsensiKelasForm(window.currentToken, kelas, tanggal);
    }
  };

  window.iaRenderSantriList_ = function () {
    const list = window.iaState_.list;
    const wrap = document.getElementById('iaSantriList');
    wrap.innerHTML = '';

    if (list.length === 0) {
      wrap.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-faint); font-size:13px;">Belum ada santri di kelas ini.</div>';
      document.getElementById('iaProgressWrap').style.display = 'none';
      document.getElementById('iaBottomBar').style.display = 'none';
      return;
    }

    list.forEach(function (s, idx) {
      const card = document.createElement('div');
      card.className = 'ia-santri-card';
      card.style.animationDelay = (idx * 0.03) + 's';
      card.innerHTML = `
        <div class="ia-avatar">${iaInitials_(s.nama)}</div>
        <div class="ia-santri-nama">${s.nama}</div>
        <div class="ia-status-toggle" data-santri="${s.santri_id}">
          <button class="ia-status-btn${s.status === 'hadir' ? ' active' : ''}" data-status="hadir" onclick="window.iaSetStatus_(${s.santri_id}, 'hadir', this)">Hadir</button>
          <button class="ia-status-btn${s.status === 'izin' ? ' active' : ''}" data-status="izin" onclick="window.iaSetStatus_(${s.santri_id}, 'izin', this)">Izin</button>
          <button class="ia-status-btn${s.status === 'sakit' ? ' active' : ''}" data-status="sakit" onclick="window.iaSetStatus_(${s.santri_id}, 'sakit', this)">Sakit</button>
          <button class="ia-status-btn${s.status === 'alpa' ? ' active' : ''}" data-status="alpa" onclick="window.iaSetStatus_(${s.santri_id}, 'alpa', this)">Alpa</button>
        </div>
      `;
      wrap.appendChild(card);
    });

    document.getElementById('iaProgressWrap').style.display = 'block';
    document.getElementById('iaBottomBar').style.display = 'block';
    window.iaUpdateProgress_();
  };

  window.iaSetStatus_ = function (santriId, status, btnEl) {
    const item = window.iaState_.list.find(function (s) { return s.santri_id === santriId; });
    if (item) item.status = status;

    const toggle = btnEl.closest('.ia-status-toggle');
    toggle.querySelectorAll('.ia-status-btn').forEach(function (b) { b.classList.remove('active'); });
    btnEl.classList.add('active');
    window.iaUpdateProgress_();
  };

  window.iaUpdateProgress_ = function () {
    const list = window.iaState_.list;
    const hadir = list.filter(function (s) { return s.status === 'hadir'; }).length;
    document.getElementById('iaProgressLabel').textContent = hadir + '/' + list.length + ' Hadir';
    document.getElementById('iaProgressFill').style.width = (list.length ? (hadir / list.length * 100) : 0) + '%';
  };

  window.saveInputAbsen_ = function () {
    const kelas = window.iaState_.kelas;
    const tanggal = document.getElementById('iaTanggal').value;
    const btn = document.getElementById('iaSaveBtn');
    btn.disabled = true;
    btn.textContent = 'Menyimpan...';

    const absensiList = window.iaState_.list.map(function (s) { return { santri_id: s.santri_id, status: s.status }; });

    const onSaveResult = function (result) {
      btn.disabled = false;
      btn.textContent = 'Simpan Absen';
      if (result.success) {
        iaShowToast_('✓ ' + result.message, 'success');
        // Ringkasan Dashboard (hadir/izin/sakit/alpa) sekarang basi karena
        // absen baru saja disimpan — paksa reload sekali berikutnya kali
        // Dashboard dibuka, jangan pakai cache lama (lihat ERROR_LOG.md #21).
        window.iaState_.dashboardLoadedKey = null;
      } else {
        iaShowToast_(result.error, 'error');
      }
    };
    const onSaveFailure = function () {
      btn.disabled = false;
      btn.textContent = 'Simpan Absen';
      iaShowToast_('Gagal menyimpan. Coba lagi.', 'error');
    };

    if (window.iaState_.mode === 'admin') {
      google.script.run
        .withSuccessHandler(onSaveResult)
        .withFailureHandler(onSaveFailure)
        .serverSaveAbsensiKelasAdmin(window.currentToken, window.iaState_.kelompokId, kelas, tanggal, absensiList);
    } else {
      google.script.run
        .withSuccessHandler(onSaveResult)
        .withFailureHandler(onSaveFailure)
        .serverSaveAbsensiKelas(window.currentToken, kelas, tanggal, absensiList);
    }
  };

  function iaSetIzinTanggal_(inputId, dateStr) {
    const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const d = new Date(dateStr + 'T00:00:00');
    document.getElementById(inputId).value = dateStr;
    document.getElementById(inputId + 'Display').value = `${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()}`;
    if (window.ppgDatePickerState) delete window.ppgDatePickerState[inputId];

  window.iaSubmitGuruIzin_ = function () {
    const msg = document.getElementById('iaIzinMsg');
    const tanggalMulai = document.getElementById('iaIzinTanggalMulai').value;
    const tanggalSelesai = document.getElementById('iaIzinTanggalSelesai').value || tanggalMulai;
    const alasanDetail = document.getElementById('iaIzinAlasanDetail').value.trim();

    if (!tanggalMulai) {
      msg.style.display = 'block';
      msg.style.color = 'var(--red)';
      msg.textContent = 'Pilih tanggal mulai izin.';
      return;
    }
    if (window.iaIzinState_.alasan === 'lainnya' && !alasanDetail) {
      msg.style.display = 'block';
      msg.style.color = 'var(--red)';
      msg.textContent = 'Ketik alasan izin Anda.';
      return;
    }

    const payload = {
      jenis: window.iaIzinState_.jenis,
      tanggalMulai: tanggalMulai,
      tanggalSelesai: tanggalSelesai,
      alasanKategori: window.iaIzinState_.alasan,
      alasanDetail: alasanDetail,
    };

    const btn = document.getElementById('iaIzinSubmitBtn');
    btn.disabled = true;
    btn.textContent = 'Mengirim...';

    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.textContent = 'Kirim Izin';
        msg.style.display = 'block';
        msg.style.color = result.success ? 'var(--sage)' : 'var(--red)';
        msg.textContent = result.success ? result.message : result.error;
        if (result.success) {
          setTimeout(window.closeModalGuruIzin_, 1200);
        }
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = 'Kirim Izin';
        msg.style.display = 'block';
        msg.style.color = 'var(--red)';
        msg.textContent = 'Gagal terhubung ke server: ' + (err && err.message ? err.message : err);
      })
      .serverSubmitGuruIzin(window.currentToken, payload);

        if (!result.success) {
          list.innerHTML = '<div style="padding:16px; color:var(--red); font-size:13px;">' + result.error + '</div>';
          return;
        }
        if (result.data.length === 0) {
          list.innerHTML = '<div style="padding:16px; text-align:center; color:var(--text-faint); font-size:13px;">Tidak ada permintaan.</div>';
          return;
        }
        list.innerHTML = '';
        result.data.forEach(function (r) {
          const item = document.createElement('div');
          item.className = 'ia-incoming-item';
          item.innerHTML = `
            <div class="ia-incoming-item-title">${r.requester_nama} minta akses kelas "${r.kelas}"</div>
            <div class="ia-incoming-item-meta">Tanggal: ${r.tanggal}${r.keterangan ? ' — ' + r.keterangan : ''}</div>
            <div class="ia-incoming-item-actions">
              <button class="btn btn-secondary" onclick="window.respondAksesRequest_(${r.id}, 'rejected', this)">Tolak</button>
              <button class="btn btn-primary" onclick="window.respondAksesRequest_(${r.id}, 'approved', this)">Setujui</button>
            </div>
          `;
          list.appendChild(item);
        });
      })

          item.style.pointerEvents = 'auto';
        }

      .serverRespondAksesRequest(window.currentToken, requestId, decision);

  /**
   * Bangun tree Desa > Kelompok dari sheet (bukan hardcode).
   * Kelompok non-aktif tetap ditampilkan tapi disabled ("Segera hadir").
   */
  window.renderSidebarTree_ = function () {
    const root = document.getElementById('desaSubmenu');
    if (!root) return;

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success || !res.data || !res.data.length) return;
        root.innerHTML = '';

        res.data.forEach(function (desa) {
          const li = document.createElement('li');
          li.className = 'sidebar-tree-item';

          const link = document.createElement('a');
          const label = document.createElement('span');
          label.textContent = 'Ds ' + desa.nama;
          link.appendChild(label);

          if (!desa.adaAktif) {
            link.className = 'sidebar-tree-link disabled';
            link.title = 'Segera hadir';
            li.appendChild(link);
            root.appendChild(li);
            return;
          }

          link.className = 'sidebar-tree-link';
          const caret = document.createElement('span');
          caret.className = 'sidebar-caret';
          caret.id = 'caretDesa' + desa.id;
          caret.textContent = '▸';
          link.appendChild(caret);
          link.addEventListener('click', function (ev) {
            window.toggleKelompokMenu(ev, desa.id);
          });
          li.appendChild(link);

          const sub = document.createElement('ul');
          sub.className = 'sidebar-tree sidebar-tree-2';
          sub.id = 'kelompokSubmenu' + desa.id;

          desa.kelompok.forEach(function (kel) {
            const kLi = document.createElement('li');
            const kLink = document.createElement('a');
            kLink.dataset.kelompokId = kel.id;
            const kLabel = document.createElement('span');
            kLabel.textContent = kel.nama;
            kLink.appendChild(kLabel);

            const isPilotSubmenu = kel.aktif && String(kel.id) === '1';

            if (kel.aktif) {
              kLink.className = 'sidebar-tree-link-2';
              if (isPilotSubmenu) {
                const kCaret = document.createElement('span');
                kCaret.className = 'sidebar-caret';
                kCaret.id = 'kelpSidebarCaret' + kel.id;
                kCaret.textContent = '▸';
                kLink.appendChild(kCaret);
              }
              kLink.addEventListener('click', function (ev) {
                window.selectKelompok(ev, kel.id, kel.nama);
              });
            } else {
              kLink.className = 'sidebar-tree-link-2 disabled';
              kLink.title = 'Segera hadir';
            }
            kLi.appendChild(kLink);

            if (isPilotSubmenu) {
              const sectionSub = document.createElement('ul');
              sectionSub.className = 'sidebar-tree sidebar-tree-3';
              sectionSub.id = 'kelpSidebarSubmenu' + kel.id;

              window.KELP_SIDEBAR_SECTIONS_.forEach(function (sec) {
                const sLi = document.createElement('li');
                const sLink = document.createElement('a');
                sLink.className = 'sidebar-tree-link-3';
                sLink.innerHTML = '<svg class="sidebar-icon-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + sec.icon + '</svg><span>' + sec.label + '</span>';
                sLink.addEventListener('click', function (ev) {
                  window.selectKelpSidebarSection_(ev, kel.id, kel.nama, sec.name);
                });
                sLi.appendChild(sLink);
                sectionSub.appendChild(sLi);
              });

              kLi.appendChild(sectionSub);
            }

            sub.appendChild(kLi);
          });

          li.appendChild(sub);
          root.appendChild(li);
        });
      })
      .withFailureHandler(function () { /* gagal ambil tree — sidebar Desa tetap kosong, tidak fatal */ })

  window.setDataMasterFocus_ = function (focus) {
    Object.keys(window.DATA_MASTER_SECTIONS_).forEach(function (name) {
      const sec = window.DATA_MASTER_SECTIONS_[name];
      const isThis = name === focus;
      const isOtherFocused = focus !== null && !isThis;

      // ⚠️ Title punya inline style "display: flex" bawaan (judul+tombol
      // sejajar) — WAJIB dikembalikan ke 'flex' persis, BUKAN '' (string
      // kosong menghapus flex-nya permanen — lihat ERROR_LOG.md #9).
      const titleEl = document.getElementById(sec.title);
      if (titleEl) titleEl.style.display = isOtherFocused ? 'none' : 'flex';

      sec.kpis.forEach(function (kpiId) {
        const el = document.getElementById(kpiId);
        if (el) el.style.display = isOtherFocused ? 'none' : '';
      });

      if (isOtherFocused) {
        const wrapEl = document.getElementById(sec.wrap);
        const btnEl = document.getElementById(sec.btn);
        if (wrapEl) wrapEl.style.display = 'none';
        if (btnEl) btnEl.classList.remove('active-state');
      }
    });

    // Saat salah satu tabel difokuskan (bisa sampai 10 baris), panel butuh
    // scroll lagi — lihat override overflow-y di Style_Main.html.
    const panel = document.getElementById('kelpPanelDataMaster');
    if (panel) panel.classList.toggle('focused', focus !== null);
  };

  window.renderSiklusGenerusDashTable_ = function (data, scope, search) {
    const q = (search || '').trim().toLowerCase();
    const list = (data || []).filter(function (s) {
      if (scope && scope !== 'all' && s.jenis_siklus !== scope) return false;
      if (q && !String(s.nama || '').toLowerCase().includes(q)) return false;
      return true;
    });

    const tbody = document.getElementById('siklusGenerusTableBody');
    tbody.innerHTML = list.length === 0
      ? '<tr><td colspan="8" style="text-align: center; padding: 40px; color: var(--text-faint);">Belum ada catatan siklus.</td></tr>'
      : list.map(function (s, i) {
        return '<tr>'
          + '<td>' + (i + 1) + '</td>'
          + '<td>' + s.nama + '</td>'
          + '<td>' + s.jenis_siklus + '</td>'
          + '<td>' + (window.formatTanggalDisplay_(s.tanggal) || '-') + '</td>'
          + '<td>' + (s.lokasi || '-') + '</td>'
          + '<td>' + (s.instansi || '-') + '</td>'
          + '<td>' + (s.keterangan || '-') + '</td>'
          + '<td style="text-align: center;">'
          + '<div class="jadwal-row-actions" style="justify-content: center;">'
          + '<button class="jadwal-row-icon-btn" title="Edit" onclick="window.editSiklusGenerus(\'' + s.id + '\')">' + window.JADWAL_ICONS_.edit + '</button>'
          + '<button class="jadwal-row-icon-btn" title="Hapus" onclick="window.deleteSiklusGenerus(\'' + s.id + '\')">' + window.JADWAL_ICONS_.delete + '</button>'
          + '</div></td></tr>';
      }).join('');
  };

  window.saveSiklusGenerus = function () {
    const santriId = document.getElementById('siklusGenerusSantriId').value;
    const jenis = document.getElementById('siklusGenerusJenis').value;
    const tanggal = document.getElementById('siklusGenerusTanggal').value;

    if (!santriId) {
      alert('Pilih generus yang sudah ada di Data Master (ketik nama, lalu pilih dari daftar saran).');
      return;
    }
    if (!jenis || !tanggal) {
      alert('Jenis siklus dan tanggal wajib diisi.');
      return;
    }

    const data = {
      kelompok_id: window.currentKelompokId,
      santri_id: santriId,
      jenis_siklus: jenis,
      tanggal: tanggal,
      lokasi: document.getElementById('siklusGenerusLokasi').value.trim(),
      instansi: document.getElementById('siklusGenerusInstansi').value.trim(),
      keterangan: document.getElementById('siklusGenerusKeterangan').value.trim(),
    };

    const editId = window.currentEditSiklusGenerusId_;
    window.showGlobalLoading_('Menyimpan data...');
    const onDone = function (result) {
      window.hideGlobalLoading_();
      if (!result.success) { alert(result.error); return; }
      window.closeModalSiklusGenerus();
      const list = window.lastSiklusGenerusListData || (window.lastSiklusGenerusListData = []);
      const rec = Object.assign({ nama: result.nama }, data, { id: editId || result.id });
      const idx = list.findIndex(function (x) { return String(x.id) === String(rec.id); });
      if (idx >= 0) list[idx] = rec; else list.unshift(rec);
      window.renderSiklusGenerusKpis_(list);
      const wrapper = document.getElementById('siklusGenerusTableWrapper');
      if (wrapper && wrapper.style.display !== 'none') {
        window.renderSiklusGenerusDashTable_(list, document.getElementById('siklusGenerusScopeSelect').value, document.getElementById('siklusGenerusSearchInput').value);
      }
    };
    const onFail = function (err) {
      window.hideGlobalLoading_();
      alert('Gagal terhubung ke server: ' + (err && err.message ? err.message : err));
    };

    if (editId) {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).serverUpdateSiklusGenerus(window.currentToken, editId, data);
    } else {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).serverCreateSiklusGenerus(window.currentToken, data);
    }
  };

      .withSuccessHandler(function (result) {

  window.confirmEksporSiklusGenerus = function () {
    const format = document.querySelector('input[name="eksporSiklusGenerusFormat"]:checked').value;
    const scope = document.querySelector('input[name="eksporSiklusGenerusScope"]:checked').value;
    const list = (window.lastSiklusGenerusListData || []).filter(function (s) { return scope === 'all' || s.jenis_siklus === scope; });

    const headers = ['No', 'Nama Generus', 'Jenis Siklus', 'Tanggal', 'Lokasi', 'Instansi', 'Keterangan'];
    const rows = list.map(function (s, i) {
      return [i + 1, s.nama, s.jenis_siklus, window.formatTanggalDisplay_(s.tanggal) || '-', s.lokasi || '-', s.instansi || '-', s.keterangan || '-'];
    });

    if (format === 'pdf') {
      window.printPdfList_('Data Siklus Generus', headers, rows);
      window.closeModalEksporSiklusGenerus();

  window.savePengurus = function () {
    const jabatan = document.getElementById('pengurusJabatan').value;
    const nama = document.getElementById('pengurusNama').value.trim();
    const mulaiDapukan = document.getElementById('pengurusMulaiDapukan').value;
    const keterangan = document.getElementById('pengurusKeterangan').value.trim();

    if (!nama) {
      alert('Nama pengurus wajib diisi.');
      return;
    }

    const data = { id: window.currentEditPengurusId_ || null, kelompok_id: window.currentKelompokId, jabatan: jabatan, nama: nama, mulai_dapukan: mulaiDapukan, keterangan: keterangan };

    window.showGlobalLoading_('Menyimpan data...');
    google.script.run
      .withSuccessHandler(function (result) {
        window.hideGlobalLoading_();
        if (!result.success) { alert(result.error); return; }
        window.closeModalPengurus();
        const list = window.lastPengurusListData || (window.lastPengurusListData = []);
        // Cocokkan by id hasil server (BUKAN by jabatan) — dapukan multi-holder
        // (Wk Pembina Generus Kelp) bisa punya banyak baris jabatan yang sama.
        const idx = list.findIndex(function (x) { return String(x.id) === String(result.id); });
        const rec = Object.assign({}, data, { id: result.id });
        if (idx >= 0) list[idx] = rec; else list.push(rec);
        window.renderPengurusKpis_(list);
        const wrapper = document.getElementById('pengurusTableWrapper');
        if (wrapper && wrapper.style.display !== 'none') {
          window.renderPengurusDashTable_(list, document.getElementById('pengurusSearchInput').value);
        }
      })
      .withFailureHandler(function (err) {
        window.hideGlobalLoading_();
        alert('Gagal terhubung ke server: ' + (err && err.message ? err.message : err));
      })
      .serverSavePengurus(window.currentToken, data);

  /** Bangun HTML bagan "Struktur Pengurus Generus Kelp":
      Pembina Generus → Wk Pembina Generus (1-4 kotak sejajar, dapukan
      multi-holder) → PJP Kelp → Kepsek / Pembina Pra Remaja / Pembina Remaja
      (→ Ketua Muda-Mudi di bawahnya) / Sekretaris / Bendahara. */
  /** Bangun HTML isi ".struktur-chart" saja (dipakai baik utk tampilan layar
      yg diskalakan, maupun utk dokumen cetak PDF apa adanya/tanpa skala). */
  window.buildStrukturPengurusChartHtml_ = function () {
    const data = window.lastPengurusListData || [];
    const namaSingle = function (jabatan) {
      const rec = data.find(function (p) { return p.jabatan === jabatan; });
      return rec ? rec.nama : '';
    };

    const wkPembina = data.filter(function (p) { return p.jabatan === 'Wk Pembina Generus Kelp'; });
    const wkPembinaNama = wkPembina.length ? wkPembina.map(function (p) { return p.nama; }) : [''];
    const wkPembinaCols = wkPembinaNama
      .map(function (nama) { return window.strukturColHtml_(window.strukturNodeHtml_('Wk Pembina Generus', nama)); })
      .join('');

    const pembinaRemajaCol = window.strukturColHtml_(
      window.strukturNodeHtml_('Pembina Remaja', namaSingle('Pembina Remaja'))
      + '<div class="struktur-connector"></div>'
      + window.strukturNodeHtml_('Ketua Muda-Mudi', namaSingle('Ketua Muda-Mudi'))
    );

    const pjpChildrenCols = [
      window.strukturColHtml_(window.strukturNodeHtml_('Kepsek', namaSingle('Kepsek'))),
      window.strukturColHtml_(window.strukturNodeHtml_('Pembina Pra Remaja', namaSingle('Pembina Pra Remaja'))),
      pembinaRemajaCol,
      window.strukturColHtml_(window.strukturNodeHtml_('Sekretaris', namaSingle('Sekertaris Generus'))),
      window.strukturColHtml_(window.strukturNodeHtml_('Bendahara', namaSingle('Bendahara'))),
    ].join('');

    return '<div class="struktur-chart">'

  /** Gambar garis horizontal tiap ".struktur-branch-row" berdasarkan posisi
      NYATA (getBoundingClientRect) kolom pertama & terakhirnya — bukan
      nebak dari asumsi lebar kotak tetap (itu penyebab garis pernah berhenti
      di tengah jalan, tidak nyampe kotak paling kanan). Dipanggil SETELAH
      HTML disisipkan ke DOM, SEBELUM transform:scale diterapkan (supaya
      koordinat yg diukur murni, tidak perlu dibagi skala). */
  window.drawStrukturBranchLines_ = function (root) {
    const rows = root.querySelectorAll('.struktur-branch-row');
    rows.forEach(function (row) {
      row.querySelectorAll('.struktur-branch-line').forEach(function (el) { el.remove(); });

      const cols = Array.prototype.filter.call(row.children, function (el) { return el.classList.contains('struktur-col'); });
      if (cols.length < 2) return;

      const rowRect = row.getBoundingClientRect();
      const firstRect = cols[0].getBoundingClientRect();
      const lastRect = cols[cols.length - 1].getBoundingClientRect();
      const firstCenter = (firstRect.left + firstRect.right) / 2 - rowRect.left;
      const lastCenter = (lastRect.left + lastRect.right) / 2 - rowRect.left;
      const left = Math.min(firstCenter, lastCenter);
      const width = Math.abs(lastCenter - firstCenter);

      const topLine = document.createElement('div');
      topLine.className = 'struktur-branch-line';
      topLine.style.left = left + 'px';
      topLine.style.width = width + 'px';
      row.appendChild(topLine);
    });
  };

  /** Baris "converge-below" (Wk Pembina Generus) bercabang berupa siku
      (elbow): turun dari kotak Wk Pembina yg ORANGNYA SAMA dgn PJP Kelp
      (dicocokkan via nama, bukan asal kolom pertama — supaya tidak tergantung
      urutan data), belok mendatar, lalu turun lagi tepat di sumbu-tengah
      menuju connector polos yg sudah ada ke PJP Kelp. Kalau cuma 1 kotak,
      tidak ada yg namanya cocok, atau kebetulan sudah segaris tengah,
      otomatis jadi garis lurus biasa tanpa siku. */
  window.drawWkPembinaElbow_ = function (root) {
    const row = root.querySelector('.struktur-branch-row.converge-below');
    if (!row) return;
    row.querySelectorAll('.struktur-elbow-line').forEach(function (el) { el.remove(); });

    const cols = Array.prototype.filter.call(row.children, function (el) { return el.classList.contains('struktur-col'); });
    const connector = row.nextElementSibling;
    if (cols.length === 0 || !connector) return;

    // Kalau salah satu Wk Pembina orangnya SAMA dgn PJP Kelp (kasus nyata:
    // Falikul Asbach), tarik siku dari kolom orang itu SPESIFIK — bukan asal
    // kolom pertama — supaya tidak tergantung urutan data yg kebetulan.
    const pjpNode = connector.nextElementSibling;
    const pjpNameEl = pjpNode && pjpNode.querySelector('.struktur-node-name');
    const pjpNama = pjpNameEl ? pjpNameEl.textContent.trim() : '';
    let sourceCol = cols[0];
    if (pjpNama) {
      const matched = cols.find(function (col) {
        const nameEl = col.querySelector('.struktur-node-name');
        return nameEl && nameEl.textContent.trim() === pjpNama;
      });
      if (matched) sourceCol = matched;
    }

    const rowRect = row.getBoundingClientRect();
    const sourceRect = sourceCol.getBoundingClientRect();
    const sourceX = (sourceRect.left + sourceRect.right) / 2 - rowRect.left;
    const connectorRect = connector.getBoundingClientRect();
    const targetX = (connectorRect.left + connectorRect.right) / 2 - rowRect.left;

    const dropHeight = 26;
    if (cols.length === 1 || Math.abs(sourceX - targetX) < 1) {
      const straight = document.createElement('div');
      straight.className = 'struktur-elbow-line struktur-elbow-vline';
      straight.style.left = (sourceX - 1) + 'px';
      straight.style.top = '0';
      straight.style.height = dropHeight + 'px';
      row.appendChild(straight);
      return;
    }

    const turnY = dropHeight / 2;

    const v1 = document.createElement('div');
    v1.className = 'struktur-elbow-line struktur-elbow-vline';
    v1.style.left = (sourceX - 1) + 'px';
    v1.style.top = '0';
    v1.style.height = turnY + 'px';
    row.appendChild(v1);

    const h = document.createElement('div');
    h.className = 'struktur-elbow-line struktur-elbow-hline';
    h.style.left = Math.min(sourceX, targetX) + 'px';
    h.style.width = Math.abs(targetX - sourceX) + 'px';
    h.style.top = (turnY - 1) + 'px';
    row.appendChild(h);

    const v2 = document.createElement('div');
    v2.className = 'struktur-elbow-line struktur-elbow-vline';
    v2.style.left = (targetX - 1) + 'px';
    v2.style.top = turnY + 'px';
    v2.style.height = (dropHeight - turnY) + 'px';
    row.appendChild(v2);
  };

  /** Skalakan .struktur-chart (via transform: scale) supaya SELALU utuh
      terlihat di dalam .struktur-pengurus-body tanpa scroll kanan-kiri/
      atas-bawah, berapa pun jumlah kotak Wk Pembina-nya. */
  window.fitStrukturPengurusChart_ = function () {
    const wrap = document.getElementById('strukturPengurusBody');
    const chart = wrap && wrap.querySelector('.struktur-chart');
    if (!wrap || !chart) return;

    chart.style.transform = 'translate(-50%, -50%) scale(1)';
    const naturalWidth = chart.scrollWidth;
    const naturalHeight = chart.scrollHeight;
    const availW = wrap.clientWidth - 16;
    const availH = wrap.clientHeight - 16;
    if (naturalWidth <= 0 || naturalHeight <= 0) return;

    const scale = Math.min(1, availW / naturalWidth, availH / naturalHeight);
    chart.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
  };

  window.escapeHtmlExport_ = function (str) {

  window.downloadXlsxFromBase64_ = function (base64, filename) {
    const byteChars = atob(base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', filename);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  window.ppgDatePickerState = {};

  window.toggleDatePicker = function (inputId, triggerElId) {
    const picker = document.getElementById(inputId + 'Picker');
    const willOpen = !picker.classList.contains('open');

    document.querySelectorAll('.ppg-datepicker').forEach(p => p.classList.remove('open'));

    if (willOpen) {
      const trigger = document.getElementById(triggerElId || (inputId + 'Display'));
      const rect = trigger.getBoundingClientRect();
      const pickerHeight = 360;
      const openBelow = rect.bottom + pickerHeight + 10 <= window.innerHeight;

      picker.style.top = openBelow ? (rect.bottom + 6) + 'px' : (rect.top - pickerHeight - 6) + 'px';
      picker.style.left = Math.min(rect.left, window.innerWidth - 296 - 12) + 'px';

      const existing = document.getElementById(inputId).value;
      const base = existing ? new Date(existing + 'T00:00:00') : new Date();
      window.ppgDatePickerState[inputId] = {
        year: base.getFullYear(),
        month: base.getMonth(),
        selected: existing || null,
      };
      window.renderDatePicker(inputId);
      picker.classList.add('open');
    }
  };

  window.renderDatePicker = function (inputId) {
    const state = window.ppgDatePickerState[inputId];
    const picker = document.getElementById(inputId + 'Picker');

    const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const weekdays = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

    const firstDay = new Date(state.year, state.month, 1).getDay();
    const daysInMonth = new Date(state.year, state.month + 1, 0).getDate();
    const daysInPrevMonth = new Date(state.year, state.month, 0).getDate();
    const todayStr = new Date().toISOString().split('T')[0];

    const currentYear = new Date().getFullYear();
    let yearOptions = '';
    for (let y = currentYear + 1; y >= currentYear - 90; y--) {
      yearOptions += `<option value="${y}" ${y === state.year ? 'selected' : ''}>${y}</option>`;
    }
    const monthOptions = monthNames.map((m, i) => `<option value="${i}" ${i === state.month ? 'selected' : ''}>${m}</option>`).join('');

    let daysHtml = '';
    for (let i = firstDay - 1; i >= 0; i--) {
      daysHtml += `<div class="ppg-datepicker-day muted">${daysInPrevMonth - i}</div>`;
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${state.year}-${String(state.month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      let cls = 'ppg-datepicker-day';
      if (dateStr === todayStr) cls += ' today';
      if (dateStr === state.selected) cls += ' selected';
      daysHtml += `<div class="${cls}" onclick="window.pickDate('${inputId}', '${dateStr}')">${d}</div>`;
    }
    const totalCells = firstDay + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let d = 1; d <= trailing; d++) {
      daysHtml += `<div class="ppg-datepicker-day muted">${d}</div>`;
    }

    picker.innerHTML = `
      <div class="ppg-datepicker-header">
        <button type="button" class="ppg-datepicker-nav-btn" onclick="window.shiftDatePickerMonth('${inputId}', -1)">‹</button>
        <div class="ppg-datepicker-selects">
          <select onchange="window.setDatePickerMonth('${inputId}', this.value)">${monthOptions}</select>
          <select onchange="window.setDatePickerYear('${inputId}', this.value)">${yearOptions}</select>
        </div>
        <button type="button" class="ppg-datepicker-nav-btn" onclick="window.shiftDatePickerMonth('${inputId}', 1)">›</button>
      </div>
      <div class="ppg-datepicker-weekdays">${weekdays.map(w => `<div class="ppg-datepicker-weekday">${w}</div>`).join('')}</div>
      <div class="ppg-datepicker-days">${daysHtml}</div>
    `;
  };

  window.shiftDatePickerMonth = function (inputId, delta) {
    const state = window.ppgDatePickerState[inputId];
    state.month += delta;
    if (state.month < 0) { state.month = 11; state.year--; }
    if (state.month > 11) { state.month = 0; state.year++; }
    window.renderDatePicker(inputId);
  };

  document.addEventListener('scroll', function (e) {
    if (e.target && e.target.closest && e.target.closest('.ppg-timepicker-wheel-col')) return;
    document.querySelectorAll('.ppg-datepicker.open, .ppg-timepicker.open').forEach(p => p.classList.remove('open'));

  window.ppgTimePickerState = {};

  window.toggleTimePicker = function (inputId) {
    const picker = document.getElementById(inputId + 'Picker');
    const willOpen = !picker.classList.contains('open');

    document.querySelectorAll('.ppg-datepicker, .ppg-timepicker').forEach(p => p.classList.remove('open'));

    if (willOpen) {
      const trigger = document.getElementById(inputId + 'Display');
      const rect = trigger.getBoundingClientRect();
      const pickerHeight = 330;
      const openBelow = rect.bottom + pickerHeight + 10 <= window.innerHeight;

      picker.style.top = openBelow ? (rect.bottom + 6) + 'px' : (rect.top - pickerHeight - 6) + 'px';
      picker.style.left = Math.min(rect.left, window.innerWidth - 230 - 12) + 'px';

      const existing = document.getElementById(inputId).value;
      const [h, m] = existing ? existing.split(':').map(Number) : [0, 0];
      window.ppgTimePickerState[inputId] = { hour: h, minute: m };

      window.buildTimePickerWheels_(inputId);
      picker.classList.add('open');

      requestAnimationFrame(function () {
        document.getElementById(inputId + 'HourWheel').scrollTop = h * PPG_TIME_ITEM_H_;

        window.applyTimePickerSelection_(inputId);

  /** Bangun dua kolom scroll (Jam 00-23, Menit 00-59) sekali per buka panel — tidak di-render ulang saat scroll. */
  window.buildTimePickerWheels_ = function (inputId) {
    const picker = document.getElementById(inputId + 'Picker');
    const pad = n => String(n).padStart(2, '0');

    let hourItems = '';
    for (let h = 0; h < 24; h++) {
      hourItems += `<div class="ppg-timepicker-wheel-item" onclick="window.jumpTimeWheel_('${inputId}', 'hour', ${h})">${pad(h)}</div>`;
    }

    let minuteItems = '';
    for (let m = 0; m < 60; m++) {
      minuteItems += `<div class="ppg-timepicker-wheel-item" onclick="window.jumpTimeWheel_('${inputId}', 'minute', ${m})">${pad(m)}</div>`;
    }

    picker.innerHTML = `
      <div class="ppg-timepicker-preview" id="${inputId}Preview">00:00</div>
      <div class="ppg-timepicker-wheels">
        <div class="ppg-timepicker-wheel-highlight"></div>
        <div class="ppg-timepicker-wheel-col" id="${inputId}HourWheel">
          <div class="ppg-timepicker-wheel-spacer"></div>${hourItems}<div class="ppg-timepicker-wheel-spacer"></div>
        </div>
        <div class="ppg-timepicker-wheel-colon">:</div>
        <div class="ppg-timepicker-wheel-col" id="${inputId}MinuteWheel">
          <div class="ppg-timepicker-wheel-spacer"></div>${minuteItems}<div class="ppg-timepicker-wheel-spacer"></div>
        </div>
      </div>
      <div class="ppg-timepicker-footer">
        <button type="button" class="btn btn-primary" onclick="window.closeTimePicker_('${inputId}')">Selesai</button>
      </div>
    `;

    [['HourWheel', 'hour'], ['MinuteWheel', 'minute']].forEach(function (pair) {
      const col = document.getElementById(inputId + pair[0]);
      const kind = pair[1];
      let debounce = null;
      col.addEventListener('scroll', function () {
        clearTimeout(debounce);
        debounce = setTimeout(function () {
          const maxIdx = kind === 'hour' ? 23 : 59;
          const idx = Math.max(0, Math.min(maxIdx, Math.round(col.scrollTop / PPG_TIME_ITEM_H_)));
          if (col.scrollTop !== idx * PPG_TIME_ITEM_H_) col.scrollTo({ top: idx * PPG_TIME_ITEM_H_, behavior: 'smooth' });
          window.ppgTimePickerState[inputId][kind] = idx;
          window.applyTimePickerSelection_(inputId);
        }, 120);
      });
    });
  };

    col.scrollTo({ top: value * PPG_TIME_ITEM_H_, behavior: 'smooth' });
  };

  window.applyTimePickerSelection_ = function (inputId) {
    const state = window.ppgTimePickerState[inputId];
    const pad = n => String(n).padStart(2, '0');
    const value = `${pad(state.hour)}:${pad(state.minute)}`;
    document.getElementById(inputId + 'Preview').textContent = value;
    document.getElementById(inputId).value = value;
    document.getElementById(inputId + 'Display').value = value;
    if (inputId === 'jadwalKBMJamMulai' || inputId === 'jadwalKBMJamSelesai') window.updateJadwalKBMDurasi_();
  };

  /** Durasi otomatis (mis. "60 menit" / "1 jam 15 menit") dari Jam Mulai–Selesai di modal Jadwal KBM. */
  window.updateJadwalKBMDurasi_ = function () {
    const out = document.getElementById('jadwalKBMDurasi');
    const mulai = document.getElementById('jadwalKBMJamMulai').value;
    const selesai = document.getElementById('jadwalKBMJamSelesai').value;
    if (!mulai || !selesai) { out.value = ''; return; }

    let menit = window.jamKeMenit_(selesai) - window.jamKeMenit_(mulai);
    if (menit <= 0) { out.value = 'Jam selesai harus setelah jam mulai'; return; }

    const jam = Math.floor(menit / 60);
    const sisaMenit = menit % 60;
    out.value = jam > 0
      ? `${jam} jam${sisaMenit > 0 ? ' ' + sisaMenit + ' menit' : ''}`
      : `${sisaMenit} menit`;
  };

  window.updateGuruKelpUmur = function () {
    const tglLahir = document.getElementById('guruKelpTglLahir').value;
    const badge = document.getElementById('guruKelpUmurBadge');

    if (!tglLahir) {
      badge.style.display = 'none';
      return;
    }

    const birth = new Date(tglLahir + 'T00:00:00');
    const today = new Date();
    let age = today.getFullYear() - birth.getFullYear();
    const monthDiff = today.getMonth() - birth.getMonth();
    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
      age--;
    }

    document.getElementById('guruKelpUmur').textContent = age + ' tahun';
    badge.style.display = 'inline-flex';

      kode_pos: document.getElementById('guruKelpKodePos').value.trim(),

      alert('Nama dan Kategori wajib diisi.');
      return;
    }

    const editId = window.currentEditGuruId;
    const onDone = function (result) {
      window.hideGlobalLoading_();
      if (result.success) {
        window.closeModalGuruKelp();
        // Tampilkan instan (tanpa fetch ulang) — data langsung muncul di KPI + tabel.
        window.applyGuruMutationLocal_(data, editId || result.id, false);
      } else {
        alert(result.error);
      }
    };
    const onFail = function (err) {
      window.hideGlobalLoading_();
      alert('Gagal terhubung ke server: ' + (err && err.message ? err.message : err));
    };

    window.showGlobalLoading_('Menyimpan data...');
    if (editId) {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).serverUpdateGuru(window.currentToken, window.currentKelompokId, editId, data);
    } else {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).serverAddGuru(window.currentToken, window.currentKelompokId, data);

    const cntG = (arr, gender) => arr.filter(g => String(g.jenis_kelamin).toUpperCase() === gender).length;
    const arrTugasan = guru.filter(g => g.kategori === 'Muballigh Tugasan');

    const total = guru.length;
    const tugasan = arrTugasan.length;
    const setempat = arrSetempat.length;
    const bantu = arrBantu.length;
    const tugasanPct = total > 0 ? Math.round((tugasan / total) * 100) : 0;
    const setempatPct = total > 0 ? Math.round((setempat / total) * 100) : 0;
    const bantuPct = total > 0 ? Math.round((bantu / total) * 100) : 0;

    document.getElementById('gdTotalGuru').textContent = total;

    document.getElementById('gdBantu').textContent = bantu;

    document.getElementById('gdSetempatPct').textContent = setempatPct + '%';
    document.getElementById('gdBantuPct').textContent = bantuPct + '%';
    document.getElementById('gdTugasanBar').style.width = tugasanPct + '%';
    document.getElementById('gdSetempatBar').style.width = setempatPct + '%';
    document.getElementById('gdBantuBar').style.width = bantuPct + '%';

    // L/P per kartu (di sebelah angka besar)
    document.getElementById('gdTotalGuru_L').textContent = cntG(guru, 'L');
    document.getElementById('gdTotalGuru_P').textContent = cntG(guru, 'P');
    document.getElementById('gdSetempat_L').textContent = cntG(arrSetempat, 'L');
    document.getElementById('gdSetempat_P').textContent = cntG(arrSetempat, 'P');
    document.getElementById('gdTugasan_L').textContent = cntG(arrTugasan, 'L');

    document.getElementById('gdBantu_L').textContent = cntG(arrBantu, 'L');

    const list = window.lastGuruListData || (window.lastGuruListData = []);
    const idx = list.findIndex(x => String(x.id) === String(id));
    if (isDelete) {
      if (idx >= 0) list.splice(idx, 1);
    } else {
      const rec = Object.assign({}, idx >= 0 ? list[idx] : {}, data, { id: id, kelompok_id: window.currentKelompokId });

    cols.forEach(c => {
      head += `<th class="${window.colStickyClass_(c)}"${c.center ? ' style="text-align:center;"' : ''}>${c.label}</th>`;
    });

    thead.innerHTML = head;

      tbody.innerHTML = `<tr><td colspan="${cols.length}" style="text-align:center;padding:40px;color:var(--text-faint);">${emptyText}</td></tr>`;
      return;
    }

    let body = '';
    list.forEach((row, i) => {
      body += '<tr>';
      cols.forEach(c => {
        const content = c.html ? c.html(row, i) : window.escCell_(c.val(row, i));
        body += `<td class="${window.colStickyClass_(c)}"${c.center ? ' style="text-align:center;"' : ''}>${content}</td>`;
