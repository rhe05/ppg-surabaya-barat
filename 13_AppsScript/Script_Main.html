<script>
  window.currentToken = null;
  window.currentUser = null;
  window.currentKelompokId = null;

  function showAlert(elementId, message, type) {
    const alert = document.getElementById(elementId);
    alert.textContent = message;
    alert.className = `alert show alert-${type}`;
    setTimeout(() => {
      alert.classList.remove('show');
    }, 3000);
  }

  /* Spinner global tengah layar (tema brass). Pakai untuk SEMUA momen tunggu:
     boot aplikasi, simpan/hapus, ekspor. Jangan buat spinner lokal baru. */
  window.showGlobalLoading_ = function (text) {
    document.getElementById('globalLoadingText').textContent = text || 'Memuat...';
    document.getElementById('globalLoadingOverlay').classList.add('active');
  };

  window.hideGlobalLoading_ = function () {
    document.getElementById('globalLoadingOverlay').classList.remove('active');
  };

  window.onload = function () {
    document.getElementById('absensiTanggal').valueAsDate = new Date();

    google.script.run
      .withSuccessHandler(function (result) {
        if (result.devMode) {
          document.getElementById('devBanner').style.display = 'block';
          window.currentToken = result.token;
          window.currentUser = result.user;
          window.currentKelompokId = result.user.scopeId;
          renderApp(result.user);
          return;
        }
        const token = sessionStorage.getItem('ppg_token');
        if (token) {
          verifySession(token);
        } else {
          window.hideGlobalLoading_();
          document.getElementById('screenLogin').style.display = 'flex';
        }
      })
      .withFailureHandler(function () {
        window.hideGlobalLoading_();
        document.getElementById('screenLogin').style.display = 'flex';
      })
      .serverCheckDevMode();
  };

  window.handleLogin = function () {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      const error = document.getElementById('loginError');
      error.textContent = 'Username dan password wajib diisi.';
      error.style.display = 'block';
      return;
    }

    const btn = document.getElementById('btnLogin');
    btn.disabled = true;
    btn.textContent = 'Memproses...';

    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.textContent = 'Masuk';

        if (!result.success) {
          const error = document.getElementById('loginError');
          error.textContent = result.error;
          error.style.display = 'block';
          return;
        }

        sessionStorage.setItem('ppg_token', result.token);
        window.currentToken = result.token;
        window.currentUser = result.user;
        window.currentKelompokId = result.user.scopeId;
        renderApp(result.user);
      })
      .serverLogin(username, password);
  };

  function verifySession(token) {
    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          window.currentToken = token;
          window.currentUser = result.user;
          window.currentKelompokId = result.user.scopeId;
          renderApp(result.user);
        } else {
          sessionStorage.removeItem('ppg_token');
          window.hideGlobalLoading_();
          document.getElementById('screenLogin').style.display = 'flex';
        }
      })
      .withFailureHandler(function () {
        window.hideGlobalLoading_();
        document.getElementById('screenLogin').style.display = 'flex';
      })
      .serverGetSession(token);
  }

  function renderApp(user) {
    window.hideGlobalLoading_();
    document.getElementById('screenLogin').style.display = 'none';
    document.getElementById('appLayout').style.display = 'flex';

    // Menu Desa (browse Kelompok lintas Desa) hanya untuk Admin PPG
    const isAdminPpg = (user.role === 'admin_ppg');
    document.getElementById('menuDesaToggle').style.display = isAdminPpg ? 'flex' : 'none';
    if (isAdminPpg) window.renderSidebarTree_();

    window.loadDashboard();
  }

  window.handleLogout = function () {
    const token = sessionStorage.getItem('ppg_token') || window.currentToken;
    google.script.run.serverLogout(token);
    sessionStorage.removeItem('ppg_token');
    window.currentToken = null;
    window.currentUser = null;
    document.getElementById('screenLogin').style.display = 'flex';
    document.getElementById('appLayout').style.display = 'none';
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
  };

  window.toggleDesaMenu = function (event) {
    event.preventDefault();
    event.stopPropagation();
    const submenu = document.getElementById('desaSubmenu');
    const caret = document.getElementById('desaCaret');
    const isOpen = submenu.classList.toggle('open');
    caret.classList.toggle('rotated', isOpen);
  };

  window.toggleKelompokMenu = function (event, desaId) {
    event.preventDefault();
    event.stopPropagation();
    const submenu = document.getElementById('kelompokSubmenu' + desaId);
    const caret = document.getElementById('caretDesa' + desaId);
    if (!submenu || !caret) return;
    const isOpen = submenu.classList.toggle('open');
    caret.classList.toggle('rotated', isOpen);
  };

  /**
   * Bangun tree Desa > Kelompok dari sheet (bukan hardcode).
   * Kelompok non-aktif tetap ditampilkan tapi disabled ("Segera hadir").
   */
  window.renderSidebarTree_ = function () {
    const root = document.getElementById('desaSubmenu');
    if (!root) return;

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success || !res.data || !res.data.length) return;
        root.innerHTML = '';

        res.data.forEach(function (desa) {
          const li = document.createElement('li');
          li.className = 'sidebar-tree-item';

          const link = document.createElement('a');
          const label = document.createElement('span');
          label.textContent = 'Ds ' + desa.nama;
          link.appendChild(label);

          if (!desa.adaAktif) {
            link.className = 'sidebar-tree-link disabled';
            link.title = 'Segera hadir';
            li.appendChild(link);
            root.appendChild(li);
            return;
          }

          link.className = 'sidebar-tree-link';
          const caret = document.createElement('span');
          caret.className = 'sidebar-caret';
          caret.id = 'caretDesa' + desa.id;
          caret.textContent = '▸';
          link.appendChild(caret);
          link.addEventListener('click', function (ev) {
            window.toggleKelompokMenu(ev, desa.id);
          });
          li.appendChild(link);

          const sub = document.createElement('ul');
          sub.className = 'sidebar-tree sidebar-tree-2';
          sub.id = 'kelompokSubmenu' + desa.id;

          desa.kelompok.forEach(function (kel) {
            const kLi = document.createElement('li');
            const kLink = document.createElement('a');
            kLink.textContent = kel.nama;
            if (kel.aktif) {
              kLink.className = 'sidebar-tree-link-2';
              kLink.addEventListener('click', function (ev) {
                window.selectKelompok(ev, kel.id, kel.nama);
              });
            } else {
              kLink.className = 'sidebar-tree-link-2 disabled';
              kLink.title = 'Segera hadir';
            }
            kLi.appendChild(kLink);
            sub.appendChild(kLi);
          });

          li.appendChild(sub);
          root.appendChild(li);
        });
      })
      .withFailureHandler(function () { /* gagal ambil tree — sidebar Desa tetap kosong, tidak fatal */ })
      .serverGetSidebarTree();
  };

  window.toggleGenerusDashTable_ = function () {
    const wrapper = document.getElementById('santriDashTableWrapper');
    const btn = document.getElementById('santriTableToggleBtn');
    const isOpening = wrapper.style.display === 'none';

    wrapper.style.display = isOpening ? 'block' : 'none';
    btn.classList.toggle('active-state', isOpening);

    if (isOpening) {
      document.getElementById('santriDashScopeSelect').value = 'all';
      document.getElementById('santriDashSearchInput').value = '';
      window.santriTableScope = 'all';
      window.santriDashSearchQuery = '';
      window.renderSantriDashTable_(window.lastSantriListData || [], 'all', '');
    }
  };

  window.filterSantriDashTable_ = function (query) {
    window.santriDashSearchQuery = query;
    const scope = document.getElementById('santriDashScopeSelect').value;
    window.santriTableScope = scope;
    window.renderSantriDashTable_(window.lastSantriListData || [], scope, query);
  };

  window.currentEditGenerusId = null;

  window.openModalGenerusKelp = function () {
    window.currentEditGenerusId = null;
    document.getElementById('modalGenerusKelpTitle').textContent = 'Tambah Generus';
    document.getElementById('generusKelpNama').value = '';
    document.getElementById('generusKelpNamaPanggilan').value = '';
    document.getElementById('generusKelpNis').value = '';
    document.getElementById('generusKelpTempatLahir').value = '';
    document.getElementById('generusKelpTglLahir').value = '';
    document.getElementById('generusKelpTglLahirDisplay').value = '';
    document.getElementById('generusKelpJenjang').value = '';
    document.getElementById('generusKelpPendidikan').value = '';
    document.getElementById('generusKelpKlsSekolah').value = '';
    document.getElementById('generusKelpKelasNgaji').value = '';
    document.getElementById('generusKelpAlamat').value = '';
    document.getElementById('generusKelpRt').value = '';
    document.getElementById('generusKelpRw').value = '';
    document.getElementById('generusKelpKodePos').value = '';
    document.getElementById('generusKelpKelurahan').value = '';
    document.getElementById('generusKelpKabupaten').value = '';
    document.getElementById('generusKelpProvinsi').value = '';
    document.getElementById('generusKelpKecamatan').value = '';
    document.getElementById('generusKelpNamaAyah').value = '';
    document.getElementById('generusKelpNamaIbu').value = '';
    document.getElementById('generusKelpNomorWaAyah').value = '';
    document.getElementById('generusKelpNomorWaIbu').value = '';
    document.getElementById('generusKelpUmurBadge').style.display = 'none';
    document.getElementById('generusKelpGender').value = '';
    window.toggleGenerusKlsSekolah_();
    window.populateAutocomplete_();
    document.getElementById('modalGenerusKelp').classList.add('active');
  };

  window.closeModalGenerusKelp = function () {
    document.getElementById('modalGenerusKelp').classList.remove('active');
    document.querySelectorAll('.ppg-datepicker').forEach(p => p.classList.remove('open'));
  };

  window.toggleGenerusKlsSekolah_ = function () {
    const pendidikan = document.getElementById('generusKelpPendidikan').value;
    const wrap = document.getElementById('generusKelpKlsSekolahWrap');
    wrap.style.display = pendidikan === 'SD' ? 'block' : 'none';
    if (pendidikan !== 'SD') document.getElementById('generusKelpKlsSekolah').value = '';
  };

  window.updateGenerusKelpUmur = function () {
    const tglLahir = document.getElementById('generusKelpTglLahir').value;
    const badge = document.getElementById('generusKelpUmurBadge');

    if (!tglLahir) {
      badge.style.display = 'none';
      return;
    }

    const birth = new Date(tglLahir + 'T00:00:00');
    const today = new Date();
    let age = today.getFullYear() - birth.getFullYear();
    const monthDiff = today.getMonth() - birth.getMonth();
    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
      age--;
    }

    document.getElementById('generusKelpUmur').textContent = age + ' tahun';
    badge.style.display = 'inline-flex';
  };

  window.saveGenerusKelp = function () {
    const data = {
      nama: document.getElementById('generusKelpNama').value,
      nama_panggilan: document.getElementById('generusKelpNamaPanggilan').value.trim(),
      nis: document.getElementById('generusKelpNis').value,
      gender: document.getElementById('generusKelpGender').value,
      tempat_lahir: document.getElementById('generusKelpTempatLahir').value.trim(),
      tanggal_lahir: document.getElementById('generusKelpTglLahir').value,
      jenjang_saat_ini: document.getElementById('generusKelpJenjang').value,
      pendidikan: document.getElementById('generusKelpPendidikan').value,
      kelas_sekolah: document.getElementById('generusKelpKlsSekolah').value.trim(),
      kelas_ngaji: document.getElementById('generusKelpKelasNgaji').value.trim(),
      alamat: document.getElementById('generusKelpAlamat').value.trim(),
      rt: document.getElementById('generusKelpRt').value.trim(),
      rw: document.getElementById('generusKelpRw').value.trim(),
      kode_pos: document.getElementById('generusKelpKodePos').value.trim(),
      kelurahan: document.getElementById('generusKelpKelurahan').value.trim(),
      kabupaten_kota: document.getElementById('generusKelpKabupaten').value.trim(),
      provinsi: document.getElementById('generusKelpProvinsi').value.trim(),
      kecamatan: document.getElementById('generusKelpKecamatan').value.trim(),
      nama_ayah: document.getElementById('generusKelpNamaAyah').value.trim(),
      nama_ibu: document.getElementById('generusKelpNamaIbu').value.trim(),
      nomor_wa_ayah: document.getElementById('generusKelpNomorWaAyah').value.trim(),
      nomor_wa_ibu: document.getElementById('generusKelpNomorWaIbu').value.trim(),
    };

    if (!data.nama.trim() || !data.nis.trim() || !data.gender || !data.tanggal_lahir || !data.jenjang_saat_ini) {
      alert('Nama, NIS, Gender, Tanggal Lahir, dan Jenjang wajib diisi.');
      return;
    }

    const editId = window.currentEditGenerusId;
    const onDone = function (result) {
      window.hideGlobalLoading_();
      if (result.success) {
        window.closeModalGenerusKelp();
        window.applyGenerusMutationLocal_(data, editId || result.id, false);
      } else {
        alert(result.error);
      }
    };
    const onFail = function (err) {
      window.hideGlobalLoading_();
      alert('Gagal terhubung ke server: ' + (err && err.message ? err.message : err));
    };

    window.showGlobalLoading_('Menyimpan data...');
    if (editId) {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).serverUpdateSantri(window.currentToken, editId, data);
    } else {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).serverAddSantri(window.currentToken, window.currentKelompokId, data);
    }
  };

  window.generusJenjangLabels_ = {
    'AUD': 'PAUD-TK',
    'Cabe Rawit': 'Cabe Rawit',
    'Pra Remaja': 'Pra Remaja',
    'Remaja SMA': 'Remaja SMA',
    'Remaja': 'Remaja Pra Nikah',
  };

  window.viewGenerusKelp = function (id) {
    const s = (window.lastSantriListData || []).find(x => String(x.id) === String(id));
    if (!s) return;

    const html = [
      window.buildDetailItemHtml_('Nama', s.nama, true),
      window.buildDetailItemHtml_('Nama Panggilan', s.nama_panggilan),
      window.buildDetailItemHtml_('NIS', s.nis),
      window.buildDetailItemHtml_('Jenis Kelamin', s.gender === 'L' ? 'Laki-laki' : s.gender === 'P' ? 'Perempuan' : ''),
      window.buildDetailItemHtml_('Tempat Lahir', s.tempat_lahir),
      window.buildDetailItemHtml_('Tanggal Lahir', s.tanggal_lahir ? window.formatTanggalDisplay_(s.tanggal_lahir) + ' (' + window.calcUsiaThn_(s.tanggal_lahir) + ')' : ''),
      window.buildDetailItemHtml_('Jenjang', window.generusJenjangLabels_[s.jenjang_saat_ini] || s.jenjang_saat_ini),
      window.buildDetailItemHtml_('Pendidikan', s.pendidikan),
      window.buildDetailItemHtml_('Kls Sekolah', s.kelas_sekolah),
      window.buildDetailItemHtml_('Kelas Ngaji', s.kelas_ngaji),
      window.buildDetailItemHtml_('Alamat Rumah', s.alamat, true),
      window.buildDetailItemHtml_('RT/RW', (s.rt || s.rw) ? `${s.rt || '-'} / ${s.rw || '-'}` : ''),
      window.buildDetailItemHtml_('Kode Pos', s.kode_pos),
      window.buildDetailItemHtml_('Ds/Kelurahan', s.kelurahan),
      window.buildDetailItemHtml_('Kabupaten/Kota', s.kabupaten_kota),
      window.buildDetailItemHtml_('Kecamatan', s.kecamatan),
      window.buildDetailItemHtml_('Provinsi', s.provinsi),
      window.buildDetailItemHtml_('Nama Ayah', s.nama_ayah),
      window.buildDetailItemHtml_('Nama Ibu', s.nama_ibu),
      window.buildDetailItemHtml_('Nomor WA Ayah', s.nomor_wa_ayah),
      window.buildDetailItemHtml_('Nomor WA Ibu', s.nomor_wa_ibu),
    ].join('');

    document.getElementById('generusKelpDetailBody').innerHTML = html;
    document.getElementById('modalDetailGenerusKelp').classList.add('active');
  };

  window.closeModalDetailGenerusKelp = function () {
    document.getElementById('modalDetailGenerusKelp').classList.remove('active');
  };

  window.editGenerusKelp = function (id) {
    const s = (window.lastSantriListData || []).find(x => String(x.id) === String(id));
    if (!s) return;

    window.currentEditGenerusId = id;
    document.getElementById('generusKelpNama').value = s.nama || '';
    document.getElementById('generusKelpNamaPanggilan').value = s.nama_panggilan || '';
    document.getElementById('generusKelpNis').value = s.nis || '';
    document.getElementById('generusKelpGender').value = s.gender || '';
    document.getElementById('generusKelpTempatLahir').value = s.tempat_lahir || '';
    document.getElementById('generusKelpTglLahir').value = s.tanggal_lahir || '';
    document.getElementById('generusKelpTglLahirDisplay').value = window.formatTanggalDisplay_(s.tanggal_lahir);
    document.getElementById('generusKelpJenjang').value = s.jenjang_saat_ini || '';
    document.getElementById('generusKelpPendidikan').value = s.pendidikan || '';
    window.toggleGenerusKlsSekolah_();
    document.getElementById('generusKelpKlsSekolah').value = s.kelas_sekolah || '';
    document.getElementById('generusKelpKelasNgaji').value = s.kelas_ngaji || '';
    document.getElementById('generusKelpAlamat').value = s.alamat || '';
    document.getElementById('generusKelpRt').value = s.rt || '';
    document.getElementById('generusKelpRw').value = s.rw || '';
    document.getElementById('generusKelpKodePos').value = s.kode_pos || '';
    document.getElementById('generusKelpKelurahan').value = s.kelurahan || '';
    document.getElementById('generusKelpKabupaten').value = s.kabupaten_kota || '';
    document.getElementById('generusKelpProvinsi').value = s.provinsi || '';
    document.getElementById('generusKelpKecamatan').value = s.kecamatan || '';
    document.getElementById('generusKelpNamaAyah').value = s.nama_ayah || '';
    document.getElementById('generusKelpNamaIbu').value = s.nama_ibu || '';
    document.getElementById('generusKelpNomorWaAyah').value = s.nomor_wa_ayah || '';
    document.getElementById('generusKelpNomorWaIbu').value = s.nomor_wa_ibu || '';
    document.getElementById('modalGenerusKelpTitle').textContent = 'Edit Generus';
    window.updateGenerusKelpUmur();
    window.populateAutocomplete_();
    document.getElementById('modalGenerusKelp').classList.add('active');
  };

  window.pendingDeleteGenerusId_ = null;

  window.deleteGenerusKelp = function (id) {
    const s = (window.lastSantriListData || []).find(x => String(x.id) === String(id));
    window.pendingDeleteGenerusId_ = id;
    document.getElementById('generusKelpDeleteNama').textContent = s ? s.nama : 'generus ini';
    document.getElementById('modalDeleteGenerusKelp').classList.add('active');
  };

  window.closeModalDeleteGenerusKelp = function () {
    document.getElementById('modalDeleteGenerusKelp').classList.remove('active');
    window.pendingDeleteGenerusId_ = null;
    window.setGenerusDeleteLoading_(false);
  };

  window.setGenerusDeleteLoading_ = function (isLoading) {
    const confirmBtn = document.getElementById('generusKelpDeleteConfirmBtn');
    const cancelBtn = document.getElementById('generusKelpDeleteCancelBtn');
    confirmBtn.disabled = isLoading;
    cancelBtn.disabled = isLoading;
    if (isLoading) window.showGlobalLoading_('Menghapus data...');
    else window.hideGlobalLoading_();
  };

  window.confirmDeleteGenerusKelp = function () {
    const id = window.pendingDeleteGenerusId_;
    if (!id) return;

    window.setGenerusDeleteLoading_(true);

    google.script.run
      .withSuccessHandler(function (result) {
        window.setGenerusDeleteLoading_(false);
        if (result.success) {
          window.closeModalDeleteGenerusKelp();
          window.applyGenerusMutationLocal_(null, id, true);
        } else {
          alert(result.error);
        }
      })
      .withFailureHandler(function (err) {
        window.setGenerusDeleteLoading_(false);
        alert('Gagal menghapus: ' + (err && err.message ? err.message : err));
      })
      .serverDeleteSantri(window.currentToken, id);
  };

  window.digitsOnlyInput_ = function (el) {
    el.value = el.value.replace(/[^0-9]/g, '');
  };

  window.formatPhoneDashInput_ = function (el) {
    const digits = el.value.replace(/[^0-9]/g, '').slice(0, 13);
    const parts = [digits.slice(0, 4), digits.slice(4, 8), digits.slice(8, 13)].filter(Boolean);
    el.value = parts.join('-');
  };

  /* ATURAN KRITIS (lihat ERROR_LOG.md #1): JANGAN PERNAH menulis garis-miring
     ganda di dalam string JavaScript (termasuk URL berawalan http maupun xmlns)
     — pemroses HtmlService Apps Script salah menganggapnya komentar dan memotong
     baris saat serving, menyebabkan syntax error + layar putih total. Atribut
     xmlns tidak diperlukan untuk SVG via innerHTML, sengaja dihilangkan. */
  window.iconViewSvg_ = '<svg viewBox="0 0 24 24" fill="none"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>';
  window.iconEditSvg_ = '<svg viewBox="0 0 24 24" fill="none"><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  window.iconDeleteSvg_ = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-9 0 1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  window.escapeHtmlExport_ = function (str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  };

  window.downloadXlsxFromBase64_ = function (base64, filename) {
    const byteChars = atob(base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', filename);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  window.printPdfList_ = function (title, headers, rows) {
    const win = window.open('', '_blank');
    const headHtml = headers.map(h => `<th>${window.escapeHtmlExport_(h)}</th>`).join('');
    const rowsHtml = rows.map(r => '<tr>' + r.map(c => `<td>${window.escapeHtmlExport_(c)}</td>`).join('') + '</tr>').join('');
    win.document.write(`
      <html>
        <head>
          <title>${window.escapeHtmlExport_(title)}</title>
          <style>
            @page { size: A4 landscape; margin: 12mm; }
            body { font-family: Arial, sans-serif; padding: 24px; }
            h1 { font-size: 18px; margin-bottom: 16px; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #ccc; padding: 6px 10px; font-size: 11px; text-align: left; white-space: nowrap; }
            th { background: #f3f4f6; }
          </style>
        </head>
        <body>
          <h1>${window.escapeHtmlExport_(title)}</h1>
          <table><thead><tr>${headHtml}</tr></thead><tbody>${rowsHtml}</tbody></table>
          <script>window.onload = function () { window.print(); };<\/script>
        </body>
      </html>
    `);
    win.document.close();
  };

  /* ═════ CUSTOM DATE PICKER (dipakai oleh form Tambah Guru) ═════ */
  window.ppgDatePickerState = {};

  window.toggleDatePicker = function (inputId) {
    const picker = document.getElementById(inputId + 'Picker');
    const willOpen = !picker.classList.contains('open');

    document.querySelectorAll('.ppg-datepicker').forEach(p => p.classList.remove('open'));

    if (willOpen) {
      const trigger = document.getElementById(inputId + 'Display');
      const rect = trigger.getBoundingClientRect();
      const pickerHeight = 360;
      const openBelow = rect.bottom + pickerHeight + 10 <= window.innerHeight;

      picker.style.top = openBelow ? (rect.bottom + 6) + 'px' : (rect.top - pickerHeight - 6) + 'px';
      picker.style.left = Math.min(rect.left, window.innerWidth - 296 - 12) + 'px';

      const existing = document.getElementById(inputId).value;
      const base = existing ? new Date(existing + 'T00:00:00') : new Date();
      window.ppgDatePickerState[inputId] = {
        year: base.getFullYear(),
        month: base.getMonth(),
        selected: existing || null,
      };
      window.renderDatePicker(inputId);
      picker.classList.add('open');
    }
  };

  window.renderDatePicker = function (inputId) {
    const state = window.ppgDatePickerState[inputId];
    const picker = document.getElementById(inputId + 'Picker');

    const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const weekdays = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

    const firstDay = new Date(state.year, state.month, 1).getDay();
    const daysInMonth = new Date(state.year, state.month + 1, 0).getDate();
    const daysInPrevMonth = new Date(state.year, state.month, 0).getDate();
    const todayStr = new Date().toISOString().split('T')[0];

    const currentYear = new Date().getFullYear();
    let yearOptions = '';
    for (let y = currentYear + 1; y >= currentYear - 90; y--) {
      yearOptions += `<option value="${y}" ${y === state.year ? 'selected' : ''}>${y}</option>`;
    }
    const monthOptions = monthNames.map((m, i) => `<option value="${i}" ${i === state.month ? 'selected' : ''}>${m}</option>`).join('');

    let daysHtml = '';
    for (let i = firstDay - 1; i >= 0; i--) {
      daysHtml += `<div class="ppg-datepicker-day muted">${daysInPrevMonth - i}</div>`;
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${state.year}-${String(state.month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      let cls = 'ppg-datepicker-day';
      if (dateStr === todayStr) cls += ' today';
      if (dateStr === state.selected) cls += ' selected';
      daysHtml += `<div class="${cls}" onclick="window.pickDate('${inputId}', '${dateStr}')">${d}</div>`;
    }
    const totalCells = firstDay + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let d = 1; d <= trailing; d++) {
      daysHtml += `<div class="ppg-datepicker-day muted">${d}</div>`;
    }

    picker.innerHTML = `
      <div class="ppg-datepicker-header">
        <button type="button" class="ppg-datepicker-nav-btn" onclick="window.shiftDatePickerMonth('${inputId}', -1)">‹</button>
        <div class="ppg-datepicker-selects">
          <select onchange="window.setDatePickerMonth('${inputId}', this.value)">${monthOptions}</select>
          <select onchange="window.setDatePickerYear('${inputId}', this.value)">${yearOptions}</select>
        </div>
        <button type="button" class="ppg-datepicker-nav-btn" onclick="window.shiftDatePickerMonth('${inputId}', 1)">›</button>
      </div>
      <div class="ppg-datepicker-weekdays">${weekdays.map(w => `<div class="ppg-datepicker-weekday">${w}</div>`).join('')}</div>
      <div class="ppg-datepicker-days">${daysHtml}</div>
    `;
  };

  window.shiftDatePickerMonth = function (inputId, delta) {
    const state = window.ppgDatePickerState[inputId];
    state.month += delta;
    if (state.month < 0) { state.month = 11; state.year--; }
    if (state.month > 11) { state.month = 0; state.year++; }
    window.renderDatePicker(inputId);
  };

  window.setDatePickerMonth = function (inputId, month) {
    window.ppgDatePickerState[inputId].month = parseInt(month);
    window.renderDatePicker(inputId);
  };

  window.setDatePickerYear = function (inputId, year) {
    window.ppgDatePickerState[inputId].year = parseInt(year);
    window.renderDatePicker(inputId);
  };

  window.pickDate = function (inputId, dateStr) {
    window.ppgDatePickerState[inputId].selected = dateStr;
    document.getElementById(inputId).value = dateStr;

    const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const d = new Date(dateStr + 'T00:00:00');
    document.getElementById(inputId + 'Display').value = `${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()}`;

    document.getElementById(inputId + 'Picker').classList.remove('open');

    if (inputId === 'guruKelpTglLahir') {
      window.updateGuruKelpUmur();
    }
    if (inputId === 'guruKelpMulaiMengajar') {
      window.updateGuruKelpLama();

    if (inputId === 'generusKelpTglLahir') {
      window.updateGenerusKelpUmur();

  };

  window.updateGuruKelpUmur = function () {
    const tglLahir = document.getElementById('guruKelpTglLahir').value;
    const badge = document.getElementById('guruKelpUmurBadge');

    if (!tglLahir) {
      badge.style.display = 'none';

    }

    const birth = new Date(tglLahir + 'T00:00:00');
    const today = new Date();
    let age = today.getFullYear() - birth.getFullYear();
    const monthDiff = today.getMonth() - birth.getMonth();
    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
      age--;

    document.getElementById('guruKelpUmur').textContent = age + ' tahun';

        window.applyGuruMutationLocal_(data, editId || result.id, false);

      }
    };
    const onFail = function (err) {
      window.hideGlobalLoading_();
      alert('Gagal terhubung ke server: ' + (err && err.message ? err.message : err));
    };

    window.showGlobalLoading_('Menyimpan data...');
    if (editId) {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).serverUpdateGuru(window.currentToken, editId, data);

  // Hitung ulang KPI + tabel guru dari array data (dipakai loader server & update lokal instan).
  window.renderGuruKpis_ = function (guru) {
    const cntG = (arr, gender) => arr.filter(g => String(g.jenis_kelamin).toUpperCase() === gender).length;
    const arrTugasan = guru.filter(g => g.kategori === 'Muballigh Tugasan');
    const arrSetempat = guru.filter(g => g.kategori === 'Muballigh Setempat');
    const arrBantu = guru.filter(g => g.kategori === 'Guru Bantu');

    const total = guru.length;
    const tugasan = arrTugasan.length;
    const setempat = arrSetempat.length;
    const bantu = arrBantu.length;
    const tugasanPct = total > 0 ? Math.round((tugasan / total) * 100) : 0;
    const setempatPct = total > 0 ? Math.round((setempat / total) * 100) : 0;
    const bantuPct = total > 0 ? Math.round((bantu / total) * 100) : 0;

    document.getElementById('gdTotalGuru').textContent = total;
    document.getElementById('gdTugasan').textContent = tugasan;
    document.getElementById('gdSetempat').textContent = setempat;
    document.getElementById('gdBantu').textContent = bantu;
    document.getElementById('gdTugasanPct').textContent = tugasanPct + '%';
    document.getElementById('gdSetempatPct').textContent = setempatPct + '%';
    document.getElementById('gdBantuPct').textContent = bantuPct + '%';
    document.getElementById('gdTugasanBar').style.width = tugasanPct + '%';
    document.getElementById('gdSetempatBar').style.width = setempatPct + '%';
    document.getElementById('gdBantuBar').style.width = bantuPct + '%';

    // L/P per kartu (di sebelah angka besar)
    document.getElementById('gdTotalGuru_L').textContent = cntG(guru, 'L');
    document.getElementById('gdTotalGuru_P').textContent = cntG(guru, 'P');
    document.getElementById('gdSetempat_L').textContent = cntG(arrSetempat, 'L');
    document.getElementById('gdSetempat_P').textContent = cntG(arrSetempat, 'P');
    document.getElementById('gdTugasan_L').textContent = cntG(arrTugasan, 'L');
    document.getElementById('gdTugasan_P').textContent = cntG(arrTugasan, 'P');
    document.getElementById('gdBantu_L').textContent = cntG(arrBantu, 'L');
    document.getElementById('gdBantu_P').textContent = cntG(arrBantu, 'P');

    if (document.getElementById('guruDashTableWrapper').style.display !== 'none') {
      window.renderGuruDashTable_(guru, window.guruTableScope || 'all', window.guruDashSearchQuery || '');
    }
  };

      cols.forEach(c => {
        const content = c.html ? c.html(row, i) : window.escCell_(c.val(row, i));
        body += `<td class="${window.colStickyClass_(c)}"${c.center ? ' style="text-align:center;"' : ''}>${content}</td>`;

  /* ═════ AUTOCOMPLETE — saran instan dari data yang sudah pernah diinput ═════
     Pakai <datalist> native: browser menyaring saran secara instan saat
     mengetik & memunculkannya saat field diklik. Sumbernya gabungan data guru
     + generus yang sudah dimuat, jadi admin tidak perlu mengetik ulang. */
  window.fillDatalist_ = function (id, values) {
    const dl = document.getElementById(id);
    if (!dl) return;
    const seen = {};
    const uniq = [];
    values.forEach(v => {
      if (v === null || v === undefined) return;
      const t = String(v).trim();
      if (!t) return;
      const k = t.toLowerCase();
      if (seen[k]) return;
      seen[k] = true;
      uniq.push(t);
    });
    uniq.sort((a, b) => a.localeCompare(b, 'id'));
    dl.innerHTML = uniq.map(v => `<option value="${window.escapeHtmlExport_(v)}"></option>`).join('');
  };

  window.showToast_ = function (msg) {

  window.hardRefresh_ = function () {
    const active = document.querySelector('.screen-wrapper.active');
    const id = active ? active.id : 'screenDashboard';
    window.showGlobalLoading_('Memuat ulang data...');

    // Spinner WAJIB tertutup walau ada loader yang tidak pernah memanggil
    // callback (mis. server error) — supaya tidak pernah menggantung.
    let closed = false;
    const finish = function (ok) {
      if (closed) return;
      closed = true;
      clearTimeout(safety);
      window.hideGlobalLoading_();
      if (ok !== false) window.showToast_('Data berhasil diperbarui');
    };
    const safety = setTimeout(function () { finish(true); }, 8000);

    try {
      if (id === 'screenGuruDashboard') {
        const kelompokId = window.currentKelompokId;
        if (!kelompokId) { finish(true); return; }
        const nama = window.currentKelompokName
          || document.getElementById('guruDashKelompokBadge').textContent || '';
        // Satu panggilan saja, menembus cache server (forceFresh) — sekali klik
        // langsung dapat data terbaru dari sheet.
        window.loadKelompokDashboard(kelompokId, nama, function () { finish(true); }, true);
        return;
      }

      const loader = window.SCREEN_LOADERS_[id];
      if (loader) loader();
      setTimeout(function () { finish(true); }, 700);
    } catch (e) {
      finish(false);
      alert('Gagal memuat ulang: ' + (e && e.message ? e.message : e));
    }
  };

  /* Parser tanggal fleksibel — menerima 3 bentuk yang bisa muncul:
     1. "YYYY-MM-DD" (string dari form)
     2. ISO datetime "YYYY-MM-DDTHH:MM:SS(.sssZ)" (objek Date sheet yang di-
        serialize google.script.run jadi string UTC)
     3. objek Date langsung
     Mengembalikan Date valid atau null. Ini akar bug "NaN / undefined". */
  window.parseDateFlexible_ = function (v) {
    if (!v) return null;
    if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
    let s = String(v).trim();
    if (!s) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) s = s + 'T00:00:00';
    const d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
  };

  /* Durasi rinci dari sebuah tanggal sampai HARI INI: "3 tahun 5 bulan 12 hari".
     Dipakai untuk Lama Mengajar. Selalu dihitung ulang saat ditampilkan supaya
     tidak pernah basi. */
  window.calcDurasiDetail_ = function (dateStr) {
    const start = window.parseDateFlexible_(dateStr);
    if (!start) return '';
    const now = new Date();
    if (start > now) return '0 hari';

    let y = now.getFullYear() - start.getFullYear();
    let m = now.getMonth() - start.getMonth();
    let d = now.getDate() - start.getDate();

    if (d < 0) {
      m -= 1;
      d += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
    }
    if (m < 0) { y -= 1; m += 12; }

    const parts = [];
    if (y > 0) parts.push(y + ' tahun');
    if (m > 0) parts.push(m + ' bulan');
    if (d > 0 || parts.length === 0) parts.push(d + ' hari');
    return parts.join(' ');
  };

  window.calcUsiaThn_ = function (tanggalLahir) {
    const birth = window.parseDateFlexible_(tanggalLahir);
    if (!birth) return '-';
    const today = new Date();
    let age = today.getFullYear() - birth.getFullYear();
    const monthDiff = today.getMonth() - birth.getMonth();
    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) age--;
    return age + ' Thn';
  };

    const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    return `${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()}`;
  };

  // Hitung ulang KPI gender + breakdown jenjang + tabel generus dari array data.
  window.renderSantriKpis_ = function (santri) {
    const total = santri.length;

    const lakiLaki = santri.filter(s => String(s.gender).toUpperCase() === 'L').length;
    const perempuan = santri.filter(s => String(s.gender).toUpperCase() === 'P').length;
    const lPct = total > 0 ? Math.round((lakiLaki / total) * 100) : 0;
    const pPct = total > 0 ? Math.round((perempuan / total) * 100) : 0;

    document.getElementById('kdTotalSantri').textContent = total;
    document.getElementById('kdSantriL').textContent = lakiLaki;
    document.getElementById('kdSantriP').textContent = perempuan;
    document.getElementById('kdSantriLPct').textContent = lPct + '%';
    document.getElementById('kdSantriPPct').textContent = pPct + '%';
    document.getElementById('kdSantriLBar').style.width = lPct + '%';
    document.getElementById('kdSantriPBar').style.width = pPct + '%';

    if (document.getElementById('santriDashTableWrapper').style.display !== 'none') {
      window.renderSantriDashTable_(santri, window.santriTableScope || 'all', window.santriDashSearchQuery || '');
    }

    const kelasMap = {
      'AUD': { total: 0, L: 0, P: 0 },
      'Cabe Rawit': { total: 0, L: 0, P: 0 },
      'Pra Remaja': { total: 0, L: 0, P: 0 },
      'Remaja SMA': { total: 0, L: 0, P: 0 },
      'Remaja': { total: 0, L: 0, P: 0 },
    };
    santri.forEach(s => {
      if (!kelasMap.hasOwnProperty(s.jenjang_saat_ini)) return;
      kelasMap[s.jenjang_saat_ini].total++;
      const g = String(s.gender).toUpperCase();
      if (g === 'L' || g === 'P') kelasMap[s.jenjang_saat_ini][g]++;
    });

    const kelasIds = {
      'AUD': 'kdKelasAUD',
      'Cabe Rawit': 'kdKelasCabeRawit',
      'Pra Remaja': 'kdKelasPraRemaja',
      'Remaja SMA': 'kdKelasRemajaSMA',
      'Remaja': 'kdKelasRemaja',
    };

    Object.keys(kelasMap).forEach(jenjang => {
      const { total: count, L, P } = kelasMap[jenjang];
      const pct = total > 0 ? Math.round((count / total) * 100) : 0;
      const baseId = kelasIds[jenjang];
      document.getElementById(baseId).textContent = count;
      document.getElementById(baseId + 'Pct').textContent = pct + '%';
      document.getElementById(baseId + 'Bar').style.width = pct + '%';
      document.getElementById(baseId + '_L').textContent = L;
      document.getElementById(baseId + '_P').textContent = P;
    });
  };

  window.applyGenerusMutationLocal_ = function (data, id, isDelete) {
    const list = window.lastSantriListData || (window.lastSantriListData = []);
    const idx = list.findIndex(x => String(x.id) === String(id));
    if (isDelete) {
      if (idx >= 0) list.splice(idx, 1);

  document.addEventListener('DOMContentLoaded', function () {

  window.handleBulkImportFileSelect = function (e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (event) {
      try {
        const csv = event.target.result;
        const rows = window.parseCSV(csv);

        if (rows.length === 0) {
          showAlert('santriError', 'File kosong atau format tidak valid.', 'error');
          return;
        }

        window.bulkImportData = rows;

        // Show preview (max 5 rows)
        const previewRows = rows.slice(0, 5);
        const tbody = document.getElementById('bulkImportPreviewBody');
        tbody.innerHTML = previewRows.map((row, idx) => `
          <tr>
            <td>${idx + 1}</td>
            <td>${row.nama || '-'}</td>
            <td>${row.nis || '-'}</td>
            <td>${row.gender || '-'}</td>
            <td>${row.tanggal_lahir || '-'}</td>
            <td>${row.jenjang_saat_ini || '-'}</td>
          </tr>
        `).join('');
        document.getElementById('bulkImportPreview').style.display = 'block';

        // Show stats
        document.getElementById('bulkImportRowCount').textContent = rows.length;
        document.getElementById('bulkImportStats').style.display = 'block';
        document.getElementById('btnBulkImportProcess').disabled = false;

        // Note: actual validation happens on server side
        showAlert('santriSuccess', `${rows.length} baris siap diimpor. Validasi lengkap akan dilakukan saat proses.`, 'success');
      } catch (err) {
        showAlert('santriError', 'Error: ' + err.message, 'error');
      }
    };

    // Handle both CSV and Excel
    if (file.name.endsWith('.csv')) {
      reader.readAsText(file);
    } else if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
      // For Excel, we need to use a library or convert. For now, fallback to CSV
      showAlert('santriError', 'Excel format belum didukung. Silakan konversi ke CSV terlebih dahulu.', 'error');
    } else {
      showAlert('santriError', 'Format file harus CSV atau Excel.', 'error');
    }
  };

  // Helper: Parse CSV (simple implementation)
  window.parseCSV = function (csv) {
    const lines = csv.trim().split('\n');
    if (lines.length < 2) return []; // Header + at least 1 data row

    // Try to auto-detect delimiter (comma or semicolon)
    const headers = lines[0].split(/[,;]/).map(h => h.trim().toLowerCase());
    const delimiter = lines[0].includes(';') ? ';' : ',';

    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const values = lines[i].split(delimiter).map(v => v.trim());
      if (values.length < 5) continue; // Skip incomplete rows

      const row = {
        nama: values[0],
        nis: values[1],
        gender: values[2],
        tanggal_lahir: values[3],
        jenjang_saat_ini: values[4],
      };
      rows.push(row);
    }
    return rows;
  };

  window.exportData = function (type) {
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = '⏳ Mengekspor...';

    const handler = function (result) {
      btn.disabled = false;
      btn.textContent = 'Export CSV';

      if (result.success) {
        // Download CSV file
        const csv = result.data;
        const filename = result.filename;
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.setAttribute('href', url);
        link.setAttribute('download', filename);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        showAlert('laporanSuccess', `✓ Berhasil export ${type}. File: ${filename}`, 'success');
      } else {
        showAlert('laporanError', result.error, 'error');
      }
    };

    if (type === 'santri') {
      google.script.run
        .withSuccessHandler(handler)
        .serverExportSantri(window.currentToken, window.currentKelompokId);
    } else if (type === 'guru') {
      google.script.run
        .withSuccessHandler(handler)
        .serverExportGuru(window.currentToken, window.currentKelompokId);
    }
  };

    };

    const chart = new google.visualization.LineChart(document.getElementById('chartAttendanceTrend'));
    const dataTable = google.visualization.arrayToDataTable(chartData);

  window.saveUser = function () {

    const role = document.getElementById('userRole').value;
    const scopeType = document.getElementById('userScopeType').value;

      google.script.run
        .withSuccessHandler(function (result) {
          btn.disabled = false;

    const kategoriData = [['Kategori', 'Jumlah']];
    Object.entries(stats.distribution_by_kategori).forEach(([kategori, count]) => {
      kategoriData.push([kategori.charAt(0).toUpperCase() + kategori.slice(1), count]);
    });

    const kategoriOptions = {
      title: 'Distribusi Kategori Konseling',
      pieHole: 0.4,
      colors: ['#d97706', '#f87171', '#fb923c', '#fbbf24', '#fcd34d', '#a855f7'],
      chartArea: { width: '90%', height: '90%' }
    };

    const kategoriChart = new google.visualization.PieChart(document.getElementById('chartKonselingKategori'));
    const kategoriTable = google.visualization.arrayToDataTable(kategoriData);
    kategoriChart.draw(kategoriTable, kategoriOptions);

    // Line Chart: Timeline Bulanan
    const timelineData = [['Bulan', 'Jumlah Kasus']];
    Object.entries(stats.distribution_by_month).sort().forEach(([month, count]) => {
      const [year, monthNum] = month.split('-');
      const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      timelineData.push([monthNames[parseInt(monthNum) - 1] + ' ' + year, count]);
    });

    const timelineOptions = {
      title: 'Timeline Kasus Konseling (Bulanan)',
      curveType: 'function',
      legend: { position: 'bottom' },
      colors: ['#3b82f6'],
      hAxis: { slantedText: true },
      vAxis: { minValue: 0 },
      chartArea: { width: '90%', height: '85%' }
    };

    const timelineChart = new google.visualization.LineChart(document.getElementById('chartKonselingTimeline'));
    const timelineTable = google.visualization.arrayToDataTable(timelineData);
    timelineChart.draw(timelineTable, timelineOptions);
  };

  /* ═════ KALENDER AKADEMIK FUNCTIONS ═════ */

  window.currentKalenderMonth = new Date();

  window.loadKalenderScreen = function () {
    window.loadKalenderData();
  };

  window.loadKalenderData = function () {
    const tahun = window.currentKalenderMonth.getFullYear();
    const bulan = window.currentKalenderMonth.getMonth() + 1;

    // Update title
    const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    document.getElementById('kalenderTitle').textContent = monthNames[bulan - 1] + ' ' + tahun;

    // Load events
    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          window.renderKalendarGrid(tahun, bulan, result.data);
          window.renderKalendarEventsList(result.data);
        }
      })
      .serverGetCalendarEvents(window.currentToken, tahun, bulan);

    // Load summary
    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          document.getElementById('kalenderTotalEvents').textContent = result.data.total_events;
          document.getElementById('kalenderKBMEvents').textContent = result.data.by_type.kbm;
          document.getElementById('kalenderUjianEvents').textContent = result.data.by_type.ujian;
          document.getElementById('kalenderAcaraEvents').textContent = result.data.by_type.acara;
          document.getElementById('kalenderLiburEvents').textContent = result.data.by_type.libur;
        }
      })
      .serverGetCalendarEventSummary(window.currentToken, tahun, bulan);
  };

  window.renderKalendarGrid = function (tahun, bulan, events) {
    const firstDay = new Date(tahun, bulan - 1, 1).getDay();
    const daysInMonth = new Date(tahun, bulan, 0).getDate();
    const grid = document.getElementById('kalenderGrid');
    grid.innerHTML = '';

    // Empty cells for days before month starts
    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.style.cssText = 'background: #f9f9f9; padding: 8px; text-align: center; color: #999; border: 1px solid #eee;';
      grid.appendChild(empty);
    }

    // Days of month
    const eventsByDate = {};
    events.forEach(e => {
      if (!eventsByDate[e.tanggal]) eventsByDate[e.tanggal] = [];
      eventsByDate[e.tanggal].push(e);
    });

    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${tahun}-${String(bulan).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const dayEvents = eventsByDate[dateStr] || [];
      const isToday = new Date().toDateString() === new Date(tahun, bulan - 1, day).toDateString();

      const cell = document.createElement('div');
      cell.style.cssText = `
        padding: 8px;
        border: 1px solid #ddd;
        min-height: 60px;
        background: ${isToday ? '#e3f2fd' : 'white'};
        cursor: pointer;
        transition: background 0.2s;
      `;
      cell.onmouseover = () => cell.style.background = '#f5f5f5';
      cell.onmouseout = () => cell.style.background = isToday ? '#e3f2fd' : 'white';
      cell.onclick = () => window.openKalenderModalForDate(dateStr);

      let html = `<strong style="color: ${isToday ? '#1976d2' : '#333'};">${day}</strong>`;
      if (dayEvents.length > 0) {
        html += `<div style="font-size: 10px; margin-top: 4px; color: #666;">`;
        dayEvents.slice(0, 2).forEach(e => {
          const colors = { kbm: '#388e3c', ujian: '#f57c00', acara: '#c2185b', libur: '#7b1fa2' };
          html += `<div style="background: ${colors[e.tipe_event] || '#999'}; color: white; padding: 2px 4px; border-radius: 2px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${e.judul_event}</div>`;
        });
        if (dayEvents.length > 2) {
          html += `<div style="color: #999;">+${dayEvents.length - 2} more</div>`;
        }
        html += `</div>`;
      }
      cell.innerHTML = html;
      grid.appendChild(cell);
    }
  };

  window.renderKalendarEventsList = function (events) {
    const tbody = document.getElementById('kalenderEventBody');
    tbody.innerHTML = '';

    if (events.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px; color: #999;">Tidak ada event untuk bulan ini</td></tr>';
      return;
    }

    events.forEach(event => {
      const tipeColors = { kbm: '#388e3c', ujian: '#f57c00', acara: '#c2185b', libur: '#7b1fa2' };
      const tipeLabels = { kbm: 'KBM', ujian: 'Ujian', acara: 'Acara', libur: 'Libur' };
      const waktu = (event.pukul_mulai || '') + (event.pukul_selesai ? ' - ' + event.pukul_selesai : '');

      const row = document.createElement('tr');
      row.innerHTML = `
        <td style="padding: 12px; border: 1px solid #ddd;">${event.tanggal}</td>
        <td style="padding: 12px; border: 1px solid #ddd; font-weight: 500;">${event.judul_event}</td>
        <td style="padding: 12px; border: 1px solid #ddd;">
          <span style="background: ${tipeColors[event.tipe_event]}; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px;">${tipeLabels[event.tipe_event]}</span>
        </td>
        <td style="padding: 12px; border: 1px solid #ddd; font-size: 12px;">${waktu || '-'}</td>
        <td style="padding: 12px; border: 1px solid #ddd; font-size: 12px;">${event.lokasi || '-'}</td>
        <td style="padding: 12px; border: 1px solid #ddd; text-align: center;">
          <button class="btn btn-sm" onclick="window.editKalenderEvent('${event.id}')" style="padding: 4px 8px; margin-right: 4px;">Edit</button>
          <button class="btn btn-sm" onclick="window.deleteKalenderEvent('${event.id}')" style="padding: 4px 8px; background: #ef4444; color: white;">Hapus</button>
        </td>
      `;
      tbody.appendChild(row);
    });
  };

  window.openKalenderModal = function () {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('modalKalenderTitle').textContent = 'Tambah Event';
    document.getElementById('formKalenderTanggal').value = today;
    document.getElementById('formKalenderJudul').value = '';
    document.getElementById('formKalenderTipe').value = '';
    document.getElementById('formKalenderDeskripsi').value = '';
    document.getElementById('formKalenderLokasi').value = '';
    document.getElementById('formKalenderMulai').value = '';
    document.getElementById('formKalenderSelesai').value = '';
    document.getElementById('modalKalender').classList.add('active');
  };

  window.openKalenderModalForDate = function (dateStr) {
    document.getElementById('modalKalenderTitle').textContent = 'Tambah Event';
    document.getElementById('formKalenderTanggal').value = dateStr;
    document.getElementById('formKalenderJudul').value = '';
    document.getElementById('formKalenderTipe').value = '';
    document.getElementById('formKalenderDeskripsi').value = '';
    document.getElementById('formKalenderLokasi').value = '';
    document.getElementById('formKalenderMulai').value = '';
    document.getElementById('formKalenderSelesai').value = '';
    document.getElementById('modalKalender').classList.add('active');
  };

  window.closeKalenderModal = function () {
    document.getElementById('modalKalender').classList.remove('active');
  };

  window.saveKalenderForm = function (event) {
    event.preventDefault();

    const data = {
      kelompok_id: window.currentKelompokId,
      tanggal: document.getElementById('formKalenderTanggal').value,
      judul_event: document.getElementById('formKalenderJudul').value,
      deskripsi: document.getElementById('formKalenderDeskripsi').value,
      tipe_event: document.getElementById('formKalenderTipe').value,
      lokasi: document.getElementById('formKalenderLokasi').value,
      pukul_mulai: document.getElementById('formKalenderMulai').value,
      pukul_selesai: document.getElementById('formKalenderSelesai').value,
    };

    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          alert(result.message);
          window.closeKalenderModal();
          window.loadKalenderData();
        } else {
          alert('Error: ' + result.error);
        }
      })
      .serverCreateCalendarEvent(window.currentToken, data);
  };

  window.editKalenderEvent = function (eventId) {
    alert('Fitur edit event akan segera tersedia');
  };

  window.deleteKalenderEvent = function (eventId) {
    if (!confirm('Hapus event ini?')) return;

    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          alert(result.message);
          window.loadKalenderData();
        } else {
          alert('Error: ' + result.error);
        }
      })
      .serverDeleteCalendarEvent(window.currentToken, eventId);
  };

  window.prevMonth = function () {
    window.currentKalenderMonth.setMonth(window.currentKalenderMonth.getMonth() - 1);
    window.loadKalenderData();
  };

  window.nextMonth = function () {
    window.currentKalenderMonth.setMonth(window.currentKalenderMonth.getMonth() + 1);
    window.loadKalenderData();
  };

  /* ═════ PUSAT UNDUHAN FUNCTIONS ═════ */

  window.loadPustakUnduhScreen = function () {
    window.loadPustakUnduhFiles();
  };

  window.loadPustakUnduhFiles = function () {
    const kategori = document.getElementById('filterKategoriPustak').value;
    const search = document.getElementById('searchPustakUnduh').value;

    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          window.renderPustakUnduhTable(result.data);
        }
      })
      .serverGetFilesList(window.currentToken, kategori, search);

    // Load stats
    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          document.getElementById('pustakTotalFiles').textContent = result.data.total_files;
          document.getElementById('pustakTotalSize').textContent = result.data.total_size_mb + ' MB';
          document.getElementById('pustakTotalDownloads').textContent = result.data.downloads_total;
        }
      })
      .serverGetFileStats(window.currentToken);
  };

  window.renderPustakUnduhTable = function (data) {
    const tbody = document.getElementById('pustakUnduhTableBody');
    tbody.innerHTML = '';

    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: #999;">Tidak ada file</td></tr>';
      return;
    }

    data.forEach(file => {
      const kategoriColors = {
        'Modul': '#388e3c',
        'Soal': '#f57c00',
        'Dokumen': '#1976d2',
        'Pedoman': '#c2185b',
        'Lainnya': '#7b1fa2'
      };

      const row = document.createElement('tr');
      row.innerHTML = `
        <td style="padding: 12px; border: 1px solid #ddd; font-weight: 500;">
          <a href="${file.url}" target="_blank" style="color: #1976d2; text-decoration: none;">
            📄 ${file.nama_file}
          </a>
        </td>
        <td style="padding: 12px; border: 1px solid #ddd;">
          <span style="background: ${kategoriColors[file.kategori] || '#999'}; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px;">
            ${file.kategori}
          </span>
        </td>
        <td style="padding: 12px; border: 1px solid #ddd; font-size: 13px; max-width: 200px; overflow: hidden; text-overflow: ellipsis;">${file.deskripsi || '-'}</td>
        <td style="padding: 12px; border: 1px solid #ddd; text-align: center; font-size: 12px;">${file.ukuran_kb} KB</td>
        <td style="padding: 12px; border: 1px solid #ddd; text-align: center; font-weight: bold; color: #1976d2;">${file.download_count}</td>
        <td style="padding: 12px; border: 1px solid #ddd; font-size: 12px;">${file.pembuat_nama}</td>
        <td style="padding: 12px; border: 1px solid #ddd; text-align: center;">
          <a href="${file.url}" target="_blank" class="btn btn-sm" style="padding: 4px 8px; margin-right: 4px; color: white; background: #388e3c; text-decoration: none; border-radius: 4px;">Download</a>
          <button class="btn btn-sm" onclick="window.deletePustakUnduhFile('${file.id}')" style="padding: 4px 8px; background: #ef4444; color: white;">Hapus</button>
        </td>
      `;
      tbody.appendChild(row);
    });
  };

  window.openPustakUnduhModal = function () {
    document.getElementById('modalPustakTitle').textContent = 'Upload File Baru';
    document.getElementById('formPustakKategori').value = '';
    document.getElementById('formPustakNama').value = '';
    document.getElementById('formPustakDeskripsi').value = '';
    document.getElementById('formPustakUrl').value = '';
    document.getElementById('formPustakUkuran').value = '';
    document.getElementById('modalPustakUnduh').classList.add('active');
  };

  window.closePustakUnduhModal = function () {
    document.getElementById('modalPustakUnduh').classList.remove('active');
  };

  window.savePustakUnduhForm = function (event) {
    event.preventDefault();

    const data = {
      kategori: document.getElementById('formPustakKategori').value,
      nama_file: document.getElementById('formPustakNama').value,
      deskripsi: document.getElementById('formPustakDeskripsi').value,
      url_file: document.getElementById('formPustakUrl').value,
      ukuran_bytes: parseInt(document.getElementById('formPustakUkuran').value) || 0,
    };

    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          alert(result.message);
          window.closePustakUnduhModal();
          window.loadPustakUnduhFiles();
        } else {
          alert('Error: ' + result.error);
        }
      })
      .serverCreateFile(window.currentToken, data);
  };

  window.deletePustakUnduhFile = function (fileId) {
    if (!confirm('Hapus file ini dari Pusat Unduhan?')) return;

    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          alert(result.message);
          window.loadPustakUnduhFiles();
        } else {
          alert('Error: ' + result.error);
        }
      })
      .serverDeleteFile(window.currentToken, fileId);
  };

  // Close mobile sidebar when clicking outside
  document.addEventListener('click', function (event) {
    const sidebar = document.querySelector('.app-sidebar');
    const toggleBtn = document.querySelector('.sidebar-toggle-btn');

    if (window.innerWidth < 768 && sidebar.classList.contains('mobile-open')) {
      if (!sidebar.contains(event.target) && !toggleBtn.contains(event.target)) {
        sidebar.classList.remove('mobile-open');
      }
    }
  });

  // Close mobile sidebar when clicking menu item
  document.querySelectorAll('.sidebar-menu-link').forEach(link => {
    link.addEventListener('click', function () {
      if (window.innerWidth < 768) {
        const sidebar = document.querySelector('.app-sidebar');
        setTimeout(() => sidebar.classList.remove('mobile-open'), 100);
      }
    });
  });
</script>
