  /* ═════ AUTOCOMPLETE — saran instan dari data yang sudah pernah diinput ═════
     Pakai <datalist> native: browser menyaring saran secara instan saat
     mengetik & memunculkannya saat field diklik. Sumbernya gabungan data guru
     + generus yang sudah dimuat, jadi admin tidak perlu mengetik ulang. */
  window.fillDatalist_ = function (id, values) {
    const dl = document.getElementById(id);
    if (!dl) return;
    const seen = {};
    const uniq = [];
    values.forEach(v => {
      if (v === null || v === undefined) return;
      const t = String(v).trim();
      if (!t) return;
      const k = t.toLowerCase();
      if (seen[k]) return;
      seen[k] = true;
      uniq.push(t);
    });
    uniq.sort((a, b) => a.localeCompare(b, 'id'));
    dl.innerHTML = uniq.map(v => `<option value="${window.escapeHtmlExport_(v)}"></option>`).join('');
  };

  window.populateAutocomplete_ = function () {
    const g = window.lastGuruListData || [];
    const s = window.lastSantriListData || [];
    const both = g.concat(s);
    window.fillDatalist_('dlNama', both.map(x => x.nama));
    window.fillDatalist_('dlNamaOrtu', s.map(x => x.nama_ayah).concat(s.map(x => x.nama_ibu)));
    window.fillDatalist_('dlTempatLahir', both.map(x => x.tempat_lahir));
    window.fillDatalist_('dlKelurahan', both.map(x => x.kelurahan));
    window.fillDatalist_('dlKecamatan', both.map(x => x.kecamatan));
    window.fillDatalist_('dlKabupaten', both.map(x => x.kabupaten_kota));
    window.fillDatalist_('dlProvinsi', both.map(x => x.provinsi));
    window.fillDatalist_('dlKodePos', both.map(x => x.kode_pos));
    window.fillDatalist_('dlAlamat', both.map(x => x.alamat));

  window.showToast_ = function (msg) {

  window.hardRefresh_ = function () {
    const active = document.querySelector('.screen-wrapper.active');
    const id = active ? active.id : 'screenDashboard';
    window.showGlobalLoading_('Memuat ulang data...');

    // Spinner WAJIB tertutup walau ada loader yang tidak pernah memanggil
    // callback (mis. server error) — supaya tidak pernah menggantung.
    let closed = false;
    const finish = function (ok) {
      if (closed) return;
      closed = true;
      clearTimeout(safety);
      window.hideGlobalLoading_();
      if (ok !== false) window.showToast_('Data berhasil diperbarui');
    };
    const safety = setTimeout(function () { finish(true); }, 8000);

    try {
      if (id === 'screenGuruDashboard') {
        const kelompokId = window.currentKelompokId;
        if (!kelompokId) { finish(true); return; }
        const nama = window.currentKelompokName
          || document.getElementById('guruDashKelompokBadge').textContent || '';
        // Satu panggilan saja, menembus cache server (forceFresh) — sekali klik
        // langsung dapat data terbaru dari sheet.
        window.loadKelompokDashboard(kelompokId, nama, function () { finish(true); }, true);
        return;
      }

      const loader = window.SCREEN_LOADERS_[id];
      if (loader) loader();
      setTimeout(function () { finish(true); }, 700);
    } catch (e) {
      finish(false);
      alert('Gagal memuat ulang: ' + (e && e.message ? e.message : e));
    }
  };

  /* Parser tanggal fleksibel — menerima 3 bentuk yang bisa muncul:
     1. "YYYY-MM-DD" (string dari form)
     2. ISO datetime "YYYY-MM-DDTHH:MM:SS(.sssZ)" (objek Date sheet yang di-
        serialize google.script.run jadi string UTC)
     3. objek Date langsung
     Mengembalikan Date valid atau null. Ini akar bug "NaN / undefined". */
  window.parseDateFlexible_ = function (v) {
    if (!v) return null;
    if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
    let s = String(v).trim();
    if (!s) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) s = s + 'T00:00:00';
    const d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
  };

  /* Durasi rinci dari sebuah tanggal sampai HARI INI: "3 tahun 5 bulan 12 hari".
     Dipakai untuk Lama Mengajar. Selalu dihitung ulang saat ditampilkan supaya
     tidak pernah basi. */
  window.calcDurasiDetail_ = function (dateStr) {
    const start = window.parseDateFlexible_(dateStr);
    if (!start) return '';
    const now = new Date();
    if (start > now) return '0 hari';

    let y = now.getFullYear() - start.getFullYear();
    let m = now.getMonth() - start.getMonth();
    let d = now.getDate() - start.getDate();

    if (d < 0) {
      m -= 1;
      d += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
    }
    if (m < 0) { y -= 1; m += 12; }

    const parts = [];
    if (y > 0) parts.push(y + ' tahun');
    if (m > 0) parts.push(m + ' bulan');
    if (d > 0 || parts.length === 0) parts.push(d + ' hari');
    return parts.join(' ');
  };

  window.calcUsiaThn_ = function (tanggalLahir) {
    const birth = window.parseDateFlexible_(tanggalLahir);
    if (!birth) return '-';
    const today = new Date();
    let age = today.getFullYear() - birth.getFullYear();
    const monthDiff = today.getMonth() - birth.getMonth();
    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) age--;
    return age + ' Thn';
  };

  window.formatTanggalDisplay_ = function (dateStr) {
    const d = window.parseDateFlexible_(dateStr);
    if (!d) return '';
    const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    return `${d.getDate()} ${monthNames[d.getMonth()]} ${d.getFullYear()}`;
  };

  /** Normalisasi tanggal (bisa datang sbg objek Date dari Sheets) → 'YYYY-MM-DD' untuk
      value <input type="date">. Dipakai field "Mulai Ngaji". */
  window.toDateInputValue_ = function (dateStr) {
    const d = window.parseDateFlexible_(dateStr);
    if (!d) return '';
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  };

  // Hitung ulang KPI gender + breakdown jenjang + tabel generus dari array data.
  window.renderSantriKpis_ = function (santri) {
    const total = santri.length;

    const lakiLaki = santri.filter(s => String(s.gender).toUpperCase() === 'L').length;
    const perempuan = santri.filter(s => String(s.gender).toUpperCase() === 'P').length;
    const lPct = total > 0 ? Math.round((lakiLaki / total) * 100) : 0;
    const pPct = total > 0 ? Math.round((perempuan / total) * 100) : 0;

    document.getElementById('kdTotalSantri').textContent = total;
    document.getElementById('kdSantriL').textContent = lakiLaki;
    document.getElementById('kdSantriP').textContent = perempuan;
    document.getElementById('kdSantriLPct').textContent = lPct + '%';
    document.getElementById('kdSantriPPct').textContent = pPct + '%';
    document.getElementById('kdSantriLBar').style.width = lPct + '%';
    document.getElementById('kdSantriPBar').style.width = pPct + '%';

    const siapNikah = santri.filter(s => s.status_nikah === 'Siap Nikah');
    document.getElementById('kdSiapNikah').textContent = siapNikah.length;
    document.getElementById('kdSiapNikah_L').textContent = siapNikah.filter(s => String(s.gender).toUpperCase() === 'L').length;
    document.getElementById('kdSiapNikah_P').textContent = siapNikah.filter(s => String(s.gender).toUpperCase() === 'P').length;

    if (document.getElementById('santriDashTableWrapper').style.display !== 'none') {
      window.renderSantriDashTable_(santri, window.santriTableScope || 'all', window.santriDashSearchQuery || '');
    }

    const kelasMap = {
      'AUD': { total: 0, L: 0, P: 0 },
      'Cabe Rawit': { total: 0, L: 0, P: 0 },
      'Pra Remaja': { total: 0, L: 0, P: 0 },
      'Remaja SMA': { total: 0, L: 0, P: 0 },
      'Remaja': { total: 0, L: 0, P: 0 },
    };
    santri.forEach(s => {
      if (!kelasMap.hasOwnProperty(s.jenjang_saat_ini)) return;
      kelasMap[s.jenjang_saat_ini].total++;
      const g = String(s.gender).toUpperCase();
      if (g === 'L' || g === 'P') kelasMap[s.jenjang_saat_ini][g]++;
    });

    const kelasIds = {
      'AUD': 'kdKelasAUD',
      'Cabe Rawit': 'kdKelasCabeRawit',
      'Pra Remaja': 'kdKelasPraRemaja',
      'Remaja SMA': 'kdKelasRemajaSMA',
      'Remaja': 'kdKelasRemaja',
    };

    Object.keys(kelasMap).forEach(jenjang => {
      const { total: count, L, P } = kelasMap[jenjang];
      const pct = total > 0 ? Math.round((count / total) * 100) : 0;
      const baseId = kelasIds[jenjang];
      document.getElementById(baseId).textContent = count;
      document.getElementById(baseId + 'Pct').textContent = pct + '%';
      document.getElementById(baseId + 'Bar').style.width = pct + '%';
      document.getElementById(baseId + '_L').textContent = L;
      document.getElementById(baseId + '_P').textContent = P;
    });
  };

  window.applyGenerusMutationLocal_ = function (data, id, isDelete) {
    const list = window.lastSantriListData || (window.lastSantriListData = []);
    const idx = list.findIndex(x => String(x.id) === String(id));
    if (isDelete) {
      if (idx >= 0) list.splice(idx, 1);
    } else {
      const rec = Object.assign({}, idx >= 0 ? list[idx] : {}, data, { id: id, kelompok_id: window.currentKelompokId });
      if (idx >= 0) list[idx] = rec; else list.push(rec);
    }
    window.renderSantriKpis_(list);
    window.renderPendidikanFormalKpis_(list);
    window.refreshJadwalKelasSantriPanels_();
  };

  /* ═════ KEHADIRAN GENERUS (% per kategori Jadwal KBM, tab Operasional) ═════

     dikelompokkan lewat jadwal_kbm.kategori (BUKAN santri.jenjang_saat_ini,
     beda dari tab Monitoring terpisah). Pola interaksi sama seperti Jadwal
     KBM: 1 kartu per kategori, klik = expand jadi pill row kelas, klik
     kelas = tampil detail. */
  window.kgKatCollapsed_ = window.kgKatCollapsed_ || {};
  window.kgKelasSelected_ = window.kgKelasSelected_ || {};
  window.lastKehadiranGenerusData_ = [];

  window.loadKelompokDashboardAbsen_ = function (kelompokId) {
    const now = new Date();
    google.script.run
      .withSuccessHandler(function (result) {
        if (!result.success) return;
        window.lastKehadiranGenerusData_ = result.data;
        window.renderKehadiranGenerusGrid_(result.data);
      })
      .serverGetKehadiranGenerusKategori(window.currentToken, kelompokId, now.getFullYear(), now.getMonth() + 1);
  };

  window.renderKehadiranGenerusGrid_ = function (data) {
    const grid = document.getElementById('kgKategoriGrid');
    grid.innerHTML = '';
    const ic = window.JADWAL_ICONS_;

    // Kalau ada satu kategori sedang dibuka, kategori lain disembunyikan
    // total (pola sama persis dgn Jadwal KBM di atas).
    const expandedKat = data.find(function (d) { return window.kgKatCollapsed_[d.kategori] === false; });

    data.forEach(function (d) {
      if (expandedKat && d.kategori !== expandedKat.kategori) return;

      const selectedKelas = window.kgKelasSelected_[d.kategori];
      const selectedInfo = d.kelasList.find(function (k) { return k.kelas === selectedKelas; });

      const pillRowHtml = d.kelasList.length === 0
        ? '<div class="jadwal-kat-empty">Belum ada kelas di kategori ini (atur di Jadwal KBM).</div>'
        : '<div class="jadwal-kelas-pill-row">' + d.kelasList.map(function (k) {
            return `<button type="button" class="jadwal-kelas-pill${k.kelas === selectedKelas ? ' active' : ''}" onclick="window.toggleKgKelasSelect_('${d.kategori}', ${JSON.stringify(k.kelas)})">
              ${k.kelas}<span class="kg-pill-pct kg-warna-${k.warna}">${k.adaData ? k.avgPct + '%' : '–'}</span>
            </button>`;
          }).join('') + '</div>';

      const bodyHtml = pillRowHtml + (selectedInfo ? window.renderKgKelasDetailHtml_(selectedInfo) : '');
      const isCollapsed = window.kgKatCollapsed_[d.kategori] !== false;

      const card = document.createElement('div');
      card.className = 'jadwal-kat-card kg-kat-card' + (isCollapsed ? ' collapsed' : ' jadwal-kat-full');
      card.innerHTML = `
        <button type="button" class="jadwal-kat-header" onclick="window.toggleKgKatCollapse_('${d.kategori}')">
          <span class="kg-kat-head-left">
            <span class="kg-kat-pct kg-warna-${d.warna}">${d.avgPct !== null ? d.avgPct + '%' : '–'}</span>
            <span class="jadwal-kat-title">${d.kategori}</span>
          </span>
          <span class="jadwal-kat-header-right">
            <span class="jadwal-kat-count">${d.jumlahKelas} kelas &middot; ${d.jumlahSantri} santri</span>
            ${ic.caret}
          </span>
        </button>
        <div class="jadwal-kat-body">${bodyHtml}</div>
      `;
      grid.appendChild(card);
    });
  };

  window.toggleKgKatCollapse_ = function (kategori) {
    const isCollapsed = window.kgKatCollapsed_[kategori] !== false;
    (window.lastKehadiranGenerusData_ || []).forEach(function (d) { window.kgKatCollapsed_[d.kategori] = true; });
    window.kgKatCollapsed_[kategori] = isCollapsed ? false : true;
    window.renderKehadiranGenerusGrid_(window.lastKehadiranGenerusData_ || []);
  };

  window.toggleKgKelasSelect_ = function (kategori, kelas) {
    window.kgKelasSelected_[kategori] = window.kgKelasSelected_[kategori] === kelas ? null : kelas;
    window.renderKehadiranGenerusGrid_(window.lastKehadiranGenerusData_ || []);
  };

  window.renderKgKelasDetailHtml_ = function (k) {
    const ic = window.JADWAL_ICONS_;
    return `
      <div class="jadwal-detail-panel">
        <div class="jadwal-detail-header">
          <span class="jadwal-santri-title">Kehadiran Kelas ${k.kelas} &mdash; Bulan Ini</span>
        </div>
        <div class="jadwal-info-row">
          <div class="jadwal-info-card">
            <div class="jadwal-info-label">% Kehadiran</div>
            <div class="jadwal-info-value kg-warna-${k.warna}">${k.adaData ? k.avgPct + '%' : 'Belum ada data'}</div>
          </div>
          <div class="jadwal-info-card">
            <div class="jadwal-info-label">${ic.santri} Total Santri</div>
            <div class="jadwal-info-value">${k.jumlahSantri} Santri</div>
          </div>
          <div class="jadwal-info-card">
            <div class="jadwal-info-label">${ic.guru} Guru</div>
            <div class="jadwal-info-value">${window.namaPanggilanGuru_(k.namaGuru)}</div>
          </div>
          <div class="jadwal-info-card">
            <div class="jadwal-info-label">${ic.ruangan} Ruangan &amp; Jam</div>
            <div class="jadwal-info-value-row">
              <span class="jadwal-info-value">${k.ruangan || '–'}</span>
              <span class="jadwal-info-subvalue">${k.jamMulai && k.jamSelesai ? k.jamMulai + ' - ' + k.jamSelesai : ''}</span>
            </div>
          </div>
        </div>
      </div>
    `;
  };

  window.loadKelompokDashboardJadwal_ = function (kelompokId) {
    // Kegagalan WAJIB terlihat: sebelumnya error ditelan diam-diam (return kosong)
    // sehingga UI berhenti di "Memuat..." tanpa petunjuk apa pun.
    const showJadwalError = function (pesan) {
      document.getElementById('kdJadwalList').innerHTML =
        '<div style="text-align: center; padding: 40px; color: var(--red);">Gagal memuat jadwal: ' + pesan + '</div>';
    };

    google.script.run
      .withSuccessHandler(function (result) {
        if (!result || !result.success) {
          showJadwalError((result && result.error) || 'respons tidak valid.');
          return;
        }
        window.lastJadwalListData = result.data;
        window.renderJadwalKBMList_(result.data);
      })
      .withFailureHandler(function (err) {
        showJadwalError(err && err.message ? err.message : String(err));
      })
      .serverGetJadwalKBM(window.currentToken, kelompokId);
  };

  /** Urutan kategori tampil — samakan dengan KATEGORI_JADWAL_ di backend. */
  window.KATEGORI_JADWAL_UI_ = ['Cabe Rawit', 'Pra Remaja SMP', 'Remaja SMA', 'Muda-Mudi'];
  window.HARI_URUTAN_UI_ = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];

  /** Status buka/tutup tiap kartu kategori (default TERTUTUP saat pertama masuk dashboard,
      supaya tidak langsung panjang), dipertahankan lintas render ulang selama sesi.
      Nilai eksplisit `false` = terbuka; undefined/true = tertutup. */
  window.jadwalKatCollapsed_ = window.jadwalKatCollapsed_ || {};

  /** Cache hari aktif per kategori: { '<kategori>': ['Senin', 'Selasa', ...] }. */
  window.lastJadwalHariAktifData_ = window.lastJadwalHariAktifData_ || {};

  /** '(Senin,Selasa,Rabu,Kamis,Jumat)' → "Senin - Jumat (5x Seminggu)"; hari tak berurutan
      ditulis satu-satu (mis. "Selasa - Kamis - Jumat"). */
  window.formatHariAktifLabel_ = function (hari) {
    if (!hari || hari.length === 0) return 'Belum diatur';
    const idxs = hari.map(h => window.HARI_URUTAN_UI_.indexOf(h)).filter(i => i !== -1).sort((a, b) => a - b);
    if (idxs.length === 0) return 'Belum diatur';
    const isContiguous = idxs.every((v, i) => i === 0 || v === idxs[i - 1] + 1);
    const names = idxs.map(i => window.HARI_URUTAN_UI_[i]);
    const label = (isContiguous && names.length > 1) ? `${names[0]} - ${names[names.length - 1]}` : names.join(' - ');
    return `${label} (${names.length}x Seminggu)`;
  };

  window.loadJadwalKategoriHari_ = function (kelompokId) {
    google.script.run
      .withSuccessHandler(function (result) {
        if (!result || !result.success) return;
        window.lastJadwalHariAktifData_ = result.data || {};
        window.renderJadwalKBMList_(window.lastJadwalListData || []);
      })
      .withFailureHandler(function () { /* kartu hari aktif tampil 'Belum diatur' — tidak fatal */ })
      .serverGetJadwalKategoriHari(window.currentToken, kelompokId);
  };

  /** Isi dropdown filter Guru dari data guru Kelompok yang sedang aktif, pertahankan pilihan saat ini. */
  window.populateJadwalKbmFilterGuru_ = function () {
    const select = document.getElementById('jadwalKbmFilterGuru');
    if (!select) return;
    const current = select.value;
    const guruList = window.lastGuruListData || [];
    select.innerHTML = '<option value="">Semua Guru</option>' +
      guruList.map(g => `<option value="${g.id}">${g.nama}</option>`).join('');
    select.value = current;
  };

  /** Render ulang saja (baca filter dari toolbar) — dipanggil onchange/oninput toolbar. */
  window.applyJadwalKbmFilter_ = function () {
    window.renderJadwalKBMList_(window.lastJadwalListData || []);
  };

  /** Kartu ringkasan (Total Kelas/Guru/Santri/Jam Operasional) — dihitung dari kelas berstatus Aktif saja. */
  window.renderJadwalKbmSummary_ = function (data) {
    const aktif = data.filter(j => (j.status || 'Aktif') === 'Aktif');
    document.getElementById('jkKpiTotalKelas').textContent = aktif.length;

    const guruUnik = {};
    aktif.forEach(j => { if (j.guru_id) guruUnik[j.guru_id] = true; });
    document.getElementById('jkKpiTotalGuru').textContent = Object.keys(guruUnik).length;

    const totalSantri = aktif.reduce((sum, j) => sum + (Number(j.santri_count) || 0), 0);
    document.getElementById('jkKpiTotalSantri').textContent = totalSantri;

    const jamMulaiList = aktif.map(j => j.jam_mulai).filter(Boolean).sort();
    const jamSelesaiList = aktif.map(j => j.jam_selesai).filter(Boolean).sort();
    document.getElementById('jkKpiJamOperasional').textContent = jamMulaiList.length
      ? `${jamMulaiList[0]} - ${jamSelesaiList[jamSelesaiList.length - 1]}`
      : '–';
  };

  /** Render ulang daftar Jadwal KBM dari array data (dipakai loader server & update lokal instan).
      Jadwal umum per kategori jenjang, tampil sebagai kolom berdampingan — tanpa tanggal. */
  /** Ikon inline (line-style, bukan gambar asli) dipakai panel detail kelas & pill kelas. */
  window.JADWAL_ICONS_ = {
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    delete: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
    caret: '<svg class="jadwal-kat-caret-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
    guru: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>',
    santri: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    ruangan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v3"/><circle cx="12" cy="4.3" r=".6" fill="currentColor" stroke="none"/><path d="M8 8.5a4 4 0 0 1 8 0V11H8V8.5z"/><path d="M4 21v-6.5a2 2 0 0 1 2-2h1"/><path d="M20 21v-6.5a2 2 0 0 1-2-2h-1"/><path d="M9 21v-4a3 3 0 0 1 6 0v4"/><path d="M2 21h20"/></svg>',
    jadwal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
  };

  /** "Kak <nama depan>" — julukan akrab guru di panel detail kelas (bukan nama lengkap). */
  window.namaPanggilanGuru_ = function (namaLengkap) {
    const depan = String(namaLengkap || '').trim().split(/\s+/)[0];
    return depan ? 'Kak ' + depan : '(guru tidak ditemukan)';
  };

  /** Kelas yang sedang dibuka detailnya per kategori: { '<kategori>': '<jadwalId>' }. */
  window.jadwalKelasSelected_ = window.jadwalKelasSelected_ || {};

  /** Toggle pilihan kelas dalam satu kategori — klik ulang pill yang sama menutupnya. */
  window.toggleJadwalKelasSelect_ = function (kategori, jadwalId) {
    window.jadwalKelasSelected_[kategori] = window.jadwalKelasSelected_[kategori] === jadwalId ? null : jadwalId;
    window.renderJadwalKBMList_(window.lastJadwalListData || []);
  };

  /** Santri satu kelas: dicocokkan dari field bebas `kelas_ngaji` milik generus (case-insensitive). */
  window.cariSantriKelas_ = function (kelasNama) {
    const target = String(kelasNama || '').trim().toLowerCase();
    if (!target) return [];
    return (window.lastSantriListData || []).filter(s => String(s.kelas_ngaji || '').trim().toLowerCase() === target);
  };

  /** Kelas yang sedang dipilihkan santri lewat modal Pilih Santri. */
  window.currentPilihSantriKelas_ = '';

  /** Buka modal "Pilih Santri" — assign generus yang SUDAH ada di Data Master ke kelas ini
      (bukan bikin data generus baru), sesuai permintaan: tinggal ambil dari yang sudah tersimpan. */
  window.openModalPilihSantriKelas_ = function (kelasNama) {
    window.currentPilihSantriKelas_ = kelasNama;
    document.getElementById('pilihSantriKelasNama').value = kelasNama;
    document.getElementById('modalPilihSantriKelasTitle').textContent = 'Tambah Santri — Kelas ' + kelasNama;
    document.getElementById('pilihSantriSearchInput').value = '';
    window.renderPilihSantriList_();
    document.getElementById('modalPilihSantriKelas').classList.add('active');
  };

  window.closeModalPilihSantriKelas = function () {
    document.getElementById('modalPilihSantriKelas').classList.remove('active');
  };

  /** Render daftar generus yang sudah ada (filter nama) untuk dipilih masuk ke kelas ini. */
  window.renderPilihSantriList_ = function () {
    const container = document.getElementById('pilihSantriList');
    const search = (document.getElementById('pilihSantriSearchInput').value || '').trim().toLowerCase();
    const kelasNama = window.currentPilihSantriKelas_;
    const kelasNamaLower = String(kelasNama).trim().toLowerCase();

    const list = (window.lastSantriListData || [])
      .filter(s => !search || String(s.nama || '').toLowerCase().includes(search))
      .sort((a, b) => String(a.nama || '').localeCompare(String(b.nama || ''), 'id'));

    container.innerHTML = list.length === 0
      ? '<div style="text-align: center; padding: 24px; color: var(--text-faint);">Tidak ada generus ditemukan.</div>'
      : list.map(s => {
        const sudah = String(s.kelas_ngaji || '').trim().toLowerCase() === kelasNamaLower;
        const meta = [s.jenjang_saat_ini, s.kelas_ngaji].filter(Boolean).join(' · ');
        return `
          <div class="pilih-santri-row">
            <div class="pilih-santri-info">
              <span class="pilih-santri-nama">${s.nama}</span>
              ${meta ? `<span class="pilih-santri-meta">${meta}</span>` : ''}
            </div>
            ${sudah
              ? '<span class="pilih-santri-sudah">Sudah di kelas ini</span>'
              : `<button type="button" class="pilih-santri-add-btn" onclick='window.assignSantriToKelas_(${JSON.stringify(String(s.id))}, ${JSON.stringify(kelasNama)})'>+ Tambahkan</button>`}
          </div>
        `;
      }).join('');
  };

  /** Set kelas_ngaji satu generus yang SUDAH ada ke kelas ini (bukan bikin generus baru). */
  window.assignSantriToKelas_ = function (santriId, kelasNama) {
    const s = (window.lastSantriListData || []).find(x => String(x.id) === String(santriId));
    if (!s) return;

    window.showGlobalLoading_('Menambahkan santri...');
    google.script.run
      .withSuccessHandler(function (result) {
        window.hideGlobalLoading_();
        if (!result.success) { alert(result.error); return; }
        s.kelas_ngaji = kelasNama;
        window.renderPilihSantriList_();
        window.renderJadwalKBMList_(window.lastJadwalListData || []);
      })
      .withFailureHandler(function (err) {
        window.hideGlobalLoading_();
        alert('Gagal terhubung ke server: ' + (err && err.message ? err.message : err));
      })
      .serverUpdateSantri(window.currentToken, window.currentKelompokId, santriId, { kelas_ngaji: kelasNama });
  };

  /** Slug aman-untuk-id dari nama kategori (mis. "Cabe Rawit" → "cabe_rawit"). */
  window.jadwalKatSlug_ = function (kat) {
    return String(kat || '').toLowerCase().replace(/[^a-z0-9]+/g, '_');
  };

  /** Baris <tr> tabel santri dari satu array santri (dipakai render awal & saat pencarian). */
  window.buildSantriRowsHtml_ = function (santri) {
    return santri.length === 0
      ? '<tr><td colspan="7" style="text-align: center; padding: 24px; color: var(--text-faint);">Belum ada santri di kelas ini.</td></tr>'
      : santri.map((s, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${s.nama}</td>
          <td>${s.gender || '-'}</td>
          <td>${s.kelas_sekolah || '-'}</td>
          <td>${s.kelas_ngaji || '-'}</td>
          <td>${window.formatTanggalDisplay_(s.mulai_ngaji) || '-'}</td>
          <td style="text-align: center;">
            <div class="jadwal-row-actions" style="justify-content: center;">
              <button class="jadwal-row-icon-btn" title="Edit" onclick="window.editGenerusKelp('${s.id}')">${window.JADWAL_ICONS_.edit}</button>
              <button class="jadwal-row-icon-btn danger" title="Hapus" onclick="window.deleteGenerusKelp('${s.id}')">${window.JADWAL_ICONS_.delete}</button>
            </div>
          </td>
        </tr>
      `).join('');
  };

  /** Render ulang HANYA isi tabel santri kelas terpilih (dipakai saat mengetik pencarian,
      supaya fokus input tidak hilang — tidak menulis ulang seluruh daftar Jadwal KBM). */
  window.renderJadwalKelasSantriTableBody_ = function (kat) {
    const slug = window.jadwalKatSlug_(kat);
    const tbody = document.getElementById('jadwalKelasSantriTableBody_' + slug);
    if (!tbody) return;

    const kelasNama = tbody.dataset.kelas;
    const searchEl = document.getElementById('jadwalKelasSantriSearch_' + slug);
    const search = (searchEl ? searchEl.value : '').trim().toLowerCase();
    const santri = window.cariSantriKelas_(kelasNama).filter(s => !search || String(s.nama || '').toLowerCase().includes(search));

    tbody.innerHTML = window.buildSantriRowsHtml_(santri);
  };

  /** Refresh tabel santri di semua panel kelas yang sedang terbuka — dipanggil setelah
      generus ditambah/diubah/dihapus supaya daftar santri per kelas ikut ter-update. */
  window.refreshJadwalKelasSantriPanels_ = function () {
    Object.keys(window.jadwalKelasSelected_).forEach(function (kat) {
      if (window.jadwalKelasSelected_[kat]) window.renderJadwalKelasSantriTableBody_(kat);
    });
  };

  /** Roster santri per kelas terbuka/tertutup (default TERTUTUP, sama seperti pola
      "Daftar Guru"/"Daftar Generus"): { '<slug kategori>': true|false }. */
  window.jadwalSantriRosterOpen_ = window.jadwalSantriRosterOpen_ || {};

  /** Buka/tutup roster santri satu kelas TANPA render ulang seluruh panel (supaya kotak
      pencarian & state lain tidak ikut ter-reset) — langsung toggle style.display. */
  window.toggleJadwalSantriRoster_ = function (kat) {
    const slug = window.jadwalKatSlug_(kat);
    const wrap = document.getElementById('jadwalSantriWrapper_' + slug);
    const btn = document.getElementById('jadwalSantriToggleBtn_' + slug);
    if (!wrap) return;
    const isOpening = wrap.style.display === 'none';
    wrap.style.display = isOpening ? 'block' : 'none';
    window.jadwalSantriRosterOpen_[slug] = isOpening;
    if (btn) btn.classList.toggle('active-state', isOpening);
  };

  /** Panel detail satu kelas: header (judul + aksi) → 4 kartu info (guru/santri/ruangan/jadwal)
      → roster santri (toggle-able, tersembunyi default). */
  window.renderJadwalKelasDetailHtml_ = function (kat, j) {
    const santri = window.cariSantriKelas_(j.kelas);
    const totalL = santri.filter(s => s.gender === 'L').length;
    const totalP = santri.filter(s => s.gender === 'P').length;
    const ic = window.JADWAL_ICONS_;
    const statusVal = j.status || 'Aktif';
    const slug = window.jadwalKatSlug_(kat);
    const rosterOpen = !!window.jadwalSantriRosterOpen_[slug];

    const idJson = JSON.stringify(String(j.id));
    const kategoriJson = JSON.stringify(j.kategori);
    const guruIdJson = JSON.stringify(String(j.guru_id));
    const kelasJson = JSON.stringify(j.kelas);
    const jamMulaiJson = JSON.stringify(j.jam_mulai);
    const jamSelesaiJson = JSON.stringify(j.jam_selesai);
    const ruanganJson = JSON.stringify(j.ruangan);

  window.renderJadwalKBMList_ = function (data) {
    window.populateJadwalKbmFilterGuru_();
    window.renderJadwalKbmSummary_(data);

    const list = document.getElementById('kdJadwalList');
    list.innerHTML = '';

    const ic = window.JADWAL_ICONS_;

    const searchStr = (document.getElementById('jadwalKbmSearchInput').value || '').trim().toLowerCase();
    const filterGuru = document.getElementById('jadwalKbmFilterGuru').value;
    const filterStatus = document.getElementById('jadwalKbmFilterStatus').value;

    // Kategori baku selalu tampil (walau kosong) supaya struktur jenjang terlihat.
    // Entri lama tanpa kategori masuk bucket "Lainnya" agar tidak hilang diam-diam.
    const kategoriList = window.KATEGORI_JADWAL_UI_.slice();
    if (data.some(j => kategoriList.indexOf(j.kategori) === -1)) kategoriList.push('Lainnya');

    const grid = document.createElement('div');
    grid.className = 'jadwal-kat-grid';

    // Kalau ada satu kategori sedang dibuka, kategori lain disembunyikan total
    // (bukan cuma diciutkan) supaya pill kelas & panel detail jadi satu-satunya
    // yang terlihat — bukan tersusun di bawah kategori lain yang masih tampil.
    const expandedKat = kategoriList.find(k => window.jadwalKatCollapsed_[k] === false);

    kategoriList.forEach(kat => {
      if (expandedKat && kat !== expandedKat) return;

      const sesi = data
        .filter(j => (kat === 'Lainnya' ? window.KATEGORI_JADWAL_UI_.indexOf(j.kategori) === -1 : j.kategori === kat))
        .filter(j => !searchStr || String(j.kelas || '').toLowerCase().includes(searchStr))
        .filter(j => !filterGuru || String(j.guru_id) === String(filterGuru))
        .filter(j => !filterStatus || (j.status || 'Aktif') === filterStatus)
        .sort((a, b) => String(a.jam_mulai || '').localeCompare(String(b.jam_mulai || '')));

      const selectedId = window.jadwalKelasSelected_[kat];
      const selectedSesi = sesi.find(j => String(j.id) === String(selectedId));

      const pillRowHtml = sesi.length === 0
        ? '<div class="jadwal-kat-empty">Belum ada jadwal</div>'
        : '<div class="jadwal-kelas-pill-row">' + sesi.map(j => `
            <button type="button" class="jadwal-kelas-pill${String(j.id) === String(selectedId) ? ' active' : ''}" onclick="window.toggleJadwalKelasSelect_('${kat}', '${j.id}')">${j.kelas}</button>
          `).join('') + '</div>';

      const rowsHtml = pillRowHtml + (selectedSesi ? window.renderJadwalKelasDetailHtml_(kat, selectedSesi) : '');

      const isCollapsed = window.jadwalKatCollapsed_[kat] !== false;
      const hariAktif = window.lastJadwalHariAktifData_[kat] || [];

      const card = document.createElement('div');
      card.className = 'jadwal-kat-card' + (isCollapsed ? ' collapsed' : ' jadwal-kat-full');
      card.innerHTML = `
        <button type="button" class="jadwal-kat-header" onclick="window.toggleJadwalKatCollapse_('${kat}')">
          <span class="jadwal-kat-title">${kat}</span>
          <span class="jadwal-kat-header-right">
            <span class="jadwal-kat-count">${sesi.length} kelas</span>
            ${ic.caret}
          </span>
        </button>
        <button type="button" class="jadwal-hari-row" title="Atur hari aktif ${kat}" onclick="window.openModalJadwalHariAktif('${kat}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
          <span>${window.formatHariAktifLabel_(hariAktif)}</span>
        </button>
        <div class="jadwal-kat-body">${rowsHtml}</div>
      `;

      grid.appendChild(card);
    });

    list.appendChild(grid);
  };

  /** Buka/tutup daftar sesi satu kartu kategori — hanya satu kategori boleh terbuka
      sekaligus, jadi kategori lain otomatis diciutkan (disembunyikan total saat render). */
  window.toggleJadwalKatCollapse_ = function (kategori) {
    const isCollapsed = window.jadwalKatCollapsed_[kategori] !== false;
    window.KATEGORI_JADWAL_UI_.concat(['Lainnya']).forEach(k => { window.jadwalKatCollapsed_[k] = true; });
    window.jadwalKatCollapsed_[kategori] = isCollapsed ? false : true;
    window.renderJadwalKBMList_(window.lastJadwalListData || []);
  };

  window.openModalJadwalHariAktif = function (kategori) {
    document.getElementById('jadwalHariAktifKategori').value = kategori;
    document.getElementById('modalJadwalHariAktifTitle').textContent = 'Hari Aktif — ' + kategori;
    const selected = window.lastJadwalHariAktifData_[kategori] || [];
    window.HARI_URUTAN_UI_.forEach(h => {
      const cb = document.getElementById('jhaHari_' + h);
      if (cb) cb.checked = selected.indexOf(h) !== -1;
    });
    document.getElementById('modalJadwalHariAktif').classList.add('active');
  };

  window.closeModalJadwalHariAktif = function () {
    document.getElementById('modalJadwalHariAktif').classList.remove('active');
  };

  window.saveJadwalHariAktif = function () {
    const kategori = document.getElementById('jadwalHariAktifKategori').value;
    const hariAktif = window.HARI_URUTAN_UI_.filter(h => {
      const cb = document.getElementById('jhaHari_' + h);
      return cb && cb.checked;
    });

    window.showGlobalLoading_('Menyimpan...');
    google.script.run
      .withSuccessHandler(function (result) {
        window.hideGlobalLoading_();
        if (!result.success) { alert(result.error); return; }
        window.lastJadwalHariAktifData_[kategori] = hariAktif;
        window.closeModalJadwalHariAktif();
        window.renderJadwalKBMList_(window.lastJadwalListData || []);
      })
      .withFailureHandler(function (err) {
        window.hideGlobalLoading_();
        alert('Gagal terhubung ke server: ' + (err && err.message ? err.message : err));
      })
      .serverSaveJadwalKategoriHari(window.currentToken, window.currentKelompokId, kategori, hariAktif);
  };

  /** Tambah/ubah/hapus satu entri Jadwal KBM di cache lokal lalu render ulang — tanpa fetch ulang ke server (instan). */
  window.applyJadwalKBMMutationLocal_ = function (data, id, isDelete) {
    const list = window.lastJadwalListData || (window.lastJadwalListData = []);
    const idx = list.findIndex(x => String(x.id) === String(id));
    if (isDelete) {
      if (idx >= 0) list.splice(idx, 1);
    } else {
      const guru = (window.lastGuruListData || []).find(g => String(g.id) === String(data.guru_id));
      const rec = Object.assign({}, idx >= 0 ? list[idx] : {}, data, {
        id: id,
        kelompok_id: window.currentKelompokId,
        guru_nama: guru ? guru.nama : '(guru tidak ditemukan)',
      });
      if (idx >= 0) list[idx] = rec; else list.push(rec);
    }
    window.renderJadwalKBMList_(list);
  };

  /** Isi dropdown Guru di modal Jadwal KBM dari data guru Kelompok yang sedang aktif (sudah dimuat window.lastGuruListData). */
  window.populateJadwalKBMGuruSelect_ = function (selectedGuruId) {
    const select = document.getElementById('jadwalKBMGuru');

  window.editJadwalKBM = function (id, kategori, guruId, kelas, jamMulai, jamSelesai, ruangan, keterangan, santriCount, status) {
    document.getElementById('modalJadwalKBMTitle').textContent = 'Edit Jadwal KBM';

  /** 'HH:mm' → menit sejak 00:00, dipakai cek overlap jam. */
  window.jamKeMenit_ = function (jam) {
    const parts = String(jam || '').split(':');
    return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
  };

  /** Cek guru yang sama sudah punya sesi lain yang jamnya overlap. Kalau kategori sesi
      lama & baru sama-sama punya hari aktif yang diatur DAN tidak beririsan hari, tidak
      dianggap bentrok (guru bisa ngajar 2 kelas beda hari). Kalau salah satu hari aktif
      belum diatur, tetap diwaspadai (return pesan) supaya admin yang memutuskan.
      Return string pesan kalau ada indikasi bentrok, atau null kalau aman. */
  window.cekKonflikJadwalGuru_ = function (editId, guruId, kategori, jamMulai, jamSelesai) {
    if (!guruId || !jamMulai || !jamSelesai) return null;
    const mulaiBaru = window.jamKeMenit_(jamMulai);
    const selesaiBaru = window.jamKeMenit_(jamSelesai);
    const hariBaru = window.lastJadwalHariAktifData_[kategori] || [];

    const lain = (window.lastJadwalListData || []).find(function (j) {
      if (String(j.id) === String(editId)) return false;
      if (String(j.guru_id) !== String(guruId)) return false;
      const mulaiLama = window.jamKeMenit_(j.jam_mulai);
      const selesaiLama = window.jamKeMenit_(j.jam_selesai);
      const overlapJam = mulaiBaru < selesaiLama && mulaiLama < selesaiBaru;
      if (!overlapJam) return false;
      const hariLama = window.lastJadwalHariAktifData_[j.kategori] || [];
      if (hariBaru.length && hariLama.length) {
        const overlapHari = hariBaru.some(function (h) { return hariLama.indexOf(h) !== -1; });
        if (!overlapHari) return false;
      }
      return true;
    });

    if (!lain) return null;
    return `⚠️ Guru ${lain.guru_nama} sudah mengajar ${lain.jam_mulai}-${lain.jam_selesai} di kelas ${lain.kelas} (${lain.kategori}) pada hari yang sama.`;
  };

  window.saveJadwalKBM = function () {
    const id = document.getElementById('jadwalKBMId').value;
    const kategori = document.getElementById('jadwalKBMKategori').value;
    const guru_id = document.getElementById('jadwalKBMGuru').value;
    const kelas = document.getElementById('jadwalKBMKelas').value.trim();
    const jam_mulai = document.getElementById('jadwalKBMJamMulai').value;
    const jam_selesai = document.getElementById('jadwalKBMJamSelesai').value;
    const ruangan = document.getElementById('jadwalKBMRuangan').value.trim();
    const santri_count = document.getElementById('jadwalKBMSantriCount').value.trim();
    const status = document.getElementById('jadwalKBMStatus').value;
    const keterangan = document.getElementById('jadwalKBMKeterangan').value.trim();

    if (!kategori || !guru_id || !kelas || !jam_mulai || !jam_selesai || !ruangan) {
      alert('Kategori, guru, kelas, jam mulai, jam selesai, dan ruangan wajib diisi.');
      return;
    }

    const konflik = window.cekKonflikJadwalGuru_(id, guru_id, kategori, jam_mulai, jam_selesai);
    if (konflik && !confirm(konflik + '\n\nLanjutkan simpan?')) return;

    const data = { kategori, guru_id, kelas, jam_mulai, jam_selesai, ruangan, santri_count: santri_count === '' ? 0 : Number(santri_count), status, keterangan };

    const onDone = function (result) {
      window.hideGlobalLoading_();
      if (result.success) {
        window.closeModalJadwalKBM();
        // Tampilkan instan (tanpa fetch ulang) — kartu langsung muncul/berubah di daftar.
        window.applyJadwalKBMMutationLocal_(data, id || result.id, false);
      } else {
        alert(result.error);
      }
    };
    const onFail = function (err) {
      window.hideGlobalLoading_();
      alert('Gagal terhubung ke server: ' + (err && err.message ? err.message : err));
    };

    window.showGlobalLoading_('Menyimpan jadwal...');
    if (id) {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).serverUpdateJadwalKBM(window.currentToken, id, data);
    } else {
      google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).serverCreateJadwalKBM(window.currentToken, Object.assign({ kelompok_id: window.currentKelompokId }, data));
    }
  };

  window.deleteJadwalKBM = function (id) {
    if (!confirm('Hapus jadwal ini?')) return;

    window.showGlobalLoading_('Menghapus jadwal...');
    google.script.run
      .withSuccessHandler(function (result) {
        window.hideGlobalLoading_();
        if (result.success) {
          window.applyJadwalKBMMutationLocal_(null, id, true);
        } else {
          alert(result.error);
        }
      })
      .withFailureHandler(function (err) {
        window.hideGlobalLoading_();
        alert('Gagal terhubung ke server: ' + (err && err.message ? err.message : err));
      })
      .serverDeleteJadwalKBM(window.currentToken, id);
  };

  window.loadKelompokDashboardPengumuman_ = function (kelompokId) {

      .withSuccessHandler(function (result) {

        window.lastPengumumanListData_ = result.data;
        window.renderPengumumanList_(result.data);
      })
      .serverGetPengumuman(window.currentToken, kelompokId);

  /** Grup & sub-kategori kartu Pengumuman — tambah entri baru di sini kalau ada kategori baru ke depan.
      Samakan daftar sub-kategori dengan KATEGORI_PENGUMUMAN_ di Modul_MaintainPengumuman.gs. */
  window.PENGUMUMAN_KATEGORI_GROUPS_ = [
    { title: 'Pengumuman KBM', items: ['Caberawit', 'Pra Remaja & Remaja SMA', 'Muda Mudi'] },
    { title: 'Musyawarah', items: ['Pra 5 Unsur', '5 Unsur', 'Khusus'] },
  ];

  /** Status buka/tutup tiap kartu sub-kategori pengumuman (default TERTUTUP), lintas render ulang selama sesi. */
  window.pengumumanKatCollapsed_ = window.pengumumanKatCollapsed_ || {};

  /** Render ulang daftar Pengumuman dari array data — dikelompokkan jadi kartu per sub-kategori,
      mengikuti pola visual Jadwal KBM (kartu bisa dibuka/tutup, tombol "+ Buat" ada di dalam kartu). */
  window.renderPengumumanList_ = function (data) {
    const container = document.getElementById('kdPengumumanList');
    container.innerHTML = '';

    const caretIcon = '<svg class="jadwal-kat-caret-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

    const knownItems = window.PENGUMUMAN_KATEGORI_GROUPS_.reduce((acc, g) => acc.concat(g.items), []);
    const groups = window.PENGUMUMAN_KATEGORI_GROUPS_.slice();
    if (data.some(p => knownItems.indexOf(p.kategori) === -1)) {
      groups.push({ title: 'Lainnya', items: ['__lainnya__'] });
    }

    const buildCard = (kat) => {
      const items = (kat === '__lainnya__'
        ? data.filter(p => knownItems.indexOf(p.kategori) === -1)
        : data.filter(p => p.kategori === kat)
      ).sort((a, b) => String(b.tanggal || '').localeCompare(String(a.tanggal || '')));

      const bodyList = items.length === 0
        ? '<div class="jadwal-kat-empty">Belum ada pengumuman</div>'
        : items.map(p => `
          <div class="pengumuman-card">
            <div class="pengumuman-card-header">
              <div class="pengumuman-card-title">${p.judul}</div>
              <div class="pengumuman-card-date">${p.tanggal}</div>
            </div>
            <div class="pengumuman-card-body">${p.isi}</div>
            <div class="pengumuman-card-actions">
              <button class="btn btn-secondary" onclick='window.editPengumuman(${JSON.stringify(String(p.id))}, ${JSON.stringify(p.judul)}, ${JSON.stringify(p.isi)}, ${JSON.stringify(p.tanggal)})'>Edit</button>
              <button class="btn btn-secondary" style="color: var(--red);" onclick="window.deletePengumuman('${p.id}')">Hapus</button>
            </div>
          </div>
        `).join('');

      const isCollapsed = window.pengumumanKatCollapsed_[kat] !== false;
      const title = kat === '__lainnya__' ? 'Lainnya' : kat;

      const card = document.createElement('div');
      card.className = 'jadwal-kat-card' + (isCollapsed ? ' collapsed' : '');
      card.innerHTML = `
        <button type="button" class="jadwal-kat-header" onclick="window.togglePengumumanKatCollapse_('${kat}')">
          <span class="jadwal-kat-title">${title}</span>
          <span class="jadwal-kat-header-right">
            <span class="jadwal-kat-count">${items.length}</span>
            ${caretIcon}
          </span>
        </button>
        <div class="jadwal-kat-body">
          <div class="pengumuman-kat-add-row">
            <button type="button" class="btn btn-primary" onclick="window.openModalPengumuman(${JSON.stringify(kat === '__lainnya__' ? '' : kat)})">+ Buat Pengumuman</button>
          </div>
          <div class="pengumuman-kat-list">${bodyList}</div>
        </div>
      `;
      return card;
    };

    groups.forEach((g, gi) => {
      const titleRow = document.createElement('div');
      titleRow.className = 'dash-section-title';
      titleRow.style.cssText = 'display: flex; align-items: center; justify-content: space-between;' + (gi > 0 ? ' margin-top: 20px;' : '');
      titleRow.innerHTML = g.title === 'Pengumuman KBM'
        ? '<span>Pengumuman KBM</span><button type="button" class="guru-dash-toggle-table guru-dash-header-btn" onclick="window.openModalPengumumanKBM()"><span>📢 Buat dari Jadwal KBM</span></button>'
        : `<span>${g.title}</span>`;
      container.appendChild(titleRow);

      const grid = document.createElement('div');
      grid.className = 'jadwal-kat-grid';
      g.items.forEach(kat => grid.appendChild(buildCard(kat)));
      container.appendChild(grid);
    });

  /* ═════ GENERATOR PENGUMUMAN KBM (teks WhatsApp dari Jadwal KBM) ═════ */

  window.PKBM_NOTE_DEFAULT_ = 'Datang tepat waktu, jangan terlambat\nMemakai seragam Muslim putih\nJangan lupa membawa uang untuk shodaqoh & kas';

  /**
   * Override per sesi KHUSUS pengumuman yang sedang dibuat — jadwal umum (template)
   * TIDAK diubah. Bentuk: { <sesiId>: { guruId: '<pengganti>', libur: true/false } }.
   * Direset setiap modal dibuka.
   */
  window.pkbmOverrides_ = {};

  window.openModalPengumumanKBM = function () {
    window.pkbmOverrides_ = {};
    document.getElementById('pengumumanKBMTanggal').value = '';
    document.getElementById('pengumumanKBMTanggalDisplay').value = '';
    document.getElementById('pengumumanKBMNote').value = window.PKBM_NOTE_DEFAULT_;
    window.renderPkbmSesiList_();
    window.renderPengumumanKBMPreview_();
    document.getElementById('modalPengumumanKBM').classList.add('active');
  };

  /** Sesi jadwal terurut kategori (urutan baku) lalu jam — dipakai daftar sesi & generator. */
  window.pkbmSortedSesi_ = function () {
    const jadwal = (window.lastJadwalListData || []).slice();
    return jadwal.sort((a, b) => {
      const katDiff = window.KATEGORI_JADWAL_UI_.indexOf(a.kategori) - window.KATEGORI_JADWAL_UI_.indexOf(b.kategori);
      if (katDiff !== 0) return katDiff;
      return String(a.jam_mulai).localeCompare(String(b.jam_mulai));
    });
  };

  /**
   * Bangun daftar sesi di modal. Tiap sesi punya status:
   * - Hadir (default): guru sesuai jadwal umum
   * - Izin — Diganti: muncul dropdown "Digantikan oleh" berisi guru lain di kelompok ini
   * - Libur: sesi tidak dimasukkan ke pengumuman
   */
  window.renderPkbmSesiList_ = function () {
    const wrap = document.getElementById('pkbmSesiList');
    const sesi = window.pkbmSortedSesi_();
    const guruList = window.lastGuruListData || [];

    if (sesi.length === 0) {
      wrap.innerHTML = '<div class="pkbm-sesi-kosong">Belum ada Jadwal KBM — isi dulu di bagian Jadwal KBM.</div>';
      return;
    }

    wrap.innerHTML = '';
    sesi.forEach(j => {
      const ov = window.pkbmOverrides_[j.id] || {};
      const status = ov.status || 'hadir';

      const penggantiOptions = '<option value="">-- Pilih Pengganti --</option>' +
        guruList
          .filter(g => String(g.id) !== String(j.guru_id))
          .map(g => `<option value="${g.id}" ${String(ov.penggantiId) === String(g.id) ? 'selected' : ''}>${g.nama}</option>`)
          .join('');

      const row = document.createElement('div');
      row.className = 'pkbm-sesi-row' + (status === 'libur' ? ' libur' : '') + (status === 'diganti' ? ' diganti' : '');
      row.innerHTML = `
        <div class="pkbm-sesi-main">
          <div class="pkbm-sesi-info">
            <span class="pkbm-sesi-kelas">Kls ${j.kelas} — ${j.guru_nama}</span>
            <span class="pkbm-sesi-jam">${j.jam_mulai}–${j.jam_selesai} · ${j.kategori}</span>
          </div>
          <select class="form-select pkbm-sesi-status" onchange="window.setPkbmStatus_('${j.id}', this.value)">
            <option value="hadir" ${status === 'hadir' ? 'selected' : ''}>Hadir</option>
            <option value="diganti" ${status === 'diganti' ? 'selected' : ''}>Izin — Diganti</option>
            <option value="libur" ${status === 'libur' ? 'selected' : ''}>Libur</option>
          </select>
        </div>
        ${status === 'diganti' ? `
        <div class="pkbm-sesi-ganti">
          <span>Digantikan oleh</span>
          <select class="form-select pkbm-sesi-status" onchange="window.setPkbmPengganti_('${j.id}', this.value)">${penggantiOptions}</select>
        </div>` : ''}
      `;
      wrap.appendChild(row);
    });
  };

  window.setPkbmStatus_ = function (sesiId, status) {
    const ov = window.pkbmOverrides_[sesiId] || (window.pkbmOverrides_[sesiId] = {});
    ov.status = status;
    if (status !== 'diganti') ov.penggantiId = undefined;
    window.renderPkbmSesiList_();
    window.renderPengumumanKBMPreview_();
  };

  window.setPkbmPengganti_ = function (sesiId, guruId) {
    const ov = window.pkbmOverrides_[sesiId] || (window.pkbmOverrides_[sesiId] = {});
    ov.penggantiId = guruId;
    window.renderPengumumanKBMPreview_();
  };

  window.closeModalPengumumanKBM = function () {
    document.getElementById('modalPengumumanKBM').classList.remove('active');
  };

  /** Emoji angka WA untuk penomoran blok (1️⃣..🔟, selebihnya angka biasa). */
  window.pkbmAngka_ = function (n) {
    const emoji = ['1️⃣', '2️⃣', '3️⃣', '4️⃣', '5️⃣', '6️⃣', '7️⃣', '8️⃣', '9️⃣', '🔟'];
    return n <= 10 ? emoji[n - 1] : n + '.';
  };

  /** '15:30' → '15.30' (gaya penulisan jam di pengumuman WA). */
  window.pkbmJam_ = function (j) {
    return String(j || '').replace(':', '.');
  };

  /**
   * Rangkai teks pengumuman WA dari Jadwal KBM (window.lastJadwalListData):
   * - Cabe Rawit: dikelompokkan per pengajar, tiap pengajar bernomor, sesinya "Sesi 1/2..."
   * - Kategori lain (Pra Remaja SMP, Remaja SMA, Muda-Mudi): satu blok bernomor per sesi
   * - Catatan dari textarea (satu baris = satu poin bernomor)
   * - Footer tetap: Pengumuman via Aplikasi Ruang Ngaji
   */
  window.generatePengumumanKBMText_ = function () {
    const tanggal = document.getElementById('pengumumanKBMTanggal').value;
    const noteRaw = document.getElementById('pengumumanKBMNote').value;
    const kelompokName = window.currentKelompokName || '';
    const guruList = window.lastGuruListData || [];

    // Terapkan override per sesi: Libur dibuang; Izin—Diganti memakai guru pengganti
    // (dengan catatan siapa yang digantikan) — hanya untuk teks pengumuman ini,
    // jadwal umum tidak berubah.
    const jadwal = (window.lastJadwalListData || []).map(j => {
      const ov = window.pkbmOverrides_[j.id] || {};
      if (ov.status === 'libur') return null;
      if (ov.status === 'diganti' && ov.penggantiId) {
        const g = guruList.find(x => String(x.id) === String(ov.penggantiId));
        if (g && String(g.id) !== String(j.guru_id)) {
          return Object.assign({}, j, { guru_id: g.id, guru_nama: g.nama, pengganti_dari: j.guru_nama });
        }
      }
      return j;
    }).filter(Boolean);

    const hariNama = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

    let tanggalLabel = '(pilih tanggal)';
    if (tanggal) {
      const [y, m, d] = tanggal.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      tanggalLabel = `${hariNama[dt.getDay()]}, ${d} ${monthNames[m - 1]} ${y}`;
    }

    const baris = [];
    baris.push('Assalamualaikum Wr. Wb. 🙏');
    baris.push('');
    baris.push(`*Pengumuman Jadwal KBM Generus ${kelompokName}*`);
    baris.push('');
    baris.push(`📌 *${tanggalLabel}*`);

    let nomor = 0;

    // Cabe Rawit: kelompokkan per pengajar (urutan kemunculan, sesi urut jam)
    const cabeRawit = jadwal
      .filter(j => j.kategori === 'Cabe Rawit')
      .sort((a, b) => String(a.jam_mulai).localeCompare(String(b.jam_mulai)));
    const perGuru = [];
    cabeRawit.forEach(j => {
      let g = perGuru.find(x => String(x.guruId) === String(j.guru_id));
      if (!g) {
        g = { guruId: j.guru_id, guruNama: j.guru_nama, sesi: [] };
        perGuru.push(g);
      }
      g.sesi.push(j);
    });

    perGuru.forEach(g => {
      nomor += 1;
      baris.push('');
      baris.push(`${window.pkbmAngka_(nomor)} *Pengajar ${g.guruNama}*`);
      g.sesi.forEach((j, i) => {
        if (i > 0) baris.push('');
        baris.push(`📍 *Sesi ${i + 1} : Kls ${j.kelas}*${j.pengganti_dari ? ` _(menggantikan ${j.pengganti_dari})_` : ''}`);
        baris.push(`⏰ Jam : ${window.pkbmJam_(j.jam_mulai)} - ${window.pkbmJam_(j.jam_selesai)} WIB${j.keterangan ? ' (' + j.keterangan + ')' : ''}`);
        baris.push(`🏠 *Tempat : ${j.ruangan}*`);
      });
    });

    // Kategori lain: satu blok bernomor per sesi
    ['Pra Remaja SMP', 'Remaja SMA', 'Muda-Mudi'].forEach(kat => {
      const sesiKat = jadwal
        .filter(j => j.kategori === kat)
        .sort((a, b) => String(a.jam_mulai).localeCompare(String(b.jam_mulai)));
      sesiKat.forEach(j => {
        nomor += 1;
        baris.push('');
        baris.push(`${window.pkbmAngka_(nomor)} *Kelas ${kat}*`);
        baris.push(`Pengajar : *${j.guru_nama}*${j.pengganti_dari ? ` _(menggantikan ${j.pengganti_dari})_` : ''}`);
        baris.push(`⏰ Jam : ${window.pkbmJam_(j.jam_mulai)} - ${window.pkbmJam_(j.jam_selesai)} WIB${j.keterangan ? ' (' + j.keterangan + ')' : ''}`);
        baris.push(`🏠 *Tempat : ${j.ruangan}*`);
      });
    });

    if (nomor === 0) {
      baris.push('');
      baris.push('_(Belum ada Jadwal KBM — isi dulu di bagian Jadwal KBM)_');
    }

    const notes = noteRaw.split('\n').map(s => s.trim()).filter(Boolean);
    if (notes.length > 0) {
      baris.push('');
      baris.push('*Note :*');
      notes.forEach((n, i) => baris.push(`*${i + 1}. ${n}*`));
    }

    baris.push('');
    baris.push('Alhamdulillahi jaza kumullohu khoiro 🙏');
    baris.push('');
    baris.push('Wassalamualaikum Wr. Wb.');
    baris.push('');
    baris.push('_Pengumuman via Aplikasi Ruang Ngaji_');

    return baris.join('\n');
  };

  window.renderPengumumanKBMPreview_ = function () {
    document.getElementById('pengumumanKBMPreview').textContent = window.generatePengumumanKBMText_();
  };

  window.copyPengumumanKBM_ = function () {
    const text = window.generatePengumumanKBMText_();
    const btn = document.getElementById('pkbmSalinBtn');
    const sukses = function () {
      btn.textContent = '✅ Tersalin!';
      setTimeout(function () { btn.textContent = '📋 Salin Teks'; }, 2000);
    };

    // Fallback textarea+execCommand untuk browser/iframe yang menolak clipboard API.
    const fallback = function () {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        sukses();
      } catch (e) {
        alert('Gagal menyalin — salin manual dari kotak pratinjau.');
      }
      document.body.removeChild(ta);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(sukses, fallback);
    } else {
      fallback();
    }
  };

  window.savePengumumanKBM_ = function () {
    const tanggal = document.getElementById('pengumumanKBMTanggal').value;
    if (!tanggal) {
      alert('Pilih tanggal KBM dulu.');
      return;

    window.showGlobalLoading_('Menyimpan pengumuman...');
    google.script.run
      .withSuccessHandler(function (result) {
        window.hideGlobalLoading_();
        if (result.success) {
          window.closeModalPengumumanKBM();
          window.loadKelompokDashboardPengumuman_(window.currentKelompokId);
        } else {
          alert(result.error);
        }
      })
      .withFailureHandler(function (err) {
        window.hideGlobalLoading_();
        alert('Gagal terhubung ke server: ' + (err && err.message ? err.message : err));
      })
      .serverCreatePengumuman(window.currentToken, { kelompok_id: window.currentKelompokId, judul, isi, tanggal });
  };

  // Submenu section Dashboard Kelompok (Kelp Petemon dkk): Dashboard/Data Master/
  // Operasional/Kurikulum/Monitoring/Laporan. Menutup modal aktif dulu supaya
  // tidak ada modal "hilang" secara diam-diam kalau panel pemiliknya disembunyikan.
  window.switchKelpSectionTab_ = function (btn, sectionName) {

      m.classList.remove('active');

        bulanEl.dataset.inited = '1';
      }

      const tahunEl = document.getElementById('kurikulumProtaTahun');

      window.loadKurikulumProta_(window.currentKelompokId, tahunEl ? tahunEl.value : 2026, kelasEl ? kelasEl.value : '');

  // Ambang batas & warna kategori kehadiran generus — HARUS sama persis dgn
  // kategoriKehadiran_() di Modul_Monitoring.gs (satu-satunya sumber warna
  // dikembalikan server via field `warna`, klien cuma memetakan ke class CSS).
  window.loadMonitoringGenerus_ = function (kelompokId) {
    const barsEl = document.getElementById('monitoringJenjangBars');
    const rankEl = document.getElementById('monitoringKelasRanking');
    if (!barsEl || !rankEl || !kelompokId) return;

    barsEl.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-faint);">Memuat...</div>';
    rankEl.innerHTML = '';

    const tahun = document.getElementById('monitoringTahun').value;
    const bulan = document.getElementById('monitoringBulan').value;

    google.script.run
      .withSuccessHandler(function (result) {
        if (!result.success) {
          barsEl.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--red);">' + (result.error || 'Gagal memuat data.') + '</div>';
          return;
        }
        window.renderMonitoringGenerus_(result.data);
      })
      .withFailureHandler(function () {
        barsEl.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--red);">Gagal memuat data monitoring.</div>';
      })
      .serverGetMonitoringGenerus(window.currentToken, kelompokId, tahun, bulan);
  };

  window.renderMonitoringGenerus_ = function (jenjangList) {
    const barsEl = document.getElementById('monitoringJenjangBars');
    const rankEl = document.getElementById('monitoringKelasRanking');

    barsEl.innerHTML = jenjangList.map(function (j) {
      const pctWidth = j.avgPct === null ? 0 : j.avgPct;
      const pctLabel = j.avgPct === null ? '—' : j.avgPct + '%';
      return '<div class="monitoring-jenjang-card">'
        + '<div class="monitoring-jenjang-header">'
        + '<div><div class="monitoring-jenjang-title">' + j.label + '</div>'
        + '<div class="monitoring-jenjang-meta">' + j.jumlahSantri + ' santri &middot; ' + j.jumlahKelas + ' kelas</div></div>'
        + '<span class="monitoring-badge monitoring-badge-' + j.warna + '">' + pctLabel + ' &middot; ' + j.kategoriLabel + '</span>'
        + '</div>'
        + '<div class="monitoring-bar-track"><div class="monitoring-bar-fill monitoring-fill-' + j.warna + '" style="width: ' + pctWidth + '%;"></div></div>'
        + '</div>';
    }).join('');

    rankEl.innerHTML = jenjangList.map(function (j) {
      if (j.kelasList.length === 0) return '';
      const rows = j.kelasList.map(function (k, idx) {
        const pctLabel = k.adaData ? k.avgPct + '%' : '—';
        return '<div class="monitoring-kelas-row">'
          + '<div class="monitoring-kelas-rank">' + (idx + 1) + '</div>'
          + '<div class="monitoring-kelas-nama">' + k.kelas + '</div>'
          + '<div class="monitoring-kelas-jumlah">' + k.jumlahSantri + ' santri</div>'
          + '<span class="monitoring-badge monitoring-badge-' + k.warna + '">' + pctLabel + '</span>'
          + '</div>';
      }).join('');
      return '<div><div class="dash-section-title" style="font-size: 13px; margin-bottom: 10px;">Ranking Kelas — ' + j.label + '</div>'
        + '<div class="monitoring-kelas-list">' + rows + '</div></div>';
    }).join('');
  };

  window.loadKelompokDashboard = function (kelompokId, kelompokName, onDone, forceFresh) {

    // onDone dipanggil setelah 2 sumber data utama (guru & generus) selesai —
    // dipakai tombol Refresh untuk menutup spinner tepat waktu.
    let pending = 2;
    const tick = function () {
      pending -= 1;
      if (pending <= 0 && typeof onDone === 'function') onDone();
    };

    window.loadKelompokDashboardGuru_(kelompokId, tick, forceFresh);
    window.loadKelompokDashboardSantriKelas_(kelompokId, tick, forceFresh);
    window.loadKelompokDashboardAbsen_(kelompokId);
    window.loadKelompokDashboardJadwal_(kelompokId);
    window.loadJadwalKategoriHari_(kelompokId);

    window.loadSiklusGenerusList_(kelompokId);
    window.loadPengurusList_(kelompokId);
  };

  // (klik langsung salah satu section di submenu sidebar Kelp Petemon).

  window.handleBulkImportFileSelect = function (e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (event) {
      try {
        const csv = event.target.result;
        const rows = window.parseCSV(csv);

        if (rows.length === 0) {
          showAlert('santriError', 'File kosong atau format tidak valid.', 'error');
          return;
        }

        window.bulkImportData = rows;

        // Show preview (max 5 rows)
        const previewRows = rows.slice(0, 5);
        const tbody = document.getElementById('bulkImportPreviewBody');
        tbody.innerHTML = previewRows.map((row, idx) => `
          <tr>
            <td>${idx + 1}</td>
            <td>${row.nama || '-'}</td>
            <td>${row.nis || '-'}</td>
            <td>${row.gender || '-'}</td>
            <td>${row.tanggal_lahir || '-'}</td>
            <td>${row.jenjang_saat_ini || '-'}</td>
          </tr>
        `).join('');
        document.getElementById('bulkImportPreview').style.display = 'block';

        // Show stats
        document.getElementById('bulkImportRowCount').textContent = rows.length;
        document.getElementById('bulkImportStats').style.display = 'block';
        document.getElementById('btnBulkImportProcess').disabled = false;

        // Note: actual validation happens on server side
        showAlert('santriSuccess', `${rows.length} baris siap diimpor. Validasi lengkap akan dilakukan saat proses.`, 'success');
      } catch (err) {
        showAlert('santriError', 'Error: ' + err.message, 'error');
      }
    };

    // Handle both CSV and Excel
    if (file.name.endsWith('.csv')) {
      reader.readAsText(file);
    } else if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
      // For Excel, we need to use a library or convert. For now, fallback to CSV
      showAlert('santriError', 'Excel format belum didukung. Silakan konversi ke CSV terlebih dahulu.', 'error');
    } else {
      showAlert('santriError', 'Format file harus CSV atau Excel.', 'error');
    }
  };

  // Helper: Parse CSV (simple implementation)
  window.parseCSV = function (csv) {
    const lines = csv.trim().split('\n');
    if (lines.length < 2) return []; // Header + at least 1 data row

    // Try to auto-detect delimiter (comma or semicolon)
    const headers = lines[0].split(/[,;]/).map(h => h.trim().toLowerCase());
    const delimiter = lines[0].includes(';') ? ';' : ',';

    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const values = lines[i].split(delimiter).map(v => v.trim());
      if (values.length < 5) continue; // Skip incomplete rows

      const row = {
        nama: values[0],
        nis: values[1],
        gender: values[2],
        tanggal_lahir: values[3],
        jenjang_saat_ini: values[4],
      };
      rows.push(row);
    }
    return rows;
  };

  window.refreshUserGuruOptions_ = function (selectedGuruId) {
    const role = document.getElementById('userRole').value;
    const scopeType = document.getElementById('userScopeType').value;
    const scopeId = document.getElementById('userScopeId').value;
    const group = document.getElementById('userGuruGroup');
    const select = document.getElementById('userGuruId');

    if (role !== 'guru' || scopeType !== 'kelompok' || !scopeId) {
      group.style.display = 'none';
      select.innerHTML = '<option value="">-- Pilih Guru --</option>';
      return;
    }

    group.style.display = 'block';
    select.innerHTML = '<option value="">Memuat...</option>';

    google.script.run
      .withSuccessHandler(function (result) {
        select.innerHTML = '<option value="">-- Pilih Guru --</option>';
        if (result.success) {
          result.data.forEach(function (g) {
            const opt = document.createElement('option');
            opt.value = g.id;
            opt.textContent = g.nama;
            if (String(g.id) === String(selectedGuruId)) opt.selected = true;
            select.appendChild(opt);
          });
        }
      })
      .serverGetGuruOptionsForUser(window.currentToken, scopeId);

  window.saveUser = function () {
    const nama = document.getElementById('userNama').value;
    const email = document.getElementById('userEmail').value;
    const role = document.getElementById('userRole').value;
    const scopeType = document.getElementById('userScopeType').value;
    const scopeId = document.getElementById('userScopeId').value;
    const guruId = document.getElementById('userGuruId').value;

    if (!nama || !email || !role || !scopeType || !scopeId) {
      showAlert('userMgmtError', 'Semua field wajib diisi.', 'error');
      return;
    }
    if (role === 'guru' && !guruId) {
      showAlert('userMgmtError', 'Pilih data Guru yang terhubung dengan akun ini.', 'error');
      return;
    }

    const btn = document.getElementById('btnSaveUser');
    btn.disabled = true;
    btn.textContent = '⏳ Menyimpan...';

    if (window.currentEditingUserId) {
      // Update user
      google.script.run
        .withSuccessHandler(function (result) {
          btn.disabled = false;
          btn.textContent = 'Update User';

          if (result.success) {
            showAlert('userMgmtSuccess', result.message, 'success');
            window.closeModalUserForm();
            window.loadUserManagement();
          } else {
            showAlert('userMgmtError', result.error, 'error');
          }
        })
        .serverUpdateUser(window.currentToken, window.currentEditingUserId, {
          nama, email, role, scope_type: scopeType, scope_id: scopeId, guru_id: guruId
        });
    } else {
      // Create new user
      const username = document.getElementById('userNama').value.toLowerCase().replace(/\s+/g, '_').substring(0, 20);

      google.script.run
        .withSuccessHandler(function (result) {
          btn.disabled = false;
          btn.textContent = 'Buat User';

          if (result.success) {
            showAlert('userMgmtSuccess', result.message, 'success');
            window.closeModalUserForm();
            window.loadUserManagement();
          } else {
            showAlert('userMgmtError', result.error, 'error');
          }
        })
        .serverCreateUser(window.currentToken, {
          nama, username, email, role, scope_type: scopeType, scope_id: scopeId, guru_id: guruId
        });
    }
  };

  window.renderKonselingCharts = function (stats) {
    // Pie Chart: Distribusi Kategori
    const kategoriData = [['Kategori', 'Jumlah']];
    Object.entries(stats.distribution_by_kategori).forEach(([kategori, count]) => {
      kategoriData.push([kategori.charAt(0).toUpperCase() + kategori.slice(1), count]);
    });

    const kategoriOptions = {
      title: 'Distribusi Kategori Konseling',
      pieHole: 0.4,
      colors: ['#d97706', '#f87171', '#fb923c', '#fbbf24', '#fcd34d', '#a855f7'],
      chartArea: { width: '90%', height: '90%' }
    };

    const kategoriChart = new google.visualization.PieChart(document.getElementById('chartKonselingKategori'));
    const kategoriTable = google.visualization.arrayToDataTable(kategoriData);
    kategoriChart.draw(kategoriTable, kategoriOptions);

    // Line Chart: Timeline Bulanan
    const timelineData = [['Bulan', 'Jumlah Kasus']];
    Object.entries(stats.distribution_by_month).sort().forEach(([month, count]) => {
      const [year, monthNum] = month.split('-');
      const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      timelineData.push([monthNames[parseInt(monthNum) - 1] + ' ' + year, count]);
    });

    const timelineOptions = {
      title: 'Timeline Kasus Konseling (Bulanan)',
      curveType: 'function',
      legend: { position: 'bottom' },
      colors: ['#3b82f6'],
      hAxis: { slantedText: true },
      vAxis: { minValue: 0 },
      chartArea: { width: '90%', height: '85%' }
    };

    const timelineChart = new google.visualization.LineChart(document.getElementById('chartKonselingTimeline'));
    const timelineTable = google.visualization.arrayToDataTable(timelineData);
    timelineChart.draw(timelineTable, timelineOptions);
  };

  window.renderKalendarGrid = function (tahun, bulan, events) {
    const firstDay = new Date(tahun, bulan - 1, 1).getDay();
    const daysInMonth = new Date(tahun, bulan, 0).getDate();
    const grid = document.getElementById('kalenderGrid');
    grid.innerHTML = '';

    // Empty cells for days before month starts
    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.style.cssText = 'background: #f9f9f9; padding: 8px; text-align: center; color: #999; border: 1px solid #eee;';
      grid.appendChild(empty);
    }

    // Days of month
    const eventsByDate = {};
    events.forEach(e => {
      if (!eventsByDate[e.tanggal]) eventsByDate[e.tanggal] = [];
      eventsByDate[e.tanggal].push(e);
    });

    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${tahun}-${String(bulan).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const dayEvents = eventsByDate[dateStr] || [];
      const isToday = new Date().toDateString() === new Date(tahun, bulan - 1, day).toDateString();

      const cell = document.createElement('div');
      cell.style.cssText = `
        padding: 8px;
        border: 1px solid #ddd;
        min-height: 60px;
        background: ${isToday ? '#e3f2fd' : 'white'};
        cursor: pointer;
        transition: background 0.2s;
      `;
      cell.onmouseover = () => cell.style.background = '#f5f5f5';
      cell.onmouseout = () => cell.style.background = isToday ? '#e3f2fd' : 'white';
      cell.onclick = () => window.openKalenderModalForDate(dateStr);

      let html = `<strong style="color: ${isToday ? '#1976d2' : '#333'};">${day}</strong>`;
      if (dayEvents.length > 0) {
        html += `<div style="font-size: 10px; margin-top: 4px; color: #666;">`;
        dayEvents.slice(0, 2).forEach(e => {
          const colors = { kbm: '#388e3c', ujian: '#f57c00', acara: '#c2185b', libur: '#7b1fa2' };
          html += `<div style="background: ${colors[e.tipe_event] || '#999'}; color: white; padding: 2px 4px; border-radius: 2px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${e.judul_event}</div>`;
        });
        if (dayEvents.length > 2) {
          html += `<div style="color: #999;">+${dayEvents.length - 2} more</div>`;
        }
        html += `</div>`;
      }
      cell.innerHTML = html;
      grid.appendChild(cell);
    }
  };

      .serverDeleteCalendarEvent(window.currentToken, eventId);
  };

  window.prevMonth = function () {
    window.currentKalenderMonth.setMonth(window.currentKalenderMonth.getMonth() - 1);
    window.loadKalenderData();
  };

  window.nextMonth = function () {
    window.currentKalenderMonth.setMonth(window.currentKalenderMonth.getMonth() + 1);
    window.loadKalenderData();
  };

  /* ═════ PUSAT UNDUHAN FUNCTIONS ═════ */

  window.loadPustakUnduhScreen = function () {
    window.loadPustakUnduhFiles();
  };

  window.loadPustakUnduhFiles = function () {
    const kategori = document.getElementById('filterKategoriPustak').value;
    const search = document.getElementById('searchPustakUnduh').value;

    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          window.renderPustakUnduhTable(result.data);
        }
      })
      .serverGetFilesList(window.currentToken, kategori, search);

    // Load stats
    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          document.getElementById('pustakTotalFiles').textContent = result.data.total_files;
          document.getElementById('pustakTotalSize').textContent = result.data.total_size_mb + ' MB';
          document.getElementById('pustakTotalDownloads').textContent = result.data.downloads_total;
        }
      })
      .serverGetFileStats(window.currentToken);
  };

  window.renderPustakUnduhTable = function (data) {
    const tbody = document.getElementById('pustakUnduhTableBody');
    tbody.innerHTML = '';

    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: #999;">Tidak ada file</td></tr>';
      return;
    }

    data.forEach(file => {
      const kategoriColors = {
        'Modul': '#388e3c',
        'Soal': '#f57c00',
        'Dokumen': '#1976d2',
        'Pedoman': '#c2185b',
        'Lainnya': '#7b1fa2'
      };

      const row = document.createElement('tr');
      row.innerHTML = `
        <td style="padding: 12px; border: 1px solid #ddd; font-weight: 500;">
          <a href="${file.url}" target="_blank" style="color: #1976d2; text-decoration: none;">
            📄 ${file.nama_file}
          </a>
        </td>
        <td style="padding: 12px; border: 1px solid #ddd;">
          <span style="background: ${kategoriColors[file.kategori] || '#999'}; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px;">
            ${file.kategori}
          </span>
        </td>
        <td style="padding: 12px; border: 1px solid #ddd; font-size: 13px; max-width: 200px; overflow: hidden; text-overflow: ellipsis;">${file.deskripsi || '-'}</td>
        <td style="padding: 12px; border: 1px solid #ddd; text-align: center; font-size: 12px;">${file.ukuran_kb} KB</td>
        <td style="padding: 12px; border: 1px solid #ddd; text-align: center; font-weight: bold; color: #1976d2;">${file.download_count}</td>
        <td style="padding: 12px; border: 1px solid #ddd; font-size: 12px;">${file.pembuat_nama}</td>
        <td style="padding: 12px; border: 1px solid #ddd; text-align: center;">
          <a href="${file.url}" target="_blank" class="btn btn-sm" style="padding: 4px 8px; margin-right: 4px; color: white; background: #388e3c; text-decoration: none; border-radius: 4px;">Download</a>
          <button class="btn btn-sm" onclick="window.deletePustakUnduhFile('${file.id}')" style="padding: 4px 8px; background: #ef4444; color: white;">Hapus</button>
        </td>
      `;
      tbody.appendChild(row);
    });
  };

  window.openPustakUnduhModal = function () {
    document.getElementById('modalPustakTitle').textContent = 'Upload File Baru';
    document.getElementById('formPustakKategori').value = '';
    document.getElementById('formPustakNama').value = '';
    document.getElementById('formPustakDeskripsi').value = '';
    document.getElementById('formPustakUrl').value = '';
    document.getElementById('formPustakUkuran').value = '';
    document.getElementById('modalPustakUnduh').classList.add('active');
  };

  window.closePustakUnduhModal = function () {
    document.getElementById('modalPustakUnduh').classList.remove('active');
  };

  window.savePustakUnduhForm = function (event) {
    event.preventDefault();

    const data = {
      kategori: document.getElementById('formPustakKategori').value,
      nama_file: document.getElementById('formPustakNama').value,
      deskripsi: document.getElementById('formPustakDeskripsi').value,
      url_file: document.getElementById('formPustakUrl').value,
      ukuran_bytes: parseInt(document.getElementById('formPustakUkuran').value) || 0,
    };

    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          alert(result.message);
          window.closePustakUnduhModal();
          window.loadPustakUnduhFiles();
        } else {
          alert('Error: ' + result.error);
        }
      })
      .serverCreateFile(window.currentToken, data);
