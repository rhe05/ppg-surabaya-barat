  window.deletePustakUnduhFile = function (fileId) {
    if (!confirm('Hapus file ini dari Pusat Unduhan?')) return;

    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          alert(result.message);
          window.loadPustakUnduhFiles();
        } else {
          alert('Error: ' + result.error);
        }
      })
      .serverDeleteFile(window.currentToken, fileId);
  };

  // Close mobile sidebar when clicking outside
  document.addEventListener('click', function (event) {
    const sidebar = document.querySelector('.app-sidebar');
    const toggleBtn = document.querySelector('.sidebar-toggle-btn');

    if (window.innerWidth < 768 && sidebar.classList.contains('mobile-open')) {
      if (!sidebar.contains(event.target) && !toggleBtn.contains(event.target)) {
        sidebar.classList.remove('mobile-open');
      }
    }

  // Close mobile sidebar when clicking menu item
  document.querySelectorAll('.sidebar-menu-link').forEach(link => {
    link.addEventListener('click', function () {
      if (window.innerWidth < 768) {

  /* ═══════════════════════════════════════════════════════════════════════════════
     KURIKULUM — Tab Switching & Loading
     ═════════════════════════════════════════════════════════════════════════════════ */

  window.switchKurikulumTab_ = function (btn, tabName) {
    document.querySelectorAll('.kurikulum-tab-btn').forEach(b => b.classList.remove('active'));
    // Tiap panel non-default (Semester/Bulanan/Pencapaian) punya inline
    // style="display: none" di markup -- classList doang TIDAK CUKUP karena
    // inline style SELALU menang atas rule .kurikulum-tab-content.active
    // (tanpa !important), jadi panelnya tetap invisible walau class 'active'
    // sudah ketambahan (ERROR_LOG.md #9, pola yang sama). Set .style.display
    // eksplisit di sini supaya benar-benar kebuka.
    document.querySelectorAll('.kurikulum-tab-content').forEach(c => {
      c.classList.remove('active');
      c.style.display = 'none';
    });

    btn.classList.add('active');
    const tabEl = document.getElementById('kurikulumTab' + (tabName.charAt(0).toUpperCase() + tabName.slice(1)));
    if (tabEl) {
      tabEl.classList.add('active');
      tabEl.style.display = 'block';
    }

    if (tabName === 'prota') {
      const tahun = document.getElementById('kurikulumProtaTahun').value || 2026;
      const kelas = document.getElementById('kurikulumProtaKelas').value;
      window.loadKurikulumProta_(window.currentKelompokId, tahun, kelas);
    }

    if (tabName === 'promes') {
      const tahun = document.getElementById('kurikulumSemesterTahun').value || 2026;
      window.loadKurikulumSemesterReport_(window.currentKelompokId, tahun);
    }
  };

  window.loadKurikulumProta_ = function (kelompokId, tahun, kelas, onDone) {
    window.showGlobalLoading_('Memuat program tahunan...');
    google.script.run
      .withSuccessHandler(function (result) {
        window.hideGlobalLoading_();
        if (!result.success) {
          document.getElementById('kurikulumProtaList').innerHTML = '<div style="text-align: center; padding: 40px; color: var(--red);">Gagal memuat: ' + result.error + '</div>';
          return;
        }
        window.lastProtaData = result.data;
        window.renderProtaList_(result.data);
        if (onDone) onDone();
      })
      .withFailureHandler(function (err) {
        window.hideGlobalLoading_();
        document.getElementById('kurikulumProtaList').innerHTML = '<div style="text-align: center; padding: 40px; color: var(--red);">Error: ' + err.message + '</div>';
      })
      .serverGetProta(window.currentToken, kelompokId, parseInt(tahun) || 2026, kelas || '');
  };

  // Escape apostrof jadi entity HTML supaya aman dipakai di dalam atribut
  // onclick="..." (baik sebagai pembatas string HTML maupun string JS) --
  // sebelumnya kategori/target TIDAK di-escape sama sekali, jadi kategori
  // apa pun yang mengandung tanda kutip (mis. "Bacaan Al-Qur'an") membuat
  // tombol Edit/Lihat Semester rusak (atribut onclick terpotong).
  window.escKurikulumAttr_ = function (s) {
    return String(s || '').replace(/'/g, '&#39;').replace(/"/g, '&quot;');
  };

  // Urutan kelas: PAUD-TK di depan Kelas 1 (jenjang paling awal), lalu
  // Kelas 1-9 numerik. parseInt(a)-parseInt(b) polos gagal begitu ada kelas
  // non-angka seperti 'PAUD-TK' (NaN) -- dipakai di renderProtaList_ &
  // renderKurikulumSemesterReport_.
  window.kurikulumKelasSortValue_ = function (kelas) {
    if (kelas === 'PAUD-TK') return -1;
    const n = parseInt(kelas, 10);
    return isNaN(n) ? 999 : n;
  };

  // Kartu di-kelompokkan per Kelas (bukan 1 kartu per kategori) supaya tetap
  // ringkas walau kategori materi terus bertambah -- tiap Kelas jadi 1 kartu
  // berisi daftar materi bernomor (mis. "1. Bacaan Al-Qur'an"), klik salah
  // satu materi baru buka detail Semester-nya. Urutan materi dalam 1 Kelas
  // mengikuti urutan baris di sheet (kategori lama tetap di atas).
  window.renderProtaList_ = function (data) {
    const list = document.getElementById('kurikulumProtaList');
    if (!data || data.length === 0) {
      list.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-faint);">Belum ada program tahunan</div>';
      return;
    }

    const groups = {};
    data.forEach(function (prota) {
      const key = prota.kelas ? String(prota.kelas) : '__umum__';
      if (!groups[key]) groups[key] = [];
      groups[key].push(prota);
    });

    const kelasKeys = Object.keys(groups).filter(k => k !== '__umum__').sort((a, b) => window.kurikulumKelasSortValue_(a) - window.kurikulumKelasSortValue_(b));
    if (groups.__umum__) kelasKeys.push('__umum__');

    list.innerHTML = kelasKeys.map(function (key) {
      const items = groups[key];
      const label = key === '__umum__' ? 'Umum (Semua Kelas)' : 'Kelas ' + key;
      const kelasArg = key === '__umum__' ? '' : key;

      const materiHtml = items.map(function (prota, i) {
        const kategoriEsc = window.escKurikulumAttr_(prota.kategori);
        const targetEsc = window.escKurikulumAttr_(prota.target);
        const deskripsiEsc = window.escKurikulumAttr_(prota.deskripsi);
        return `
          <div class="kurikulum-materi-item" data-prota-id="${prota.id}" onclick="window.toggleMateriDetail_(this)">
            <span class="kurikulum-materi-label"><span class="kurikulum-materi-chevron">›</span>${i + 1}. ${prota.kategori || 'N/A'}</span>
            <span class="kurikulum-materi-actions">
              <button class="kurikulum-materi-icon-btn" title="Edit" onclick="event.stopPropagation(); window.editProta('${prota.id}', '${kategoriEsc}', '${targetEsc}', '${deskripsiEsc}', '${prota.kelas || ''}')">✎</button>
              <button class="kurikulum-materi-icon-btn kurikulum-materi-icon-danger" title="Hapus" onclick="event.stopPropagation(); window.deleteProta('${prota.id}')">×</button>
            </span>
          </div>
          <div class="kurikulum-materi-detail" id="kurikulumMateriDetail_${prota.id}" style="display: none;"></div>
        `;
      }).join('');

      return `
        <div class="kurikulum-kelas-card">
          <div class="kurikulum-kelas-header">
            <span class="kurikulum-kelas-title">${label}</span>
            <button class="kurikulum-kelas-add-btn" onclick="window.openModalAddProta('${kelasArg}')">+ Materi</button>
          </div>
          <div class="kurikulum-materi-list">${materiHtml}</div>
        </div>
      `;
    }).join('');
  };

  /* ═══════════════════════════════════════════════════════════════════════════════
     TAB SEMESTER — laporan lengkap per Kelas: tiap materi, tiap Semester,
     tabel Bulan 1-6 (horizontal, sesuai poster referensi kurikulum).
     Read-only (kelola tiap bagian tetap lewat tab Tahunan/Bulanan) — 1
     panggilan server (serverGetKurikulumFullTree) utk seluruh pohon data,
     BUKAN N+1 per Prota/Promes.
     ═════════════════════════════════════════════════════════════════════════════════ */

  window.loadKurikulumSemesterReport_ = function (kelompokId, tahun) {
    const el = document.getElementById('kurikulumSemesterReportList');
    if (!el) return;
    el.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-faint);">Memuat...</div>';
    google.script.run
      .withSuccessHandler(function (result) {
        if (!result.success) {
          el.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--red);">Gagal: ' + result.error + '</div>';
          return;
        }
        window.lastKurikulumSemesterTree_ = result.data;
        window.renderKurikulumSemesterReport_(el, result.data);
      })
      .withFailureHandler(function (err) {
        el.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--red);">Error: ' + err.message + '</div>';
      })
      .serverGetKurikulumFullTree(window.currentToken, kelompokId, parseInt(tahun) || 2026);
  };

  // Modal "Edit Target Bulanan" -- dipicu tombol "Edit" di tiap kartu Kelas
  // (tab Semester). Admin pilih Semester + Materi, isi 6 kolom Bulan
  // langsung di sini (TIDAK loncat ke tab Tahunan lagi) -- data materi utk
  // Kelas ini diambil dari window.lastKurikulumSemesterTree_ (sudah ada di
  // memori dari render laporan, tidak perlu fetch ulang).
  window.openModalEditProbulBulanan = function (kelas) {
    const kelasKey = kelas || '';
    document.getElementById('probulBulananKelas').value = kelasKey;

    const items = (window.lastKurikulumSemesterTree_ || []).filter(function (p) {
      return (p.kelas ? String(p.kelas) : '') === kelasKey;
    });
    window.currentProbulBulananItems_ = items;

    const materiSelect = document.getElementById('probulBulananMateri');
    materiSelect.innerHTML = items.map(function (p) {
      return `<option value="${p.id}">${window.escKurikulumAttr_(p.kategori)}</option>`;
    }).join('');

    document.getElementById('probulBulananSemester').value = '1';
    window.onProbulBulananSelectChange_();
    document.getElementById('modalEditProbulBulanan').classList.add('active');
  };

  window.closeModalEditProbulBulanan = function () {
    document.getElementById('modalEditProbulBulanan').classList.remove('active');
  };

  window.onProbulBulananSelectChange_ = function () {
    const protaId = document.getElementById('probulBulananMateri').value;
    const semester = document.getElementById('probulBulananSemester').value;
    const items = window.currentProbulBulananItems_ || [];
    const prota = items.find(function (p) { return String(p.id) === String(protaId); });
    const promes = prota ? (prota.promes || []).find(function (p) { return String(p.semester) === String(semester); }) : null;

    document.getElementById('probulBulananPromesId').value = promes ? promes.id : '';
    document.getElementById('probulBulananEmptyNote').style.display = promes ? 'none' : 'block';
    document.getElementById('probulBulananFields').style.display = promes ? 'block' : 'none';

    const byBulan = {};
    if (promes && promes.probul) {
      promes.probul.forEach(function (p) { byBulan[parseInt(p.bulan)] = p.target; });
    }
    for (let b = 1; b <= 6; b++) {
      document.getElementById('probulBulanan' + b).value = byBulan[b] || '';
    }
  };

  window.saveProbulBulanan = function () {
    const promesId = document.getElementById('probulBulananPromesId').value;
    if (!promesId) {
      alert('Materi ini belum punya Semester yang dipilih.');
      return;
    }

    const bulanValues = {};
    for (let b = 1; b <= 6; b++) {
      bulanValues[b] = document.getElementById('probulBulanan' + b).value.trim();
    }

    window.showGlobalLoading_('Menyimpan...');
    google.script.run
      .withSuccessHandler(function (result) {
        window.hideGlobalLoading_();
        if (!result.success) {
          alert('Error: ' + result.error);
          return;
        }
        window.closeModalEditProbulBulanan();
        const tahunEl = document.getElementById('kurikulumSemesterTahun');
        window.loadKurikulumSemesterReport_(window.currentKelompokId, tahunEl ? tahunEl.value : 2026);
      })
      .withFailureHandler(function (err) {
        window.hideGlobalLoading_();
        alert('Error: ' + err.message);
      })
      .serverSetProbulBulan(window.currentToken, promesId, bulanValues);
  };

  // Tabel gabungan per Kelas+Semester: baris = materi (Bacaan Al-Qur'an, Tulis
  // Huruf Arab, dst — makin banyak nanti), kolom = Bulan 1-6 (1 header
  // bersama, bukan diulang per materi) -- padat & rapi supaya tetap muat 1
  // layar walau jumlah materi terus bertambah.
  window.renderKurikulumSemesterReport_ = function (containerEl, data) {
    if (!data || data.length === 0) {
      containerEl.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-faint);">Belum ada program tahunan untuk tahun ini</div>';
      return;
    }

    const groups = {};
    data.forEach(function (prota) {
      const key = prota.kelas ? String(prota.kelas) : '__umum__';
      if (!groups[key]) groups[key] = [];
      groups[key].push(prota);
    });

    const kelasKeys = Object.keys(groups).filter(k => k !== '__umum__').sort((a, b) => window.kurikulumKelasSortValue_(a) - window.kurikulumKelasSortValue_(b));
    if (groups.__umum__) kelasKeys.push('__umum__');

    containerEl.innerHTML = kelasKeys.map(function (key) {
      const items = groups[key];
      const label = key === '__umum__' ? 'Umum (Semua Kelas)' : 'Kelas ' + key;
      const kelasArg = key === '__umum__' ? '' : key;

      const semesterSections = ['1', '2'].map(function (semNum) {
        const rows = items
          .map(function (prota) {
            const promes = (prota.promes || []).find(function (p) { return String(p.semester) === semNum; });
            return promes ? { kategori: prota.kategori, promes: promes } : null;
          })
          .filter(Boolean);

        if (rows.length === 0) return '';

        const bodyRows = rows.map(function (row) {
          const probul = row.promes.probul || [];
          if (probul.length === 0) {
            return `
              <tr>
                <td>${row.kategori || 'N/A'}</td>
                <td colspan="6" class="kurikulum-semester-fallback-cell">Target: ${row.promes.target || '-'}${row.promes.deskripsi ? ' — ' + row.promes.deskripsi : ''}</td>
              </tr>
            `;
          }
          const byBulan = {};
          probul.forEach(function (p) { byBulan[parseInt(p.bulan)] = p.target; });
          const cells = [1, 2, 3, 4, 5, 6].map(function (b) {
            return `<td class="${b === 6 ? 'kurikulum-semester-eval-cell' : ''}">${byBulan[b] || '-'}</td>`;
          }).join('');
          return `<tr><td>${row.kategori || 'N/A'}</td>${cells}</tr>`;
        }).join('');

        return `
          <div class="kurikulum-semester-sem-block">
            <div class="kurikulum-semester-sem-title">Semester ${semNum === '2' ? 'II' : 'I'}</div>
            <div class="kurikulum-semester-table-wrap">
              <table class="kurikulum-semester-merged-table">
                <thead><tr><th>Materi</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr></thead>
                <tbody>${bodyRows}</tbody>
              </table>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="kurikulum-semester-kelas-block">
          <div class="kurikulum-semester-kelas-header">
            <span class="kurikulum-semester-kelas-title">${label}</span>
            <button class="kurikulum-semester-edit-btn" onclick="window.openModalEditProbulBulanan('${kelasArg}')">✎ Edit</button>
          </div>
          ${semesterSections || '<div class="kurikulum-semester-no-bulan">Belum ada semester.</div>'}
        </div>
      `;
    }).join('');
  };

  // Klik nama materi (mis. "1. Bacaan Al-Qur'an") langsung membuka rinciannya
  // INLINE tepat di bawah baris itu — tidak pindah tab, biar tetap kelihatan
  // di kartu Kelas yang sama. Klik lagi menutupnya. Hasil di-cache di
  // dataset.loaded supaya buka-tutup berulang tidak fetch ulang ke server;
  // cache di-invalidasi (dataset.loaded dihapus) begitu ada Add/Edit/Hapus
  // Semester lewat window.kurikulumRefreshMateriDetail_.
  window.toggleMateriDetail_ = function (rowEl) {
    const protaId = rowEl.dataset.protaId;
    const detailEl = document.getElementById('kurikulumMateriDetail_' + protaId);
    if (!detailEl) return;

    const isOpen = detailEl.style.display !== 'none';
    if (isOpen) {
      detailEl.style.display = 'none';
      rowEl.classList.remove('expanded');
      return;
    }

    rowEl.classList.add('expanded');
    detailEl.style.display = 'block';
    if (detailEl.dataset.loaded === '1') return;
    window.kurikulumRefreshMateriDetail_(protaId);
  };

  window.kurikulumRefreshMateriDetail_ = function (protaId) {
    const detailEl = document.getElementById('kurikulumMateriDetail_' + protaId);
    if (!detailEl) return;

    detailEl.innerHTML = '<div style="padding: 10px 4px; font-size: 12px; color: var(--text-faint);">Memuat semester...</div>';
    google.script.run
      .withSuccessHandler(function (result) {
        if (!result.success) {
          detailEl.innerHTML = '<div style="padding: 10px 4px; font-size: 12px; color: var(--red);">Gagal: ' + result.error + '</div>';
          return;
        }
        window.renderPromesInline_(detailEl, result.data, protaId);
        detailEl.dataset.loaded = '1';
      })
      .withFailureHandler(function (err) {
        detailEl.innerHTML = '<div style="padding: 10px 4px; font-size: 12px; color: var(--red);">Error: ' + err.message + '</div>';
      })
      .serverGetPromes(window.currentToken, protaId);
  };

  window.renderPromesInline_ = function (containerEl, data, protaId) {
    if (!data || data.length === 0) {
      containerEl.innerHTML = '<div style="padding: 0 4px 8px; font-size: 12.5px; color: var(--text-faint);">Belum ada semester untuk materi ini.</div>';
      return;
    }

    containerEl.innerHTML = data.map(promes => `
      <div class="kurikulum-promes-block">
        <div class="kurikulum-protes-row" onclick="event.stopPropagation();">
          <div>
            <div style="font-weight: 600;">Semester ${promes.semester}</div>
            <div style="font-size: 12px; color: var(--text-dim); margin-top: 4px;">Target: ${promes.target}</div>
            ${promes.deskripsi ? `<div style="font-size: 12px; color: var(--text-dim); margin-top: 4px;">${promes.deskripsi}</div>` : ''}
          </div>
        </div>
      </div>
    `).join('');
  };

  window.loadKurikulumProbul_ = function (kelompokId, bulan) {
    if (!bulan) {
      document.getElementById('kurikulumProbulList').innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-faint);">Pilih bulan terlebih dahulu</div>';
      return;
    }

    const tahun = new Date().getFullYear();
    window.showGlobalLoading_('Memuat program bulanan...');
    google.script.run
      .withSuccessHandler(function (result) {
        window.hideGlobalLoading_();
        if (!result.success) {
          document.getElementById('kurikulumProbulList').innerHTML = '<div style="color: var(--red);">Gagal: ' + result.error + '</div>';
          return;
        }
        window.lastProbulData = result.data;
        window.renderProbulList_(result.data);
      })
      .withFailureHandler(function (err) {
        window.hideGlobalLoading_();
        document.getElementById('kurikulumProbulList').innerHTML = '<div style="color: var(--red);">Error: ' + err.message + '</div>';
      })
      .serverGetProbul(window.currentToken, kelompokId, tahun, parseInt(bulan));
  };

  window.renderProbulList_ = function (data) {
    const list = document.getElementById('kurikulumProbulList');
    if (!data || data.length === 0) {
      list.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-faint);">Belum ada program bulanan</div>';
      return;
    }

    list.innerHTML = data.map(probul => `
      <div class="kurikulum-protes-row">
        <div>
          <div style="font-weight: 600;">${probul.kategori || 'N/A'}</div>
          <div style="font-size: 12px; color: var(--text-dim); margin-top: 4px;">Target: ${probul.target}</div>
          ${probul.deskripsi ? `<div style="font-size: 12px; color: var(--text-dim); margin-top: 4px;">${probul.deskripsi}</div>` : ''}
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-sm btn-secondary" onclick="window.editProbul('${probul.id}', '${probul.target}', '${(probul.deskripsi || '').replace(/'/g, '&#39;')}')">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="window.deleteProbul('${probul.id}')">Hapus</button>
          <button class="btn btn-sm btn-primary" onclick="window.loadPencapaianSantri_('${window.currentKelompokId}', '${probul.id}')">Lihat Progres →</button>
        </div>
      </div>
    `).join('');
  };

  window.loadPencapaianSantri_ = function (kelompokId, probulId) {
    if (!probulId) {
      document.getElementById('kurikulumPencapaianList').innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-faint);">Pilih materi bulan terlebih dahulu</div>';
      return;
    }

    document.getElementById('kurikulumTabPencapaian').style.display = 'block';
    document.querySelectorAll('.kurikulum-tab-btn')[3].classList.add('active');
    document.querySelectorAll('.kurikulum-tab-btn').forEach((b, i) => {
      if (i !== 3) b.classList.remove('active');
    });

    window.showGlobalLoading_('Memuat pencapaian santri...');
    google.script.run
      .withSuccessHandler(function (result) {
        window.hideGlobalLoading_();
        if (!result.success) {
          document.getElementById('kurikulumPencapaianList').innerHTML = '<div style="color: var(--red);">Gagal: ' + result.error + '</div>';
          return;
        }
        window.lastPencapaianData = result.data;
        window.renderPencapaianTable_(result.data);
      })
      .withFailureHandler(function (err) {
        window.hideGlobalLoading_();
        document.getElementById('kurikulumPencapaianList').innerHTML = '<div style="color: var(--red);">Error: ' + err.message + '</div>';
      })
      .serverGetPencapaianSantri(window.currentToken, kelompokId, probulId);
  };

  window.renderPencapaianTable_ = function (data) {
    const list = document.getElementById('kurikulumPencapaianList');
    if (!data || data.length === 0) {
      list.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-faint);">Belum ada data pencapaian</div>';
      return;
    }

    const html = `
      <table class="kurikulum-pencapaian-table">
        <thead>
          <tr>
            <th>No</th>
            <th>Nama Santri</th>
            <th>Status</th>
            <th>Catatan</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody>
          ${data.map((item, idx) => `
            <tr>
              <td>${idx + 1}</td>
              <td>${item.santri_nama || 'N/A'}</td>
              <td><span class="kurikulum-status-badge ${item.status}">${item.status === 'pending' ? 'Pending' : item.status === 'in_progress' ? 'Berlangsung' : 'Selesai'}</span></td>
              <td style="font-size: 12px;">${item.catatan_guru || '-'}</td>
              <td><button class="btn btn-sm btn-primary" onclick="window.openModalEditPencapaian('${item.id}', '${item.status}', '${(item.catatan_guru || '').replace(/'/g, '&#39;')}')">Edit</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    list.innerHTML = html;
  };

  /* ═══════════════════════════════════════════════════════════════════════════════
     KURIKULUM — Modal Functions
     ═════════════════════════════════════════════════════════════════════════════════ */

  window.openModalAddProta = function (kelasPreset) {
    document.getElementById('protaId').value = '';
    document.getElementById('protaTahun').value = new Date().getFullYear();
    document.getElementById('protaKategori').selectedIndex = 0;
    document.getElementById('protaKelas').value = kelasPreset || '';
    document.getElementById('protaKelas').disabled = false;
    document.getElementById('protaTarget').selectedIndex = 0;
    document.getElementById('protaDeskripsi').value = '';
    document.getElementById('modalAddProta').classList.add('active');
  };

  window.closeModalAddProta = function () {
    document.getElementById('modalAddProta').classList.remove('active');
  };

  window.openModalAddPromes = function (protaId) {
    document.getElementById('promesId').value = '';
    document.getElementById('promesProtaId').value = protaId;
    document.getElementById('promesSemester').value = '1';
    document.getElementById('promesTarget').value = '';
    document.getElementById('promesDeskripsi').value = '';
    document.getElementById('modalAddPromes').classList.add('active');
  };

  window.closeModalAddPromes = function () {
    document.getElementById('modalAddPromes').classList.remove('active');
  };

  window.openModalAddProbul = function () {
    document.getElementById('probulId').value = '';
    document.getElementById('probulPromesId').value = '';
    document.getElementById('probulBulan').value = new Date().getMonth() + 1;
    document.getElementById('probulKategori').value = '';
    document.getElementById('probulTarget').value = '';
    document.getElementById('probulDeskripsi').value = '';
    document.getElementById('modalAddProbul').classList.add('active');
  };

  window.closeModalAddProbul = function () {
    document.getElementById('modalAddProbul').classList.remove('active');
  };

  window.openModalEditPencapaian = function (pencapaianId, status, catatan) {
    document.getElementById('pencapaianId').value = pencapaianId;
    document.getElementById('pencapaianStatus').value = status;
    document.getElementById('pencapaianCatatan').value = catatan;
    document.getElementById('modalEditPencapaian').classList.add('active');
  };

  window.closeModalEditPencapaian = function () {
    document.getElementById('modalEditPencapaian').classList.remove('active');
  };

  /* ═══════════════════════════════════════════════════════════════════════════════
     KURIKULUM — Save/Delete Functions
     ═════════════════════════════════════════════════════════════════════════════════ */

  window.saveProta = function () {
    const protaId = document.getElementById('protaId').value;
    const tahun = document.getElementById('protaTahun').value;
    const kategori = document.getElementById('protaKategori').value;
    const kelas = document.getElementById('protaKelas').value;
    const target = document.getElementById('protaTarget').value;
    const deskripsi = document.getElementById('protaDeskripsi').value.trim();

    const kelasFilter = document.getElementById('kurikulumProtaKelas').value;
    window.showGlobalLoading_('Menyimpan...');
    const runner = google.script.run
      .withSuccessHandler(function (result) {
        window.hideGlobalLoading_();
        if (!result.success) {
          alert('Error: ' + result.error);
          return;
        }
        window.closeModalAddProta();
        window.loadKurikulumProta_(window.currentKelompokId, tahun, kelasFilter);
      })
      .withFailureHandler(function (err) {
        window.hideGlobalLoading_();
        alert('Error: ' + err.message);
      });

    if (protaId) {
      runner.serverUpdateProta(window.currentToken, protaId, target, deskripsi);
    } else {
      runner.serverAddProta(window.currentToken, window.currentKelompokId, parseInt(tahun), kategori, kelas, target, deskripsi);
    }
  };

  window.editProta = function (protaId, kategori, target, deskripsi, kelas) {
    document.getElementById('protaId').value = protaId;
    document.getElementById('protaKategori').value = kategori;
    document.getElementById('protaKelas').value = kelas || '';
    document.getElementById('protaKelas').disabled = true;
    document.getElementById('protaTarget').value = target;
    document.getElementById('protaDeskripsi').value = deskripsi || '';
    document.getElementById('modalAddProta').classList.add('active');
  };

  window.deleteProta = function (protaId) {
    if (!confirm('Hapus program tahunan ini?')) return;
    window.showGlobalLoading_('Menghapus...');
    google.script.run
      .withSuccessHandler(function (result) {
        window.hideGlobalLoading_();
        if (!result.success) {
          alert('Error: ' + result.error);
          return;
        }
        window.loadKurikulumProta_(window.currentKelompokId, document.getElementById('kurikulumProtaTahun').value, document.getElementById('kurikulumProtaKelas').value);
      })
      .withFailureHandler(function (err) {
        window.hideGlobalLoading_();
        alert('Error: ' + err.message);
      })
      .serverDeleteProta(window.currentToken, protaId);
  };

  window.savePromes = function () {
    const promesId = document.getElementById('promesId').value;
    const protaId = document.getElementById('promesProtaId').value;
    const semester = document.getElementById('promesSemester').value;
    const target = document.getElementById('promesTarget').value.trim();
    const deskripsi = document.getElementById('promesDeskripsi').value.trim();

    if (!target) {
      alert('Target harus diisi');
      return;
    }

    window.showGlobalLoading_('Menyimpan...');
    const runner = google.script.run
      .withSuccessHandler(function (result) {
        window.hideGlobalLoading_();
        if (!result.success) {
          alert('Error: ' + result.error);
          return;
        }
        window.closeModalAddPromes();
        delete document.getElementById('kurikulumMateriDetail_' + protaId).dataset.loaded;
        window.kurikulumRefreshMateriDetail_(protaId);
      })
      .withFailureHandler(function (err) {
        window.hideGlobalLoading_();
        alert('Error: ' + err.message);
      });

    if (promesId) {
      runner.serverUpdatePromes(window.currentToken, promesId, target, deskripsi);
    } else {
      runner.serverAddPromes(window.currentToken, protaId, parseInt(semester), target, deskripsi);
    }
  };

  window.editPromes = function (promesId, protaId, semester, target, deskripsi) {
    document.getElementById('promesId').value = promesId;
    document.getElementById('promesProtaId').value = protaId;
    document.getElementById('promesSemester').value = semester;
    document.getElementById('promesTarget').value = target;
    document.getElementById('promesDeskripsi').value = deskripsi;
    document.getElementById('modalAddPromes').classList.add('active');
  };

  window.deletePromes = function (promesId, protaId) {
    if (!confirm('Hapus program semester ini?')) return;
    window.showGlobalLoading_('Menghapus...');
    google.script.run
      .withSuccessHandler(function (result) {
        window.hideGlobalLoading_();
        if (!result.success) {
          alert('Error: ' + result.error);
          return;
        }
        delete document.getElementById('kurikulumMateriDetail_' + protaId).dataset.loaded;
        window.kurikulumRefreshMateriDetail_(protaId);
      })
      .withFailureHandler(function (err) {
        window.hideGlobalLoading_();
        alert('Error: ' + err.message);
      })
      .serverDeletePromes(window.currentToken, promesId);
  };

  window.saveProbul = function () {
    const promesId = document.getElementById('probulPromesId').value;
    const bulan = document.getElementById('probulBulan').value;
    const kategori = document.getElementById('probulKategori').value.trim();
    const target = document.getElementById('probulTarget').value.trim();
    const deskripsi = document.getElementById('probulDeskripsi').value.trim();

    if (!kategori || !target) {
      alert('Kategori dan target harus diisi');
      return;
    }

    window.showGlobalLoading_('Menyimpan...');
    google.script.run
      .withSuccessHandler(function (result) {
        window.hideGlobalLoading_();
        if (!result.success) {
          alert('Error: ' + result.error);
          return;
        }
        window.closeModalAddProbul();
        window.loadKurikulumProbul_(window.currentKelompokId, bulan);
      })
      .withFailureHandler(function (err) {
        window.hideGlobalLoading_();
        alert('Error: ' + err.message);
      })
      .serverAddProbul(window.currentToken, promesId, parseInt(bulan), kategori, target, deskripsi);
  };

  window.editProbul = function (probulId, target, deskripsi) {
    document.getElementById('probulId').value = probulId;
    document.getElementById('probulTarget').value = target;
    document.getElementById('probulDeskripsi').value = deskripsi;
    document.getElementById('modalAddProbul').classList.add('active');
  };

  window.deleteProbul = function (probulId) {
    if (!confirm('Hapus program bulanan ini?')) return;
    window.showGlobalLoading_('Menghapus...');
    google.script.run
      .withSuccessHandler(function (result) {
        window.hideGlobalLoading_();
        if (!result.success) {
          alert('Error: ' + result.error);
          return;
        }
        window.loadKurikulumProbul_(window.currentKelompokId, document.getElementById('kurikulumProbulBulan').value);
      })
      .withFailureHandler(function (err) {
        window.hideGlobalLoading_();
        alert('Error: ' + err.message);
      })
      .serverDeleteProbul(window.currentToken, probulId);
  };

  window.savePencapaian = function () {
    const pencapaianId = document.getElementById('pencapaianId').value;
    const status = document.getElementById('pencapaianStatus').value;
    const catatan = document.getElementById('pencapaianCatatan').value.trim();

    window.showGlobalLoading_('Menyimpan...');
    google.script.run
      .withSuccessHandler(function (result) {
        window.hideGlobalLoading_();
        if (!result.success) {
          alert('Error: ' + result.error);
          return;
        }
        window.closeModalEditPencapaian();
        alert('Pencapaian berhasil diupdate');
      })
      .withFailureHandler(function (err) {
        window.hideGlobalLoading_();
        alert('Error: ' + err.message);
      })
      .serverUpdatePencapaianSantri(window.currentToken, pencapaianId, status, catatan);
  };
</script>
